<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guaca</title>
    <script>
      const scene = new URLSearchParams(location.search).get("scene");
      localStorage.setItem("guaca.workspace.connection", JSON.stringify({ version: 1, mode: "local", origin: "http://127.0.0.1:54321", token: "t" }));
      localStorage.setItem("guaca.workspace.hostMode", "local");
      const colima = { context: "colima", label: "Colima", action: "Start Colima" };
      const desktop = { context: "desktop-linux", label: "Docker Desktop", action: "Open Docker Desktop" };
      const stalls = {
        engine: { kind: "engine", message: "Your host runs in Colima, which is not running.", engines: [colima] },
        back: { kind: "engine", message: "Your host runs in Colima, which is not running.", engines: [colima] },
        confirm: { kind: "engine", message: "Your host runs in Colima, which is not running.", engines: [colima] },
        confirmData: { kind: "engine", message: "Your host runs in Colima, which is not running.", engines: [colima] },
        gaveUp: { kind: "engine", message: "Your host runs in Colima, which is not running.", engines: [colima] },
        looking: { kind: "engine", message: "Guaca has not found your host yet. Colima is not running, so Guaca cannot look there.", engines: [colima] },
        choose: { kind: "choose", message: "Guaca found a host in more than one Docker engine on this Mac. Choose the one your agents are in.", engines: [colima, desktop] },
        missing: { kind: "missing", message: "Guaca looked for your host in Colima and Docker Desktop and did not find it." },
        image: { kind: "image", message: "The registry refused Guaca's host image, ghcr.io/madebywelch/guaca/guacad:0.5.1, so Guaca could not set up its host." },
      };
      window.__TAURI_INTERNALS__ = {
        metadata: { currentWindow: { label: "main" }, currentWebview: { label: "main" } },
        transformCallback: () => 0,
        invoke: async (cmd) => {
          if (cmd === "local_host_resume" || cmd === "local_host_choose") {
            if (scene === "connecting") return new Promise(() => {});
            throw stalls[scene];
          }
          if (cmd === "app_source") return { checkout: scene === "image" ? "/Users/robert/src/guaca" : null, unavailable: null, running: false, log: "" };
          if (cmd === "local_host_status") return scene === "back"
            ? { state: "running", message: "Docker is running. Your local host is available.", updateAvailable: false, engine: desktop, previous: colima }
            : { state: "unavailable", message: "Your host runs in Colima, which is not running.", updateAvailable: false, engine: colima };
          if (cmd === "local_host_elsewhere") return { from: colima, to: desktop, toEngine: "desktop-engine", data: scene === "confirmData" };
          if (cmd === "local_hosts") return [];
          return [];
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
