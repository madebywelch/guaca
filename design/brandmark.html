  width: 1.7rem;
  height: 1.7rem;
  border-radius: var(--radius-sm);
  border: 2px solid transparent;
  background: var(--swatch);
  padding: 0;
}

.swatch[aria-pressed="true"] {
  border-color: var(--text);
  box-shadow: 0 0 0 2px var(--raised) inset;
}

.picker {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(2.9rem, 1fr));
  gap: var(--space-2);
}

.picker__item {
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: var(--ground);
  padding: var(--space-2);
}

.picker__item:hover {
  background: var(--sunken);
}

.picker__item[aria-pressed="true"] {
  border-color: var(--accent, var(--flesh));
  background: color-mix(in oklab, var(--accent, var(--flesh)) 14%, var(--ground));
}

.empty {
  max-width: 26rem;
  margin: auto;
  text-align: center;
  padding: var(--space-8) var(--space-6);
}

/* Where a browser waits for its token: the whole viewport, with the form in
   the middle of it, because there is nothing else on screen to be beside. */
.threshold {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: var(--space-6);
}

.threshold .field,
.threshold .banner {
  margin: 0 0 var(--space-5);
  text-align: left;
}

.empty__title {
  font-family: var(--font-display);
  font-size: var(--type-lede);
  font-weight: 600;
  margin: var(--space-5) 0 var(--space-3);
}

.empty__body {
  font-size: var(--type-ui);
  color: var(--muted);
  line-height: var(--lead-read);
  margin: 0 0 var(--space-6);
}

.banner {
  margin: var(--space-5) var(--column-inset) 0;
  padding: var(--space-4) var(--space-5);
  border-radius: var(--radius-sm);
  border: 1px solid color-mix(in oklab, var(--pit) 38%, transparent);
  background: var(--pit-soft);
  color: var(--pit);
  font-size: var(--type-aside);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  flex: none;
}

.banner--error {
  border-color: color-mix(in oklab, var(--alarm) 40%, transparent);
  background: color-mix(in oklab, var(--alarm) 10%, transparent);
  color: var(--alarm);
}

.banner--ok {
  border-color: color-mix(in oklab, var(--mint) 40%, transparent);
  background: color-mix(in oklab, var(--mint) 10%, transparent);
  color: var(--mint);
}

/* The animation is charm; someone who has asked the OS to stop moving things
   should still get a usable app. */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
  .pulse {
    display: none;
  }
}

/* ==========================================================================
   The inspector

   What an agent has, beside what it says. A third column rather than a panel
   floating over the transcript: a desktop and a schedule are things you watch
   while reading, and the reading column keeps its measure either way.
   ========================================================================== */

.inspector {
  /* Capped for the same reason as `--rail-w`: it scales and the window's
     minimum does not. */
  width: min(20rem, 30vw);
  flex: none;
  display: flex;
  flex-direction: column;
  min-height: 0;
  /* The rail's ground, not the page's. These are the app's two edges and they
     have the same job: everything about an agent that is not what it said.
     Drawn on the page's own white it read as more transcript, which is the one
     thing it is not, and it made the window three surfaces wide. */
  border-left: 1px solid var(--rail-edge);
  background: var(--rail-ground);
}

/* Closed it is the tab and nothing else, still holding its own sliver of the
   window so the transcript does not reflow twice on every toggle. */
.inspector--closed {
  width: 2.1rem;
}

.inspector__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-4) var(--space-4) var(--space-3);
}

/* Centered between the two controls rather than after the back arrow, so it
   stays put as the arrow appears and disappears. */
.inspector__title {
  flex: 1;
  margin: 0;
  text-align: center;
  font-family: var(--font-display);
  font-size: var(--type-ui);
  font-weight: 500;
  color: var(--muted);
}

.inspector--closed .inspector__tab {
  margin: var(--space-4) auto 0;
}

.inspector__tab,
.inspector__gear {
  border: 0;
  background: none;
  cursor: pointer;
  color: var(--faint);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  font-size: var(--type-ui);
  line-height: var(--lead-flush);
  transition: color var(--tempo-tap) var(--ease), background var(--tempo-tap) var(--ease);
}

.inspector__tab:hover,
.inspector__gear:hover,
.inspector__tab:focus-visible,
.inspector__gear:focus-visible {
  color: var(--text);
  background: var(--sunken);
}

.inspector__body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 0 var(--space-5) var(--space-6);
}

/* --- memory --------------------------------------------------------------

   The one section every agent has something in, so it sits first. A page at
   most, in the same monospace the operator would edit it in, capped in height
   so a full memory cannot push a live desktop off the bottom of the panel.
   */

.memory {
  margin-bottom: var(--space-6);
}

.memory__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-4);
  margin-bottom: var(--space-3);
}

.memory__title {
  margin: 0;
  font-family: var(--font-ui);
  font-size: var(--type-ui);
  font-weight: 500;
  color: var(--muted);
}

/* Drawn only near the cap. Room running out is a fact and reads as one; room
   gone means the end of what is on screen will not be stored, which is a loss
   and is the one thing here allowed to be loud. */
.memory__room {
  font-size: var(--type-meta);
  color: var(--muted);
  text-align: right;
}

.memory__room[data-over] {
  color: var(--alarm);
}

/* Its own box rather than `.textarea` plus `.input--mono`: those are dialog
   sizes, and matching the panel would mean out-specifying two rules declared
   above this one, which is the trap `.dialog--file` has a note about. */
.memory__text {
  display: block;
  width: 100%;
  box-sizing: border-box;
  resize: none;
  /* Grown to its content in the component, and stopped here. Past this it
     scrolls: what is under it is a desktop somebody is watching. */
  max-height: 14rem;
  overflow-y: auto;
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  background: var(--sunken);
  color: var(--text);
  padding: var(--space-3) var(--space-4);
  font-family: var(--font-mono);
  font-size: var(--type-small);
  line-height: var(--lead-ui);
  outline: none;
}

.memory__text:focus {
  border-color: color-mix(in oklab, var(--flesh) 60%, var(--edge));
}

.memory__text::placeholder {
  color: var(--faint);
}

/* A skill is markdown an agent reads verbatim, so it is edited and read in
   the monospace the memory panel uses, and a long one scrolls in place. */
.textarea--code {
  font-family: var(--font-mono);
  font-size: var(--type-aside);
}

.skill__body {
  max-height: 20rem;
  overflow: auto;
  margin: var(--space-3) 0 0;
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  background: var(--sunken);
  font-family: var(--font-mono);
  font-size: var(--type-small);
  line-height: var(--lead-ui);
  white-space: pre-wrap;
}

.memory__actions {
  display: flex;
  gap: var(--space-3);
  margin-top: var(--space-3);
}

.memory__note {
  margin: var(--space-3) 0 0;
  font-size: var(--type-small);
  line-height: var(--lead-ui);
  color: var(--faint);
}

.memory__note code {
  font-family: var(--font-mono);
  font-size: 0.95em;
}

/* --- working notes -------------------------------------------------------
   Under the memory and deliberately lighter than it. Memory is a box you type
   into; this is a list you read, and giving it the same weight would say the
   two are the same kind of thing when the whole point is that they are not. */

.worknotes {
  margin-bottom: var(--space-6);
}

.worknotes__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-4);
  margin-bottom: var(--space-3);
}

.worknotes__title {
  margin: 0;
  font-family: var(--font-ui);
  font-size: var(--type-ui);
  font-weight: 500;
  color: var(--muted);
}

.worknotes__list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

/* The age is a column rather than a suffix, so a glance down the right-hand
   edge answers the question the list is actually for: how long has this been
   sitting here. Run into the text it has to be found in every line. */
.worknotes__note {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-4);
  font-size: var(--type-small);
  line-height: var(--lead-ui);
  color: var(--text);
}

.worknotes__body {
  min-width: 0;
}

/* The older notes are behind this, so it sits above them and reads as the top
   of the list rather than as a footer under it. */
.worknotes__rest {
  display: flex;
}

.worknotes__more {
  padding: 0;
  background: none;
  border: 0;
  color: var(--flesh);
  font-size: var(--type-fine);
  text-decoration: underline;
  text-underline-offset: 2px;
}

.worknotes__age {
  flex: none;
  font-size: var(--type-meta);
  color: var(--faint);
  font-variant-numeric: tabular-nums;
}

.worknotes__empty {
  margin: 0;
  font-size: var(--type-small);
  line-height: var(--lead-ui);
  color: var(--faint);
}

.worknotes__empty code {
  font-family: var(--font-mono);
  font-size: 0.95em;
}

/* --- the screen ----------------------------------------------------------

   One connection, two sizes. Going full screen promotes the stage inside this
   to fill the window rather than mounting a second one, so the desktop is never
   dropped and reconnected just because the operator wanted a better look. */

.screen {
  /* Shared with the space held open below, so the picture and the gap it leaves
     behind cannot disagree about how tall the screen is. */
  --screen-aspect: 16 / 10;

  /* The one surface in this app that is ink whichever surface the operator
     picked, and the only thing left holding the values the rail used to. A
     full-window frame around somebody else's desktop is a light-tight box on
     purpose: a pale chrome around a picture is a chrome the eye keeps reading
     instead of the picture. It cannot spend `--lift-*` either, because those
     resolve against the reading column and would put a paper-weight ring on a
     black surface. */
  --stage-ground: #0c0c0b;
  --stage-edge: #2b2a27;
  --stage-text: #faf8f3;
  --stage-muted: #9c9992;
  --stage-lift: 0 0.5rem 1.5rem -0.375rem rgb(0 0 0 / 0.45);

  margin-bottom: var(--space-6);
}

/* The stage leaves the flow to cover the window, so this holds the space it had.
   Without it the panel underneath jumps by the height of the screen the moment
   the screen opens, and jumps back when it closes. */
.screen[data-full="true"]::before {
  content: "";
  display: block;
  aspect-ratio: var(--screen-aspect);
}

/* What grows. The zoom is played from the corner the small picture had, which is
   also where FLIP puts it back to. */
.screen__stage {
  transform-origin: 0 0;
}

.screen__stage[data-zooming="true"] {
  transition: transform var(--tempo-move) var(--ease);
}

.screen__frame {
  position: relative;
  width: 100%;
  aspect-ratio: var(--screen-aspect);
  overflow: hidden;
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  background: var(--sunken);
}

.screen__frame iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

.screen__frame--empty {
  aspect-ratio: auto;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--space-4);
  padding: var(--space-5);
}

/* The offer under that note: one button, or two when the agent already has the
   place and can have it taken back. A row rather than the column above, which
   would stack them and read as two separate offers. */
.screen__offer {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
}

/* Transparent on purpose. The picture underneath is the whole point; this only
   exists so a click lands here instead of in the agent's desktop. */
.screen__veil {
  position: absolute;
  inset: 0;
  border: 0;
  background: transparent;
  cursor: zoom-in;
}

.screen__veil:hover,
.screen__veil:focus-visible {
  background: color-mix(in oklab, var(--flesh) 8%, transparent);
  outline: none;
}

.screen__caption {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin: var(--space-3) 0 0;
  font-size: var(--type-meta);
  color: var(--faint);
}

.screen__note {
  margin: 0;
  font-size: var(--type-small);
  line-height: var(--lead-ui);
  color: var(--muted);
}

.screen__state {
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--faint);
}

.screen__state[data-state="running"] {
  color: var(--mint);
}

/* Full screen. Fixed rather than a new subtree, which is what keeps the iframe
   above mounted and the VNC session alive across the change. The margin stays
   on the element left behind in the panel, which is still holding the space. */
/* Grown to fill the window, but not to the edges of it.
   The title bar is an overlay, so the macOS window controls float over whatever
   is drawn in the top-left corner: at `inset: 0` they landed on the title in
   this bar and on the picture below it. Insetting the stage leaves that corner
   showing the app, which is where those buttons belong, and has the side
   benefit of keeping the conversation visible around the edge so a maximized
   screen reads as something being worked on rather than as a new window. The
   top inset matches the rail's own, which is how the rest of the app already
   clears those controls. */
.screen[data-full="true"] .screen__stage {
  position: fixed;
  inset: 2.75rem 1rem 1rem;
  z-index: 40;
  display: flex;
  flex-direction: column;
  background: var(--stage-ground);
  border: 1px solid var(--stage-edge);
  border-radius: var(--radius);
  box-shadow: var(--stage-lift);
  overflow: hidden;
}

.screen[data-full="true"] .screen__frame {
  flex: 1;
  aspect-ratio: auto;
  border: 0;
  border-radius: 0;
  background: #000;
}

.screen__bar {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-4) var(--space-4) var(--space-4) var(--space-5);
  background: var(--stage-ground);
  border-bottom: 1px solid var(--stage-edge);
  color: var(--stage-text);
}

/* The actions, as one group rather than a row of equally-weighted buttons.
   What ends the session and what only closes the panel sit on either side of a
   divider, because the two were adjacent and identical and one of them cannot
   be undone. */
.screen__actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding-left: var(--space-4);
  margin-left: var(--space-2);
  border-left: 1px solid var(--rail-edge);
}

.screen__bar .screen__state {
  color: var(--stage-muted);
}

.screen__title {
  font-family: var(--font-display);
  font-size: var(--type-ui);
}

/* --- routines ------------------------------------------------------------

   A standing commitment, as a row you can read in one glance. The name and the
   cadence are what the list is for; the instruction it delivers is behind the
   row, because that is what you come back to change rather than what you check.
   */

.routines {
  margin: 0;
}

.routines__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  margin-bottom: var(--space-3);
}

.routines__title {
  margin: 0;
  font-family: var(--font-ui);
  font-size: var(--type-ui);
  font-weight: 500;
  color: var(--muted);
}

.routines__add {
  border: 0;
  background: none;
  cursor: pointer;
  color: var(--faint);
  font-size: var(--type-lede);
  line-height: var(--lead-flush);
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-sm);
  transition: color var(--tempo-tap) var(--ease), background var(--tempo-tap) var(--ease);
}

.routines__add:hover:not(:disabled),
.routines__add:focus-visible {
  color: var(--text);
  background: var(--sunken);
}

.routines__add:disabled {
  opacity: 0.35;
  cursor: default;
}

.routines__note {
  margin: var(--space-2) 0 0;
  font-size: var(--type-small);
  line-height: var(--lead-ui);
  color: var(--faint);
}

.routine {
  display: flex;
  align-items: flex-start;
  gap: var(--space-4);
  width: 100%;
  text-align: left;
  padding: var(--space-3) var(--space-3);
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  cursor: pointer;
  font: inherit;
  color: inherit;
}

.routine:hover,
.routine:focus-visible {
  background: var(--sunken);
  outline: none;
}

/* A clock face, drawn rather than set in a font: this is the only glyph in the
   list and a missing one leaves the rows misaligned. */
.routine__mark {
  flex: none;
  width: 0.85rem;
  height: 0.85rem;
  margin-top: var(--space-1);
  border: 0.1rem solid var(--mint);
  border-radius: 50%;
  position: relative;
}

.routine__mark::before,
.routine__mark::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 50%;
  width: 0.1rem;
  background: var(--mint);
  transform-origin: bottom center;
}

.routine__mark::before {
  height: 0.24rem;
  transform: translateX(-50%);
}

.routine__mark::after {
  height: 0.18rem;
  transform: translateX(-50%) rotate(95deg);
}

.routine__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  min-width: 0;
}

/* One line, always. A routine nobody named is titled by its instruction, and
   an instruction is written to be acted on with no other context: several
   sentences, which drew a list one routine tall. */
.routine__name,
.routine__when {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.routine__name {
  font-size: var(--type-ui);
  line-height: var(--lead-tight);
  color: var(--text);
}

.routine__when {
  font-size: var(--type-meta);
  color: var(--faint);
}

/* Switched off. Still drawn, because it is still something the operator set
   up and will want to find again. */
.routine[data-off] .routine__name {
  color: var(--faint);
}

.routine[data-off] .routine__mark {
  border-color: var(--faint);
}

.routine[data-off] .routine__mark::before,
.routine[data-off] .routine__mark::after {
  background: var(--faint);
}

/* A trigger that is not a clock: it waits to be told. The hands come off and
   the ring goes dashed, because a clock face drawn on something that keeps no
   place in the clock is the wrong thing to say at a glance, and the row beside
   it has no countdown to back the glyph up. */
.routine__mark[data-waiting] {
  border-color: var(--flesh);
  border-style: dashed;
}

.routine__mark[data-waiting]::after {
  display: none;
}

.routine__mark[data-waiting]::before {
  width: 0.22rem;
  height: 0.22rem;
  border-radius: 50%;
  background: var(--flesh);
  transform: translate(-50%, 50%);
}

/* The countdown is true but restless, and it is not what the row is about. */
.routine__next {
  opacity: 0.75;
}

/* --- one routine, with the panel given over to it -------------------------

   Everything about a routine is here rather than in a row that has to stay one
   line. Deciding whether to keep a standing commitment means reading the
   instruction that will actually be delivered, not a summary of it. */

.detail__actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-6);
  min-height: 1.6rem;
}

.detail__save {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-6);
}

/* A switch, not a checkbox: this is a thing that is on or off right now, and
   it acts on the click rather than waiting for a Save. */
.toggle {
  display: inline-flex;
  align-items: center;
  gap: var(--space-4);
  border: 0;
  padding: 0;
  background: none;
  font-size: var(--type-ui);
  color: var(--text);
}

.toggle__track {
  position: relative;
  width: 2rem;
  height: 1.1rem;
  flex: none;
  border-radius: var(--radius-pill);
  background: var(--edge);
  transition: background var(--tempo-tap) var(--ease);
}

.toggle__track::after {
  content: "";
  position: absolute;
  top: 0.15rem;
  left: 0.15rem;
  width: 0.8rem;
  height: 0.8rem;
  border-radius: 50%;
  background: var(--raised);
  box-shadow: var(--lift-1);
  transition: transform var(--tempo-tap) var(--ease);
}

.toggle[aria-checked="true"] .toggle__track {
  background: var(--flesh);
}

.toggle[aria-checked="true"] .toggle__track::after {
  transform: translateX(0.9rem);
}

.toggle:disabled {
  opacity: 0.5;
}

/* The trigger, in a box of its own so "when to run" reads as one fact rather
   than as two controls that happen to be adjacent. */
.when {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
  padding: var(--space-4) var(--space-4);
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  background: var(--raised);
}

/* The line an operator copies into whatever posts an event. Selectable as one
   piece, because the secret in it is forty characters nobody should retype. */
.webhook {
  margin: var(--space-3) 0 0;
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  background: var(--raised);
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  line-height: var(--lead-ui);
  color: var(--text);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  user-select: all;
}

.history {
  list-style: none;
  margin: 0;
  padding: 0;
}

.history__row {
  display: flex;
  align-items: baseline;
  gap: var(--space-3);
  padding: var(--space-2) 0;
  font-size: var(--type-small);
  color: var(--text);
  border-bottom: 1px solid var(--edge);
}

.history__row:last-child {
  border-bottom: 0;
}

.history__kind {
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--pit);
  background: var(--pit-soft);
  border-radius: var(--radius-pill);
  padding: var(--space-1) var(--space-3);
}

/* What a firing bought. On the row rather than behind a click, because it is
   the difference between a routine that is working and one whose instruction is
   being delivered to an agent that never runs, and the two rows are otherwise
   identical. */
.history__spend {
  display: inline-flex;
  align-items: baseline;
  gap: var(--space-2);
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  color: var(--faint);
}

.history__cost {
  color: color-mix(in oklab, var(--mint) 70%, var(--faint));
}

/* Delivered, and nothing ran. Drawn as a state rather than as "0 tokens": a
   zero in a column of numbers reads as a cheap run, not as a firing that never
   reached a model. */
.history__quiet {
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--pit);
}

.history__ago {
  margin-left: auto;
  font-size: var(--type-meta);
  color: var(--faint);
}

/* ==========================================================================
   The agent menu
   ========================================================================== */

/* Covers the window so the next click anywhere dismisses the menu, including
   the right-click that would otherwise open a second one. */
.menu__scrim {
  position: fixed;
  inset: 0;
  z-index: 50;
  border: 0;
  padding: 0;
  background: transparent;
  cursor: default;
}

.menu {
  position: fixed;
  z-index: 51;
  min-width: 10rem;
  padding: var(--space-2);
  background: var(--raised);
  border-radius: var(--radius-sm);
  box-shadow: var(--lift-2);
}

.menu__head {
  margin: 0;
  padding: var(--space-2) var(--space-4) var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--faint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Which model is answering. It used to sit under the agent's name over every
   message; here it is where somebody goes when a reply looks wrong. */
.menu__model {
  display: block;
  margin-top: var(--space-1);
  text-transform: none;
  letter-spacing: var(--track-flat);
  opacity: 0.8;
  overflow: hidden;
  text-overflow: ellipsis;
}

.menu__rule {
  border: 0;
  border-top: 1px solid var(--edge);
  margin: var(--space-2) 0;
}

.menu__item[data-tone="danger"] {
  color: var(--alarm);
}

.menu__item[data-tone="danger"]:hover,
.menu__item[data-tone="danger"]:focus-visible {
  background: color-mix(in oklab, var(--alarm) 10%, transparent);
}

.menu__item {
  display: block;
  width: 100%;
  text-align: left;
  padding: var(--space-3) var(--space-4);
  border: 0;
  border-radius: var(--radius-xs);
  background: none;
  cursor: pointer;
  font: inherit;
  font-size: var(--type-ui);
  color: var(--text);
}

.menu__item:hover,
.menu__item:focus-visible {
  background: var(--sunken);
  outline: none;
}

/* The one item that opens a menu instead of doing something. Positioned, so
   the crews hang off it rather than off the window: the menu itself is fixed
   wherever the click landed, and the submenu's place is a fact about the row. */
.menu__nest {
  position: relative;
}

/* The row that leads somewhere is the one row that is not only a label, so it
   is the one that lays itself out. The mark sits at the far edge with the whole
   gap between it and the words, which is what says the row opens rather than
   acts. */
.menu__nest .menu__item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
}

.menu__more {
  color: var(--faint);
}

.menu__sub {
  position: absolute;
  top: 0;
  left: 100%;
  z-index: 52;
  min-width: 9rem;
  /* A workspace can hold more crews than a window has room for, and a submenu
     that runs off the bottom is the failure the parent menu measures to
     avoid. Shifting up covers the rest; this covers a list longer than the
     window. */
  max-height: 60vh;
  overflow-y: auto;
  padding: var(--space-2);
  background: var(--raised);
  border-radius: var(--radius-sm);
  box-shadow: var(--lift-2);
}

/* The side is chosen after measuring, so a menu opened against the right edge
   of the window puts its crews on the left. */
.menu__sub[data-side="left"] {
  left: auto;
  right: 100%;
}

/* What the row makes, for the one menu whose items are not verbs on something
   already named at the top of it. */
.menu__detail {
  display: block;
  margin-top: var(--space-1);
  font-size: var(--type-meta);
  color: var(--faint);
}

/* ==========================================================================
   Search

   One panel over the whole window rather than a dropdown under the rail's
   field. What it searches is the workspace, not the sidebar, and a list of
   messages and files inside a 15rem column would be a list of ellipses.

   The field in the rail is a button dressed as an input: two real inputs would
   mean deciding which of them holds the query, and the answer is always the
   one in the panel.
   ========================================================================== */

.rail__search {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  width: calc(100% - var(--space-4) * 2);
  margin: var(--space-1) var(--space-4) var(--space-4);
  min-height: var(--control-h);
  padding: 0 var(--space-4);
  border: 1px solid var(--rail-edge);
  border-radius: var(--radius-sm);
  background: color-mix(in oklab, var(--rail-raised) 70%, transparent);
  color: var(--rail-muted);
  text-align: left;
  transition: background var(--tempo-tap) var(--ease), border-color var(--tempo-tap) var(--ease), color var(--tempo-tap) var(--ease);
}

.rail__search:hover {
  background: var(--rail-raised);
  border-color: color-mix(in oklab, var(--flesh) 45%, var(--rail-edge));
  color: var(--rail-text);
}

.rail__glass {
  font-size: var(--type-body);
  line-height: var(--lead-flush);
  opacity: 0.85;
}

.rail__search-label {
  flex: 1;
  font-size: var(--type-ui);
}

/* The shortcut is a reminder, not a control, so it recedes until the row is
   under the pointer. */
.rail__key {
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  letter-spacing: var(--track-caps);
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-xs);
  border: 1px solid var(--rail-edge);
  color: var(--rail-muted);
  opacity: 0.75;
}

/* Held near the top rather than centered: the list grows downward as it fills,
   and a panel that keeps recentring moves the row under the pointer. */
.scrim--palette {
  align-items: flex-start;
  padding-top: 12vh;
}

.palette {
  position: relative;
  width: min(42rem, 100%);
  max-height: min(34rem, 76vh);
  display: flex;
  flex-direction: column;
  background: var(--raised);
  border-radius: var(--radius);
  box-shadow: var(--lift-3);
  overflow: hidden;
}

.palette__query {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-5) var(--space-6);
  border-bottom: 1px solid var(--edge);
  flex: none;
}

.palette__glass {
  font-size: var(--type-lede);
  line-height: var(--lead-flush);
  color: var(--faint);
}

.palette__input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  background: none;
  font-family: var(--font-ui);
  font-size: var(--type-lede);
  color: var(--text);
}

.palette__input::placeholder {
  color: var(--faint);
}

.palette__tabs {
  display: flex;
  gap: var(--space-1);
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--edge);
  overflow-x: auto;
  flex: none;
  scrollbar-width: none;
}

.palette__tabs::-webkit-scrollbar {
  display: none;
}

.palette__tab {
  border: 0;
  background: none;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  min-height: var(--control-h-sm);
  padding: 0 var(--space-4);
  border-radius: var(--radius-pill);
  font-size: var(--type-ui);
  font-weight: 500;
  white-space: nowrap;
  transition: background var(--tempo-tap) var(--ease), color var(--tempo-tap) var(--ease);
}

.palette__tab:hover {
  background: var(--sunken);
  color: var(--text);
}

.palette__tab[aria-selected="true"] {
  background: var(--sunken);
  color: var(--text);
  font-weight: 600;
}

.palette__results {
  overflow-y: auto;
  padding: var(--space-3);
  flex: 1;
}

.palette__row {
  width: 100%;
  display: grid;
  grid-template-columns: 1.85rem 1fr auto;
  align-items: center;
  gap: var(--space-5);
  padding: var(--space-3) var(--space-4);
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  text-align: left;
}

/* One selected row, driven by the cursor rather than by hover, so the keyboard
   and the mouse cannot disagree about which row Enter would open. */
.palette__row[data-selected="true"] {
  background: var(--sunken);
}

.palette__face {
  display: grid;
  place-items: center;
  width: 1.85rem;
}

.palette__glyph {
  font-size: var(--type-body);
  line-height: var(--lead-flush);
  color: var(--faint);
}

.palette__text {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.palette__title {
  font-family: var(--font-display);
  font-size: var(--type-ui);
  font-weight: 600;
  letter-spacing: var(--track-tight);
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.palette__detail {
  font-size: var(--type-small);
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.palette__meta {
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  color: var(--faint);
  white-space: nowrap;
}

.palette__empty {
  padding: var(--space-7) var(--space-6);
  margin: 0;
  text-align: center;
  font-size: var(--type-ui);
  color: var(--muted);
}

/* Where a search result landed. Held long enough to find with the eye after
   the scroll, then dropped: a permanent mark would still be there next time
   the channel is opened, saying nothing. */
[data-found="true"] .msg,
[data-found="true"] .wire {
  background: color-mix(in oklab, var(--flesh) 14%, transparent);
  border-radius: var(--radius-sm);
  animation: found 1.8s var(--ease);
}

@keyframes found {
  0% {
    background: color-mix(in oklab, var(--flesh) 34%, transparent);
  }
  100% {
    background: color-mix(in oklab, var(--flesh) 14%, transparent);
  }
}

/* ==========================================================================
   Cafeteria

   A wider dialog than the rest, because this one is browsed rather than filled
   in: the operator is comparing fourteen agents, and a column that shows three
   at a time turns a glance into a scroll. The head and the foot are pinned so
   the group being hired into and the count are readable from anywhere in the
   list; only the stations move.
   ========================================================================== */

/* Focus lands here on open so the dialog owns the keyboard, but this is a
   landing spot rather than a control: the ring belongs on the tiles and the
   buttons inside, not around the whole panel. */
.dialog--cafeteria:focus,
.dialog--cafeteria:focus-visible {
  outline: none;
}

.dialog--cafeteria {
  width: min(58rem, 100%);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 3rem);
  padding: 0;
}

.cafeteria__head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--space-6);
  padding: var(--space-7) var(--space-7) var(--space-6);
  border-bottom: 1px solid var(--edge);
  flex: none;
}

.cafeteria__stations {
  overflow-y: auto;
  padding: var(--space-3) var(--space-7) var(--space-6);
  flex: 1;
}

.cafeteria__station {
  margin-top: var(--space-6);
}

.cafeteria__station-name {
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  font-weight: 500;
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--faint);
  margin: 0 0 var(--space-4);
}

.cafeteria__grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr));
  gap: var(--space-4);
}

/* One hireable agent. A button rather than a card with a checkbox in it: the
   whole tile is the target, and `aria-pressed` is what says it is a toggle
   instead of something that opens. */
.hire {
  display: grid;
  grid-template-columns: 2.6rem 1fr;
  align-items: start;
  gap: var(--space-5);
  text-align: left;
  padding: var(--space-5) var(--space-5);
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  background: var(--raised);
  transition: border-color var(--tempo-tap) var(--ease), background var(--tempo-tap) var(--ease), box-shadow var(--tempo-tap) var(--ease);
}

.hire:hover {
  border-color: color-mix(in oklab, var(--accent) 45%, var(--edge));
  background: var(--ground);
}

/* Selection is carried by the agent's own accent, so a picked crew reads as
   the colors that will be in the rail a moment later. */
.hire[aria-pressed="true"] {
  border-color: var(--accent);
  background: color-mix(in oklab, var(--accent) 9%, var(--raised));
  box-shadow: inset 0 0 0 1px var(--accent);
}

.hire__face {
  display: grid;
  place-items: center;
  padding-top: var(--space-1);
}

.hire__body {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.hire__name {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  font-family: var(--font-display);
  font-size: var(--type-body);
  font-weight: 600;
  letter-spacing: var(--track-tight);
  color: var(--text);
}

/* Said quietly and on purpose. Hiring a second Researcher is a thing operators
   do deliberately, so this reports what is already there rather than warning
   about it. */
.hire__already {
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  font-weight: 500;
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--faint);
  border: 1px solid var(--edge);
  border-radius: var(--radius-pill);
  padding: var(--space-1) var(--space-3);
}

.hire__tagline {
  font-size: var(--type-aside);
  line-height: var(--lead-tight);
  color: var(--muted);
}

.hire__skills {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-top: var(--space-1);
}

.hire__skill {
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  color: var(--muted);
  background: var(--sunken);
  border-radius: var(--radius-pill);
  padding: var(--space-1) var(--space-3);
}

.cafeteria__foot {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-6) var(--space-7);
  border-top: 1px solid var(--edge);
  flex: none;
}

.cafeteria__spacer {
  margin-left: auto;
}

/* Deleted agents in app settings. */

.compost__list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.compost__row {
  display: grid;
  grid-template-columns: 2.6rem minmax(0, 1fr);
  align-items: center;
  gap: var(--space-5);
  padding: var(--space-5) 0;
  border-bottom: 1px solid var(--edge);
}

.compost__row:last-child {
  border-bottom: 0;
}

.compost__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-width: 0;
}

.compost__name {
  display: flex;
  align-items: baseline;
  gap: var(--space-4);
  font-family: var(--font-display);
  font-size: var(--type-ui);
  font-weight: 600;
  letter-spacing: var(--track-tight);
  line-height: var(--lead-tight);
  color: var(--ink);
}

.compost__crew {
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  font-weight: 400;
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--faint);
}

.compost__clock {
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--faint);
}

/* The last week, said in the one color this app uses for something about to go
   wrong. Above a week the count of days is warning enough, and marking every
   row marks none of them. */
.compost__clock[data-soon="true"] {
  color: var(--alarm);
}

.compost__actions {
  grid-column: 2;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-3);
  flex: none;
}

/* ==========================================================================
   The calendar

   Guaca's own, and the one surface in the app that draws every crew at once.
   Built like the cafeteria — a panel owning its own height,
   with a head and a foot pinned to it and one scrolling half — because it is
   the same kind of thing: somewhere you go, look at the whole workspace, and
   come back from.

   Wider than either of them, because a row here carries four things (a time, a
   title, the crew it belongs to, where it is) and the time is a fixed column
   the titles have to line up against. Narrower than settings, because there is
   only ever one column of days.

   The time column is the whole layout. Every row's title starts at the same
   x whatever its time says, which is what makes a day scannable as a list of
   what rather than a list of when; without it `All day` and `3:00 – 4:00 PM`
   push their titles to two different places and the column visibly wanders.
   ========================================================================== */

.dialog--calendar:focus,
.dialog--calendar:focus-visible {
  outline: none;
}

.dialog.dialog--calendar {
  width: min(46rem, 100%);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 3rem);
  padding: 0;
}

.calendar__head {
  padding: var(--space-7) var(--space-7) var(--space-5);
  border-bottom: 1px solid var(--edge);
  flex: none;
}

.calendar__title-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-6);
}

.calendar__nav {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex: none;
}

/* A fieldset because it is one: a set of controls that only mean anything
   together. Its own border and padding are cleared, since what separates this
   row from the heading above it is air, not a box. */
.calendar__crews {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  margin: var(--space-5) 0 0;
  padding: 0;
  border: 0;
}

/* A filter, not a tab: picking one narrows what is drawn and picking it again
   is not how you get back — "All crews" is. So it is pressed rather than
   selected, and the pressed state is the accent's ground rather than the
   accent, because a row of amber chips would spend the one color that means
   "answer me" on a filter. */
.calendar__crew {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  height: var(--control-h-sm);
  padding: 0 var(--space-4);
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  background: var(--ground);
  font-family: var(--font-ui);
  font-size: var(--type-small);
  color: var(--muted);
  cursor: pointer;
  transition: background var(--tempo-tap) var(--ease), color var(--tempo-tap) var(--ease),
    border-color var(--tempo-tap) var(--ease);
}

.calendar__crew:hover {
  background: var(--sunken);
  color: var(--text);
}

.calendar__crew[aria-pressed="true"] {
  background: var(--flesh-soft);
  border-color: var(--flesh);
  color: var(--flesh);
}

.calendar__count {
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  letter-spacing: var(--track-caps);
  color: var(--faint);
}

.calendar__crew[aria-pressed="true"] .calendar__count {
  color: var(--flesh);
}

.calendar__body {
  overflow-y: auto;
  flex: 1;
  padding: var(--space-4) var(--space-7) var(--space-6);
}

.calendar__day {
  padding-top: var(--space-5);
}

/* The date sticks to the top of the scroll, so a month scrolled halfway still
   says which day you are looking at. It is the one thing in this panel that
   would otherwise leave the viewport while the rows it names are still in it. */
.calendar__date {
  position: sticky;
  top: 0;
  z-index: 1;
  margin: 0 0 var(--space-3);
  padding: var(--space-2) 0;
  background: var(--ground);
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  font-weight: 500;
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--muted);
}

.calendar__list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.occasion {
  display: grid;
  grid-template-columns: 9.5rem 1fr;
  align-items: baseline;
  gap: var(--space-5);
  width: 100%;
  padding: var(--space-4) var(--space-3);
  border: 0;
  border-radius: var(--radius-xs);
  background: none;
  text-align: left;
  cursor: pointer;
  transition: background var(--tempo-tap) var(--ease);
}

.occasion:hover {
  background: var(--sunken);
}

/* Drawn back rather than hidden. Something that happened this morning is still
   what today was, and a calendar that dropped it would be a calendar that
   empties itself as the day goes on. */
.occasion[data-past="true"] {
  opacity: 0.55;
}

.occasion__when {
  font-family: var(--font-mono);
  font-size: var(--type-meta);
  color: var(--muted);
  white-space: nowrap;
}

.occasion__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-width: 0;
}

.occasion__title {
  font-family: var(--font-ui);
  font-size: var(--type-ui);
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.occasion__meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4);
  font-size: var(--type-small);
  color: var(--faint);
}

/* The crew, which is the one thing on a row that says why one crew's agents
   cannot touch it. Marked out from the rest of the meta so it reads as the
   thing it belongs to rather than as another detail about it. */
.occasion__crew {
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--muted);
}

/* Opens under the list rather than over it, and does not scroll with it: what
   is being edited is a row the operator can still see, and a dialog over a
   dialog would hide the day it is being moved within. */
.calendar__editor {
  flex: none;
  padding: var(--space-6) var(--space-7);
  border-top: 1px solid var(--edge);
  background: var(--sunken);
  max-height: 55vh;
  overflow-y: auto;
}

.calendar__pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-5);
}

.calendar__actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.calendar__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-6);
  padding: var(--space-5) var(--space-7);
  border-top: 1px solid var(--edge);
  flex: none;
}

/* The one thing about this surface nobody would guess: the app has a Google
   Calendar plugin and this is not it. Said once, at the bottom, because it is
   the same sentence about every row. */
.calendar__note {
  margin: 0;
  font-size: var(--type-small);
  color: var(--faint);
  line-height: var(--lead-ui);
}

/* ==========================================================================
   Settings

   Settings stopped being one column the moment it stopped being one subject.
   An endpoint, a set of limits, a machine's credentials, how large the window
   draws and what is allowed to interrupt you are five different questions, and
   a single scroll made the operator read all five to change one.

   So it is the Cafeteria's shape: a panel that owns its own height with a head
   and a foot pinned to it, and one scrolling half. The nav is a vertical
   tablist rather than the palette's horizontal one because there are eight
   sections and they have names rather than one-word scopes.

   Save and Test live in the foot, outside the scrolling half, because they act
   on the whole panel and not on the section that happens to be open.
   ========================================================================== */

/* One height, not a height per section. Sized by its content under a
   `max-height`, the panel was a different size on every pane — tall on
   Provider, short on Appearance — so choosing a section resized the window
   under the cursor and the foot moved out from under the button you were about
   to press. A stated height, capped by the viewport, means the panes differ in
   what they scroll and in nothing else. */
.dialog--settings {
  width: min(52rem, 100%);
  display: flex;
  flex-direction: column;
  height: min(38rem, calc(100vh - 3rem));
  padding: 0;
}

/* Focus lands here on open so the dialog owns the keyboard, but this is a
   landing spot rather than a control: the ring belongs on the nav and the
   fields inside. */
.dialog--settings:focus,
.dialog--settings:focus-visible {
  outline: none;
}

.settings__head {
  padding: var(--space-7) var(--space-7) var(--space-6);
  border-bottom: 1px solid var(--edge);
  flex: none;
}

.settings__body {
  display: flex;
  min-height: 0;
  flex: 1;
}

.settings__nav {
  flex: none;
  width: 11rem;
  padding: var(--space-4) var(--space-4);
  border-right: 1px solid var(--edge);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  overflow-y: auto;
}

.settings__tab {
  border: 0;
  background: none;
  text-align: left;
  display: flex;
  align-items: center;
  min-height: var(--control-h);
  padding: 0 var(--space-4);
  border-radius: var(--radius-sm);
  font-size: var(--type-ui);
  color: var(--muted);
  transition: background var(--tempo-tap) var(--ease), color var(--tempo-tap) var(--ease);
}

.settings__tab:hover {
  background: var(--sunken);
  color: var(--text);
}

.settings__tab[aria-selected="true"] {
  background: var(--sunken);
  color: var(--text);
  font-weight: 600;
}

.settings__pane {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-6) var(--space-7) var(--space-7);
}

/* The one pane that holds a board rather than a column of fields. `.flow` is a
   flex column that scrolls itself and expects to be given a height, so the pane
   stops scrolling and becomes that column: two scroll containers, one inside
   the other, is a board whose header scrolls away and a run you cannot reach
   the bottom of. */
.settings__pane--board {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-bottom: var(--space-5);
}

.settings__title {
  font-family: var(--font-display);
  font-size: var(--type-body);
  font-weight: 600;
  margin: 0 0 var(--space-2);
}

.settings__lede {
  font-size: var(--type-aside);
  color: var(--muted);
  margin: 0 0 var(--space-6);
  line-height: var(--lead-ui);
  max-width: 34rem;
}

/* What an account has authorized, which is read from the service and never
   edited here. A list rather than the field rows above it, because none of it
   is a control: the ticking happens on guaca.bot, where the consent screens
   are. */
/* The state where a crew has a plugin available and the account behind it has
   nothing authorized. Said out loud rather than left as a hidden picker: an
   empty control that quietly does not appear is indistinguishable from a
   feature that is broken. */
.access__empty {
  display: grid;
  gap: var(--space-4);
  justify-items: start;
  margin-top: var(--space-4);
}

.settings__list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: var(--space-5);
}

.settings__list .field__label,
.settings__list .field__hint {
  display: block;
}

.api-key {
  border: 0;
  padding: 0;
  min-width: 0;
}

.api-key__saved,
.api-key__entry {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-4);
}

.api-key__saved {
  margin-bottom: var(--space-3);
}

.api-key__status {
  color: var(--mint);
  font-size: var(--type-ui);
  font-weight: 500;
}

.api-key__hint {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: var(--type-aside);
}

.api-key__entry .input {
  flex: 1;
  min-width: 0;
}

.settings__foot {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-4);
  padding: var(--space-6) var(--space-7);
  border-top: 1px solid var(--edge);
  flex: none;
}

/* The one action that belongs to a single pane rather than to the panel. It
   reads the endpoint, the key and the model, which are all in arm's reach of
   it here and were two sections away when it sat in the foot. */
.settings__probe {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  margin-top: var(--space-6);
}

/* A row of choices that are one choice: the surface, the scale. Radio
   semantics rather than a select, because the whole point is seeing the options
   at once and the set is always short. */
.secret-recipients {
  border: 0;
  padding: 0;
  margin: 0;
}

.choices {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.choice {
  border: 1px solid var(--edge);
  background: var(--raised);
  color: var(--muted);
  border-radius: var(--radius-sm);
  padding: var(--space-3) var(--space-5);
  font-size: var(--type-small);
  transition: border-color var(--tempo-tap) var(--ease), color var(--tempo-tap) var(--ease), background var(--tempo-tap) var(--ease);
}

.choice:hover:not([aria-pressed="true"]):not([aria-checked="true"]) {
  color: var(--text);
  border-color: color-mix(in oklab, var(--flesh) 40%, var(--edge));
}

/* A choice you have to see to make: three of the cast, drawn the way the
   choice would draw them, beside its name. */
.choice--cast {
  display: inline-flex;
  align-items: center;
  gap: var(--space-4);
}

.choice__crew {
  display: inline-flex;
  gap: var(--space-1);
}

/* Two words in a row that already carries a name and a sentence. The base
   size would make the pair as tall as the text beside them. */
.choice--tight {
  padding: var(--space-1) var(--space-4);
  font-size: var(--type-fine);
}

.choice:disabled {
  color: var(--faint);
  border-color: color-mix(in oklab, var(--edge) 60%, transparent);
  background: none;
  cursor: default;
}

.choice[aria-pressed="true"],
.choice[aria-checked="true"] {
  border-color: var(--flesh);
  background: color-mix(in oklab, var(--flesh) 10%, var(--raised));
  color: var(--text);
  font-weight: 600;
}

/* One switchable thing with a name and a reason, stacked. Used by the
   notification kinds, where there are five in a row and a `.field` each would
   put a third of the pane's height into labels. */
.switch-row {
  display: flex;
  align-items: flex-start;
  gap: var(--space-5);
  padding: var(--space-4) 0;
  border-bottom: 1px solid var(--edge);
}

.switch-row:last-of-type {
  border-bottom: 0;
}

.switch-row__text {
  min-width: 0;
  flex: 1;
}

.switch-row__label {
  display: block;
  font-size: var(--type-ui);
  color: var(--text);
}

.switch-row[data-off="true"] .switch-row__label {
  color: var(--faint);
}

.switch-row__hint {
  display: block;
  font-size: var(--type-small);
  color: var(--faint);
  margin-top: var(--space-1);
  line-height: var(--lead-ui);
}

/* One provider the operator can pick, with what is known about it. A button
   rather than a row of radio inputs because choosing one fills in a field
   rather than setting a value: it is an action with a current state. */
/* One line each. Stacked over two, at seven presets, the picker filled the
   whole pane and pushed the endpoint and the key below the fold — a shortcut
   for filling a field, hiding the field. */
.preset {
  display: flex;
  align-items: baseline;
  gap: var(--space-4);
  width: 100%;
  text-align: left;
  border: 1px solid var(--edge);
  background: var(--raised);
  border-radius: var(--radius-sm);
  padding: var(--space-3) var(--space-4);
  margin-bottom: var(--space-2);
  transition: border-color var(--tempo-tap) var(--ease), background var(--tempo-tap) var(--ease);
}

.preset:hover {
  border-color: color-mix(in oklab, var(--flesh) 40%, var(--edge));
}

.preset[aria-current="true"] {
  border-color: var(--flesh);
  background: color-mix(in oklab, var(--flesh) 8%, var(--raised));
}

.preset__text {
  min-width: 0;
  flex: 1;
  display: flex;
  align-items: baseline;
  gap: var(--space-4);
}

.preset__name {
  flex: none;
  font-size: var(--type-aside);
  color: var(--text);
}

/* Gives up its room first: the name is what the row is picked by, and a
   truncated URL still says which host it points at. */
.preset__url {
  min-width: 0;
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  color: var(--faint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Whether this one is usable right now. Never a reason not to choose it: a
   provider with no key is exactly what somebody about to paste a key is
   looking at, so the state is information rather than a refusal. */
.preset__state {
  flex: none;
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--faint);
}

.preset__state[data-ready="true"] {
  color: var(--mint);
}

/* The subscription row. Shaped like a preset because it is the same kind of
   choice, but a div rather than a button: it holds two or three buttons of its
   own, and a button inside a button is not a thing a browser will render or a
   screen reader can describe. */
.preset--plain {
  align-items: center;
  cursor: default;
}

.preset--plain:hover {
  border-color: var(--edge);
}

.preset__actions {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

/* The code the operator has to carry to a browser.
   Large and mono because it is copied by eye, one character at a time, and the
   two failure modes are a mistyped character and giving up. */
.devicecode {
  border: 1px solid var(--flesh);
  background: color-mix(in oklab, var(--flesh) 8%, var(--raised));
  border-radius: var(--radius-sm);
  padding: var(--space-5) var(--space-5);
  margin: var(--space-4) 0 var(--space-2);
}

.devicecode__lede {
  margin: 0 0 var(--space-4);
  font-size: var(--type-small);
  color: var(--text);
}

.devicecode__code {
  margin: 0 0 var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--type-display);
  letter-spacing: var(--track-caps-wide);
  color: var(--text);
  /* Selectable on purpose: retyping is where a fifteen-minute code is lost. */
  user-select: all;
}

.devicecode__url {
  margin: 0 0 var(--space-4);
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  color: var(--faint);
  overflow-wrap: anywhere;
  user-select: all;
}

/* The shortcuts table. A definition list, because that is what it is. */
.keys {
  margin: 0 0 var(--space-6);
}

.keys__group {
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  font-weight: 500;
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--muted);
  margin: var(--space-6) 0 var(--space-3);
}

.keys__row {
  display: flex;
  align-items: baseline;
  gap: var(--space-5);
  padding: var(--space-2) 0;
  border-bottom: 1px solid var(--edge);
}

.keys__row:last-child {
  border-bottom: 0;
}

.keys__what {
  flex: 1;
  font-size: var(--type-aside);
  color: var(--text);
}

.keys__combo {
  flex: none;
  font-family: var(--font-mono);
  font-size: var(--type-meta);
  color: var(--muted);
  background: var(--sunken);
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-3);
  white-space: nowrap;
}

/* About. Centered, because it is the one pane that is a statement rather than a
   set of controls. */
.about {
  text-align: center;
  padding: var(--space-6) 0 var(--space-4);
}

.about__name {
  font-family: var(--font-display);
  font-size: var(--type-title);
  font-weight: 600;
  margin: 0;
}

.about__version {
  font-family: var(--font-mono);
  font-size: var(--type-meta);
  color: var(--faint);
  margin: var(--space-2) 0 0;
}

.about__facts {
  margin: var(--space-6) 0 0;
  text-align: left;
}

.host-setup {
  max-width: 36rem;
  width: 100%;
  padding: var(--space-6);
}

.host-choice {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

/* Stretched by the column, a button is a bar with its label at the left end. */
.host-choice > .btn {
  align-self: flex-start;
}

/* Preflight draws a link as the text around it, and these are the only way to
   the update and recovery instructions. */
.host-choice a {
  color: var(--flesh);
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* The way back to a workspace from before hosts. Most operators never had one,
   so it sits under the decision rather than competing with it. */
.host-legacy > summary {
  color: var(--muted);
  font-size: var(--type-small);
}

.host-setup > .host-legacy {
  margin: var(--space-7) 0 0;
}

/* Where the agents run, as two cards rather than two buttons: the tradeoff is
   the choice, so each carries its own. They were solid buttons, the same fill
   as the one that commits, and read as a second action above it. */
.host-choice__places {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-4);
  border: 0;
  padding: 0;
  margin: 0;
}

.choice--place {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--space-2);
  text-align: left;
  padding: var(--space-5) var(--space-6);
}

.choice__name {
  font-size: var(--type-ui);
}

.choice__hint {
  font-weight: 400;
  color: var(--muted);
  line-height: var(--lead-ui);
}

/* What Docker says about this Mac, and only the actions that answer it. A
   stack, not a row: it was drawn as a provider preset, which is one line, and
   its five parts stood side by side in columns a word wide. */
.host-status {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  padding: var(--space-5) var(--space-6);
  border: 1px solid var(--edge);
  border-radius: var(--radius);
  background: var(--sunken);
  font-size: var(--type-aside);
  line-height: var(--lead-ui);
}

.host-status p {
  margin: 0;
}

.host-status__failure {
  color: var(--alarm);
  overflow-wrap: anywhere;
}

.host-status__update {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--space-4);
  padding-top: var(--space-5);
  border-top: 1px solid var(--edge);
}

.workspace-settings {
  display: flex;
  flex-direction: column;
  gap: var(--space-8);
}

/* Decisions are a destination, with the same paper and named rhythm as chat. */
.rail__for-you {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: var(--space-4) var(--space-5);
  padding: var(--space-5) var(--space-6);
  color: var(--rail-text);
  background: var(--rail-raised);
  border: 1px solid var(--rail-edge);
  border-radius: var(--radius-sm);
  font-size: var(--type-ui);
  cursor: pointer;
}
.rail__for-you span:last-child {
  color: var(--flesh);
  font-variant-numeric: tabular-nums;
}
.dialog.for-you {
  height: min(var(--measure-attention), calc(100dvh - var(--space-7) - var(--space-7)));
  max-height: calc(100dvh - var(--space-7) - var(--space-7));
  width: min(var(--measure-attention), calc(100vw - var(--space-8)));
  padding: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.for-you__head {
  flex-shrink: 0;
  padding: var(--space-7);
  background: var(--rail-ground);
  border-bottom: 1px solid var(--edge);
}
.for-you__title, .for-you__meta, .for-you__actions, .for-you__tabs {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-4);
}
.for-you__title {
  justify-content: space-between;
}
.for-you h2 {
  font-family: var(--font-display);
  font-size: var(--type-title);
}
.for-you h2 span {
  color: var(--flesh);
}
.for-you__tabs {
  margin-top: var(--space-6);
}
.for-you__tabs .btn[aria-pressed="true"] {
  background: var(--text);
  color: var(--ground);
}
.for-you__body {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}
.for-you__item, .for-you__requests, .for-you__later, .for-you__empty {
  padding: var(--space-7);
  border-bottom: 1px solid var(--edge);
}
.for-you__item h3 {
  font-size: var(--type-body);
  font-weight: 600;
  line-height: var(--lead-ui);
}
.for-you__item p, .for-you__head p {
  margin-top: var(--space-4);
  line-height: var(--lead-read);
}
.for-you__meta, .for-you__source, .for-you__foot {
  color: var(--muted);
  font-size: var(--type-small);
}
.for-you__meta {
  justify-content: space-between;
  margin-bottom: var(--space-4);
}
.for-you__due {
  color: var(--flesh);
  font-size: var(--type-small);
}
.for-you__actions, .for-you__source {
  margin-top: var(--space-6);
}
.for-you__actions input {
  flex: 1;
  min-width: 0;
}
.for-you__receipt {
  color: var(--mint);
  padding: var(--space-4) 0;
}
.for-you__foot {
  flex-shrink: 0;
  background: var(--rail-ground);
  padding: var(--space-6) var(--space-7);
  border-top: 1px solid var(--edge);
}
.for-you summary {
  cursor: pointer;
}
.for-you__item {
  overflow-wrap: anywhere;
}

.dialog.for-you:focus,
.dialog.for-you:focus-visible {
  outline: none;
}

.for-you__error {
  padding: var(--space-7);
}

.for-you__body > .for-you__receipt {
  padding: var(--space-5) var(--space-7);
}

/* A phone shows one workspace pane at a time. Keep the transcript mounted so
   drafts, scroll position and live events survive a trip to the agent list. */
.mobile-nav,
.mobile-crews,
.mobile-only {
  display: none;
}

/* CSS media queries cannot read custom properties. 48rem is the point where
   the two desktop columns leave too little room to read a conversation.
   Touch-only devices keep this navigation in landscape as well. */
@media (max-width: 48rem), (hover: none) and (pointer: coarse) {
  :root {
    --control-h: var(--control-touch);
    --control-h-sm: var(--control-touch);
    --column-inset: var(--space-5);
  }

  .app {
    position: fixed;
    top: var(--viewport-top, 0px);
    left: 0;
    width: 100%;
    height: var(--viewport-height, 100dvh);
    padding: var(--space-safe-top) var(--space-safe-right) var(--space-safe-bottom) var(--space-safe-left);
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    grid-template-columns: minmax(0, 1fr);
  }

  .mobile-only {
    display: flex;
  }

  .mobile-nav {
    grid-row: 2;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    padding: var(--space-2) var(--space-3);
    border-top: 1px solid var(--edge);
    background: var(--rail-ground);
  }

  .mobile-nav > button {
    min-height: calc(var(--control-touch) + var(--space-4));
    border: 0;
    border-radius: var(--radius);
    background: transparent;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    font-size: var(--type-small);
    font-weight: 500;
    cursor: pointer;
  }

  .mobile-nav [aria-current="page"] {
    background: var(--rail-raised);
    color: var(--text);
  }

  .mobile-nav svg {
    width: var(--space-7);
    height: var(--space-7);
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .mobile-nav__icon {
    position: relative;
    display: flex;
  }

  .mobile-nav__badge {
    position: absolute;
    left: 100%;
    top: calc(-1 * var(--space-2));
    padding: 0 var(--space-2);
    border-radius: var(--radius-pill);
    background: var(--flesh);
    color: var(--text);
    font-size: var(--type-meta);
  }

  .app > .rail,
  .app > main,
  .app > .inspector {
    grid-row: 1;
    min-height: 0;
  }

  .pane__identity {
    flex: 1;
    min-width: 0;
  }

  .pane__crew {
    color: var(--muted);
    font-size: var(--type-small);
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mobile-back {
    flex: none;
    min-width: var(--control-touch);
    font-size: var(--type-title);
    justify-content: center;
    align-items: center;
  }

  .mobile-details {
    flex: none;
  }

  .inspector__agent-name {
    font-weight: 600;
    flex: 1;
    min-width: 0;
    display: block;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .inspector__head > span:empty,
  .inspector__head > .inspector__gear {
    display: none;
  }

  .palette__query .btn {
    flex: none;
  }

  .pane__header > .avatar,
  .pane__more,
  .inspector__head > .inspector__tab:last-child,
  .rail__search,
  .rail__for-you,
  .rail__foot > button:last-child {
    display: none;
  }

  .app > .grail,
  .app:not([data-mobile-pane="agents"]) > .rail,
  .app:not([data-mobile-pane="conversation"]) > main,
  .app:not([data-mobile-pane="details"]) > .inspector {
    display: none;
  }

  .app > .rail,
  .app > .inspector {
    width: 100%;
    min-width: 0;
    border: 0;
  }

  .mobile-crews {
    display: flex;
    flex-direction: column;
    margin: 0 var(--space-6) var(--space-4);
  }

  .rail__brand {
    padding-top: var(--space-5);
  }

  .rail__gear {
    opacity: 1;
  }

  .agent-row {
    touch-action: pan-y;
    min-height: var(--control-touch);
  }

  .rail__search,
  .rail__new,
  .rail__gear,
  .pane__more,
  .inspector__tab,
  .inspector__gear,
  .composer__send,
  .composer__attach {
    min-width: var(--control-touch);
    min-height: var(--control-touch);
  }

  .pane__header {
    height: auto;
    min-height: var(--control-touch);
    padding: var(--space-3) var(--space-5);
    gap: var(--space-2);
  }

  .pane__title {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .msg {
    grid-template-columns: var(--space-7) minmax(0, 1fr);
    gap: var(--space-2) var(--space-4);
  }

  .msg[data-operator="true"] {
    grid-template-columns: minmax(0, 1fr);
    padding-right: var(--space-5);
    padding-left: var(--space-8);
  }

  .msg[data-operator="true"] .msg__body {
    grid-column: 1;
  }

  .msg .msg__at {
    grid-column: 2;
    grid-row: 2;
    opacity: 1;
  }

  .msg[data-operator="true"] .msg__at {
    grid-column: 1;
    justify-self: end;
  }

  .composer {
    margin: var(--space-4) var(--space-5);
  }

  .composer__row {
    align-items: flex-end;
  }

  .composer__foot {
    display: none;
  }

  input,
  select,
  textarea,
  .input,
  .palette__input {
    font-size: var(--type-touch);
  }

  .composer__input,
  .composer__mirror {
    font-size: var(--type-touch);
    max-height: 30dvh;
  }

  .banner,
  .settings__foot,
  .cafeteria__head,
  .cafeteria__foot,
  .calendar__title-row,
  .calendar__foot {
    flex-wrap: wrap;
  }

  .scrim {
    top: var(--viewport-top, 0px);
    bottom: auto;
    height: var(--viewport-height, 100dvh);
    padding: var(--space-safe-top) var(--space-safe-right) var(--space-safe-bottom) var(--space-safe-left);
  }

  .scrim > .dialog,
  .scrim > .palette {
    width: 100%;
    max-width: 100%;
    max-height: 100%;
    margin: auto;
    border-radius: 0;
    overflow-y: auto;
  }

  .scrim > .dialog--settings,
  .scrim > .dialog--cafeteria,
  .scrim > .dialog--calendar,
  .scrim > .for-you {
    height: 100%;
    padding: 0;
    overflow: hidden;
  }

  .settings__body {
    flex-direction: column;
  }

  .settings__nav {
    display: none;
  }

  .settings__section {
    flex: none;
    flex-direction: column;
    padding: 0 var(--space-5) var(--space-5);
  }

  .settings__tab {
    flex: none;
    white-space: nowrap;
  }

  .settings__head,
  .settings__pane,
  .settings__foot,
  .cafeteria__head,
  .cafeteria__stations,
  .cafeteria__foot,
  .calendar__head,
  .calendar__body,
  .calendar__foot {
    padding: var(--space-5);
  }

  .settings__pane {
    min-width: 0;
  }

  .cafeteria__grid,
  .calendar__pair,
  .occasion {
    grid-template-columns: minmax(0, 1fr);
  }

  .palette__results {
    max-height: 65dvh;
  }
}

/* The compatibility screen preserves the mounted workspace and unsent draft. */
.host-workspace:not([hidden]) { display: contents; }
.host-update-facts { display: grid; grid-template-columns: auto 1fr; gap: var(--space-2) var(--space-4); }
.host-update-facts dd { margin: 0; overflow-wrap: anywhere; }

/* skills.sh, inside a skills pane. The ranking is two hundred rows a page, so
   it scrolls in place rather than pushing the pane's own skills off screen. */
.directory__search {
  flex: 1;
  display: flex;
  justify-content: flex-end;
}

/* The height of the three rankings beside it, so the row reads as one control. */
.directory__search .input {
  min-height: var(--control-h-sm);
  padding: 0 var(--space-3);
  font-size: var(--type-small);
}

.directory__list {
  max-height: 28rem;
  overflow: auto;
  margin: 0;
  padding: 0;
  list-style: none;
}

.directory__entry {
  padding: var(--space-2) 0;
  border-top: 1px solid var(--edge);
}

.directory__reading {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding-top: var(--space-3);
}

.directory__audits {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  font-size: var(--type-fine);
}

/* The review page. Everything a creature needs comes from src/styles.css,
   which make.sh bundles ahead of this; what is here is the page around them
   and the two things the brand adds: the name beside the cast and the bubble
   over it. */

/* The app pins these to the window and hides the overflow, because the app
   scrolls inside its own panes. This page is one long document. */
html,
body,
#root {
  height: auto;
}

body {
  overflow: auto;
  margin: 0;
  background: #fff;
  color: var(--text);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
}

section {
  width: 1440px;
  padding: 48px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

section + section {
  border-top: 1px solid var(--rail-edge);
}

header {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  line-height: 20px;
  color: var(--muted);
}

header span:first-child {
  letter-spacing: 0.12em;
}

h2 {
  margin: 0 0 14px;
  font: 600 28px/34px var(--font-display);
}

h3 {
  margin: 0 0 14px;
  font-weight: 400;
  font-size: 14px;
  line-height: 20px;
  letter-spacing: 0.08em;
  color: var(--muted);
}

p {
  margin: 0 0 12px;
  font-size: 17px;
  line-height: 27px;
  color: var(--muted);
}

/* --- the mark ------------------------------------------------------------- */

.bm-mark {
  display: inline-flex;
  align-items: center;
  position: relative;
}

.bm-mark__cast {
  display: inline-flex;
  align-items: center;
  position: relative;
}

.bm-actor {
  transition: opacity 220ms var(--ease);
}

.bm-mark__name {
  display: inline-block;
  overflow: hidden;
  white-space: nowrap;
}

.bm-mark__word {
  display: inline-block;
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1;
  padding-bottom: 0.08em;
  color: var(--rail-text);
}

/* The app's shout, grown to carry a name: the creature's own pigment, the
   corner nearest the speaker left square, in and out once. */
.bm-mark__says {
  position: absolute;
  /* Beside the face rather than over it: in the title bar there is no room
     above a creature, only the window's edge. */
  left: 94%;
  bottom: 34%;
  padding: 0.18em 0.5em 0.24em;
  border-radius: 0.5em 0.5em 0.5em 0.08em;
  font-family: var(--font-display);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.01em;
  color: #16201a;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transform-origin: 0 100%;
}

.bm-mark__says.on {
  animation: brand-says 2.3s var(--ease) forwards;
}

@keyframes brand-says {
  0% {
    opacity: 0;
    transform: translateY(0.2em) scale(0.6);
  }

  12% {
    opacity: 1;
    transform: translateY(0) scale(1.08);
  }

  20% {
    transform: scale(1);
  }

  82% {
    opacity: 1;
    transform: scale(1);
  }

  100% {
    opacity: 0;
    transform: scale(0.96);
  }
}

/* --- a direction ---------------------------------------------------------- */

.bm-stage {
  height: 300px;
  background: var(--rail-ground);
  display: flex;
  align-items: center;
  padding: 0 112px;
}

.bm-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: -12px;
}

.bm-controls button {
  font: 500 13px/18px var(--font-ui);
  padding: 6px 12px;
  border: 1px solid var(--rail-edge);
  border-radius: 999px;
  background: #fff;
  color: var(--text);
  cursor: pointer;
}

.bm-controls button[aria-pressed="true"] {
  background: var(--text);
  border-color: var(--text);
  color: #fff;
}

.bm-controls__rule {
  width: 1px;
  height: 20px;
  background: var(--rail-edge);
  margin: 0 6px;
}

.bm-foot {
  display: flex;
  justify-content: space-between;
  gap: 64px;
  padding-top: 8px;
}

.bm-why {
  width: 600px;
}

.bm-beats {
  list-style: none;
  margin: 18px 0 0;
  padding: 0;
  display: grid;
  gap: 6px;
  font-size: 15px;
  line-height: 22px;
  color: var(--text);
}

.bm-beats li span {
  display: inline-block;
  width: 48px;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--faint);
}

/* --- the top of the rail, to the app's own measurements -------------------- */

.bm-zoom {
  zoom: 2;
}

.bm-railtop {
  width: 248px;
  background: var(--rail-ground);
  border: 1px solid var(--rail-edge);
  border-radius: 10px 0 0 0;
  padding-bottom: 12px;
  color: var(--rail-text);
}

.bm-railtop__band {
  height: 36px;
  display: flex;
  align-items: center;
  padding-right: 16px;
}

.bm-lights {
  display: inline-flex;
  gap: 8px;
  padding-left: 13px;
  flex: none;
}

.bm-lights i {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ff5f57;
  box-shadow: inset 0 0 0 0.5px rgb(0 0 0 / 0.12);
}

.bm-lights i:nth-child(2) {
  background: #febc2e;
}

.bm-lights i:nth-child(3) {
  background: #28c840;
}

.bm-railtop__mark {
  margin-left: 14px;
  display: inline-flex;
  align-items: center;
}

.bm-railtop__band .bm-plus {
  margin-left: auto;
}

.bm-railtop__brand {
  padding: 0 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* 33px: the rail sets no line-height of its own, so the wordmark inherits
   Tailwind's 1.5 from the root, and that line box is the row's height. */
.bm-railtop__wordmark {
  font: 600 22px/33px var(--font-display);
  letter-spacing: 0.18em;
}

.bm-plus {
  flex: none;
  width: 25.6px;
  height: 25.6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--rail-edge);
  background: var(--rail-raised);
  border-radius: 3px;
  font-size: 17px;
  line-height: 1;
}

/* `.rail__search`: 2px over, 8px either side and under, 36px tall. */
.bm-railtop__search {
  margin: 2px 8px 8px;
  height: 36px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  border: 1px solid var(--rail-edge);
  border-radius: 3px;
  background: var(--rail-raised);
  font-size: 13px;
  color: var(--rail-muted);
}

.bm-railtop__crew {
  padding: 4px 16px 6px;
  font: 600 11px/16px var(--font-ui);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--rail-muted);
}

.bm-railtop__row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 16px;
  font-size: 15px;
  line-height: 20px;
}

/* --- the corner ----------------------------------------------------------- */

.bm-corner {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.bm-corner__pair {
  display: flex;
  gap: 40px;
}

figure {
  margin: 0;
}

figcaption {
  margin-bottom: 12px;
  font-size: 14px;
  line-height: 20px;
  color: var(--muted);
}

.bm-corner > .bm-why {
  width: 760px;
}

@media (prefers-reduced-motion: reduce) {
  .bm-actor {
    transition: none;
  }

  /* The app's own rule ends every animation at once under reduced motion,
     and a finished one holds its last frame, which here is invisible. So the
     bubble has no animation at all, and is simply there while the pointer is. */
  .bm-mark__says.on {
    animation: none;
  }

  .bm-mark[data-hover] .bm-mark__says {
    opacity: 1;
  }
}
</style>
