/* ==========================================================================
   Guaca design tokens

   Ink on paper, and one amber that only ever means the app wants something
   from a person. There is no second surface color and no tinted panel: what
   carries hierarchy is size, weight and air, which is why the type ladder
   below is wider than a chat app usually needs and why the reading anchor is
   17px rather than 15. A transcript with room around it reads as one thing at
   a time. A dense one reads as a wall, and this app is mostly machines
   talking, so the wall is the failure mode it falls into by default.

   The accent is the whole color system. `--flesh` is the amber, `--pit` is a
   cold slate beside it for anything the system says about itself, and
   everything else on screen is ink, paper or one of three grays. That is the
   discipline the rest of it hangs off: spend amber on decoration and it stops
   meaning "answer me", and the one thing this app must never do is ask
   quietly.

   The token names are the old ones. `--flesh` was ripe avocado and is now the
   signal amber; 71 rules read it, and renaming a color is a mechanical change
   worth doing on its own rather than folded into a change of mind about what
   the color is.

   Paper is the default and does not win in a dark room, which is the whole
   reason the reading column is a token block behind `data-surface` rather
   than a set of literals. The two navigation columns are part of that
   question rather than exempt from it: they are the same ground as each
   other, a shade off the page, and they move with it. They used to be ink
   under both surfaces and pin their own accents against the reading column,
   which is what made the left edge of the app look like a different app from
   the right edge of it.

   Type is three roles, not one. Instrument Sans carries names and titles,
   where a tight fit at a large size is the point. Inter carries everything
   you actually read for minutes at a time. JetBrains Mono carries the machine
   texture: times, hops, routes, code. All three ship with the app, so the
   window looks the same on every machine and needs no network.
   ========================================================================== */

:root {
  /* The navigation columns, both of them. They were one dark column on the
     left with a white page beside it and a white panel on the right, which is
     three surfaces for two jobs: the app's own two edges did not look like
     each other, and the heavier of them was the one carrying the least
     reading. So the rail and the inspector are the same ground, a shade off
     the page rather than opposite it, and the page is the only white thing on
     screen. What is left with any saturation in it is an agent's own color and
     the one amber, which is the whole point: a column that is itself a color
     is a column every agent's color is competing with.

     They follow the surface now rather than pinning ink under both of them,
     which is why the dark block below redeclares all seven. */
  --rail-ground: #f5f3ee;
  --rail-raised: #ffffff;
  --rail-edge: #e5e2da;
  --rail-text: #0b0b0a;
  --rail-muted: #54524d;
  --rail-wire: #ded9d0;
  /* Recessed from a column, which is not the same value as recessed from the
     page: `--sunken` is a hair off white, which is a field on paper and
     nothing at all on an off-white panel. */
  --rail-sunken: #eae7df;
  /* A shade under the rail. The crews sit behind the crew, and a column that
     is the same ground as the one it borders needs a rule drawn between them
     to be a second surface at all. */
  --grail-ground: #eceae2;

  /* The reading surface, and the only half of the app a surface choice moves.
     Messages are long-form text read for minutes at a time, and paper is the
     right ground for that in a lit room; the dark block below is the same seven
     names and nothing else, which is what keeps "dark" from meaning "repaint
     the app".

     `--ground` and `--raised` are both white, and that is the decision rather
     than an oversight: a card here is separated by a rule or by the lift's
     ring, never by being a slightly different white. Two whites a percent
     apart is exactly the kind of thing that accretes into 41 font sizes, and
     it buys nothing a border does not. `--sunken` is the one recessed value,
     and it is warm rather than gray so the page does not read as blue. */
  --ground: #ffffff;
  --raised: #ffffff;
  --sunken: #f4f3f0;
  --edge: #e2e0da;
  --text: #0b0b0a;
  --muted: #54524d;
  --faint: #8a877f;

  --flesh: #b4530a;
  --flesh-soft: #fdeed9;
  --pit: #2f4858;
  --pit-soft: #e9eff3;
  --mint: #14713f;
  --alarm: #c1271b;

  --font-display: "Instrument Sans Variable", "Inter Variable", system-ui, sans-serif;
  --font-ui: "Inter Variable", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono Variable", ui-monospace, SFMono-Regular, Menlo, monospace;

  /* Every length in this file is a rem, so the operator's interface scale is
     one root font size and this is the multiplier behind it. A number rather
     than a size, because it is also what a script would read back. */
  --ui-scale: 1;
  --measure-attention: 46rem;
  --control-touch: 2.75rem;
  --type-touch: max(16px, 1rem);
  --space-safe-top: env(safe-area-inset-top, 0px);
  --space-safe-bottom: env(safe-area-inset-bottom, 0px);
  --space-safe-left: env(safe-area-inset-left, 0px);
  --space-safe-right: env(safe-area-inset-right, 0px);

  /* ---- Type ---------------------------------------------------------------
     Ten roles, whole pixels at scale 1, no two closer than 1px.

     This was 41 sizes, 38 of them between 8px and 18px: one every 0.27px.
     Nobody chose those. They accreted, one rule at a time, each picked to sit
     a little under the rule beside it, and the result is an interface where
     nothing lines up with anything and no two people writing a new panel would
     land on the same number. The set is small because the app multiplies every
     rem by `--ui-scale`: 41 sizes is 41 rounding errors at every scale an
     operator can pick, and gaps of a quarter pixel do not survive one.

     A step is named for the job, not for its rank, because the job is what a
     rule knows about itself.

     The ladder is wider than it was and the whole of it moved up: the bottom
     four steps are the mono furniture and stayed where they were, because a
     timestamp is not something anybody reads at length, and everything above
     them grew. That is the one change that makes hierarchy legible without a
     panel, a tint or a border doing it, and it is why the four sizes between
     13px and 17px are four rather than the eleven this file used to have. */
  --type-mark: 0.5625rem; /* 9px.  Uppercase mono: eyebrows, states, counts. */
  --type-fine: 0.625rem; /* 10px. Timestamps, keycaps, field labels. */
  --type-meta: 0.6875rem; /* 11px. Chips, routes, hop lines. */
  --type-small: 0.8125rem; /* 13px. Hints, captions, dense secondary text. */
  --type-aside: 0.875rem; /* 14px. Second lines, notes, previews. */
  --type-ui: 0.9375rem; /* 15px. Every control, and names in a list. */
  --type-body: 1.0625rem; /* 17px. Messages and markdown. The anchor. */
  --type-lede: 1.375rem; /* 22px. Dialog and pane titles. */
  --type-title: 1.75rem; /* 28px. A name standing on its own. */
  --type-display: 2.25rem; /* 36px. The rare big thing. */

  /* Tracking is a function of the step and the case, never a free parameter.
     It was 18 values, six of them the same uppercase-label job at 0.1, 0.11,
     0.12, 0.14, 0.16 and 0.18em. */
  --track-tight: -0.02em; /* Display face at title sizes, and agent names. */
  --track-flat: -0.01em; /* Anything read as words. */
  --track-caps: 0.1em; /* Uppercase labels. The default for caps. */
  --track-caps-wide: 0.18em; /* Section heads, the wordmark, a typed code. */

  /* Leading, four steps. `--lead-flush` is a glyph or a single line in a box
     already the right height; it is not typography and it is not 0, which is
     the inline-descender reset a few SVG wrappers still want. */
  --lead-flush: 1;
  --lead-tight: 1.2; /* Headings and names. */
  --lead-ui: 1.4; /* Short text that may wrap to a second line. */
  /* Tighter than it was, because the text under it is two points larger: leading
     is a ratio and 1.6 of 17px is a gap you read across rather than down. */
  --lead-read: 1.55; /* Paragraphs, code blocks, anything read at length. */

  /* ---- Space --------------------------------------------------------------
     Eight steps on a 2px base. This was 41 padding lengths, 32 pairs of them
     within a pixel of each other, plus 20 gaps: 0.28, 0.32, 0.34, 0.36, 0.38,
     0.42, 0.45 and 0.48rem all existed, and no one of them is a decision
     anybody could defend against the step above or below it. */
  --space-1: 0.125rem; /* 2px */
  --space-2: 0.25rem; /* 4px */
  --space-3: 0.375rem; /* 6px */
  --space-4: 0.5rem; /* 8px */
  --space-5: 0.75rem; /* 12px */
  --space-6: 1rem; /* 16px */
  --space-7: 1.5rem; /* 24px */
  --space-8: 2.25rem; /* 36px */

  /* The reading column's own rhythm, which is not spacing and does not belong
     on the step scale: these are the lanes a transcript is drawn in, and every
     row in it has to agree with every other or the column visibly wanders.
     The indent is derived rather than written, because it was 2.85rem in four
     places and is the one number that cannot be allowed to drift from the
     portrait lane it sits behind. */
  --column-inset: 1.5rem;
  --column-face: 1.7rem;
  --column-indent: calc(var(--column-inset) + var(--column-face));

  /* Capped against the viewport as well as scaled, because both of these grow
     with the scale and the window's own minimum does not. At the largest scale
     in the smallest window they would otherwise leave the reading column
     narrower than a message can draw. */
  --rail-w: min(15.5rem, 28vw);
  /* The crews' own column, which holds one circle across and nothing else, so
     it is capped in the same proportion as the rail beside it. It is drawn
     over the rail rather than beside it, so this is not width the layout
     spends: `--grail-lip` is. */
  --grail-w: min(4rem, 8vw);
  /* What the column leaves behind when it is in. Enough to read as a surface
     at the edge of the window and not enough to be a column. */
  --grail-lip: 0.5rem;
  /* How far in the pointer comes before the column does. Wider than the band,
     because what it is aiming at is the edge of the window rather than the
     band itself, and half a rem is not a target. */
  --grail-reach: 1.25rem;

  /* ---- Radius -------------------------------------------------------------
     Radius says what a box *is*, not how big it happens to be: a thing inside
     a control, a control, a surface. Three steps, near-square, because this
     system separates things with rules and air rather than with rounded
     containers: at 4px a card reads as a region of the page, and at 11px it
     read as an object floating on top of one. The scale is kept rather than
     flattened to zero, since a 0 here would take the softening off a chart
     mark and a keycap as well, which are the two places the shape is doing
     something other than framing. */
  --radius-xs: 0.125rem; /* Inside a control: menu row, chip, keycap, tag. */
  --radius-sm: 0.1875rem; /* The control: button, input, select, search. */
  --radius: 0.25rem; /* A surface: card, dialog, bubble, panel. */
  --radius-pill: 999px; /* One spelling. `99px` was not a second one. */

  /* ---- Controls -----------------------------------------------------------
     One height ladder, so a button beside an input lines up without anybody
     measuring padding. `.btn` was ~30px and the `.input` next to it ~34px,
     because one was given 0.38rem of vertical padding and the other 0.48rem.
     Height is the token; vertical padding falls out of it, which is why no
     control below sets any. */
  --control-h: 2.25rem; /* 36px. The default. */
  --control-h-sm: 1.75rem; /* 28px. Dense rows, inline controls, the send. */

  /* ---- Motion -------------------------------------------------------------
     One curve, three tempos. Cohesion is mostly this: every surface in the app
     arriving on the same curve, at a speed set by how far it travelled. There
     were 8 durations and 5 curves and no token; `--ease` is promoted from the
     one already used most rather than invented.

     The second is for anything that loops or travels: an orb breathing, a dot
     running down a wire, a mark pulsing beside a head. Those want to leave as
     fast as they arrive, which is the one thing a decelerating curve cannot
     do, and a loop built on `--ease` visibly stalls at the top of every cycle.

     There was a third, a spring, and it is gone rather than kept beside these
     two. It existed for the one register CSS no longer holds: a character
     having a physical reaction. A creature is now a shape recomputed every
     frame in `avatars/form.ts`, so its overshoot is a spring in the geometry
     and its recoil is a displacement of the outline. A curve here could not
     have expressed either, and an unused token is a decision somebody would
     eventually spend on a panel.

     Every easing in this file is one of these two, `linear`, or `steps()`. A
     third has to argue it is a register rather than a preference. */
  --ease: cubic-bezier(0.18, 0.9, 0.22, 1);
  --ease-loop: cubic-bezier(0.35, 0, 0.3, 1);

  --tempo-tap: 110ms; /* Nothing moves: color, background, border, opacity. */
  --tempo-move: 180ms; /* Something changes position or size in place. */
  --tempo-enter: 300ms; /* A surface arrives. */

  /* How far a surface travels before it lands. One distance, so a menu and a
     dialog are one gesture at two sizes rather than two gestures. */
  --pop-rise: 0.5rem;
  /* Set by whatever is popping. A menu pins this to the corner nearest the
     button that opened it, so it grows out of the thing that was pressed; a
     dialog leaves it centered. This is the difference between an app that
     feels like one mechanism and one where every surface arrives from
     nowhere. */
  --pop-origin: center;

  /* What a dialog is separated from the page by. A token because the answer is
     different on dark paper, where a near-black wash over a near-black page
     separates nothing. */
  --scrim: rgb(11 11 10 / 0.5);

  /* ---- Elevation ----------------------------------------------------------
     Three levels, and both halves of each are load-bearing: the ring is what
     separates a surface on ink, the drop is what separates it on paper. A
     shadow written for one surface is invisible on the other, which is what
     `0 1px 2px rgb(24 33 27 / 0.3)` was. In rem, because the app scales, and a
     24px blur at 1.4x interface scale is still a 24px blur.

     `--lift-1` carries no ring, because everything at that level already has a
     border of its own and a ring beside one draws a two-pixel line. The two
     above it are for surfaces that float free and have nothing else holding
     their edge. */
  --lift-1: 0 0.125rem 0.5rem -0.25rem rgb(11 11 10 / 0.1);
  --lift-2: 0 0.5rem 1.25rem -0.625rem rgb(11 11 10 / 0.13), 0 0 0 1px var(--edge);
  --lift-3: 0 1.25rem 2.5rem -1rem rgb(11 11 10 / 0.17), 0 0 0 1px var(--edge);
}

/* Ink instead of paper.
   Seven neutrals, seven column values, four accents, a scrim and three lifts.
   Nothing else, and every `--rail-*` and `--grail-*` name is in here: the
   columns follow the surface, so one of them declared for paper and not for
   ink is a column that stays the wrong color in a dark room and no DOM
   assertion notices. `styles.test.ts` reads both blocks and fails on a name
   that is in one and not the other.
   The columns sit *lighter* than the reading column here, which is the paper
   relationship read the other way round rather than a second idea: on paper
   the page is the brightest thing and its edges step back from it, on ink the
   page is the darkest thing and its edges step up from it. Either way the page
   is the surface you read on and the columns are what frames it.
   The accents are lifted rather than kept, because both are chosen against
   white and neither can be read on ink: the amber goes light and loses its
   burn, the slate goes pale enough to be a color rather than a shadow. They
   stay recognizably the same two colors; they are not the same values. */
:root[data-surface="dark"] {
  --rail-ground: #151513;
  --rail-raised: #1f1f1c;
  --rail-edge: #2b2a27;
  --rail-text: #f7f5f0;
  --rail-muted: #a8a49c;
  --rail-wire: #302f2b;
  --rail-sunken: #0e0e0d;
  --grail-ground: #0b0b0a;

  --ground: #0f0f0e;
  --raised: #171715;
  --sunken: #0a0a09;
  --edge: #2a2926;
  --text: #f7f5f0;
  --muted: #a8a49c;
  /* The one gray that barely moves between the surfaces: it is the lightest of
     the three and the one hints are set in, so it has the least contrast to
     spare in either direction. */
  --faint: #85817a;

  --flesh: #f0a63c;
  --flesh-soft: #33240e;
  --pit: #8fb4c9;
  --pit-soft: #16232b;
  --mint: #46c47c;
  --alarm: #ff6a55;

  --scrim: rgb(0 0 0 / 0.66);
  /* The drop layer does almost nothing over a dark page, so the ring carries
     the separation and the drop only deepens the well underneath. Same three
     names, so nothing above this line knows which surface it is drawing on. */
  --lift-1: 0 0.125rem 0.5rem -0.25rem rgb(0 0 0 / 0.45);
  --lift-2: 0 0.5rem 1.25rem -0.625rem rgb(0 0 0 / 0.55), 0 0 0 1px var(--edge);
  --lift-3: 0 1.25rem 2.5rem -1rem rgb(0 0 0 / 0.6), 0 0 0 1px var(--edge);
}

* {
  box-sizing: border-box;
}

/* The three surfaces that are not the page.
   Everything drawn inside one of them reaches for `--sunken` when it wants to
   be recessed, and recessed from white is a value that disappears on an
   off-white panel. Remapped once here, on the three elements every rule in
   those columns descends from, rather than at each rule inside: a row added to
   the inspector tomorrow is then recessed from what it is actually drawn on
   without having to know which half of the app it is in. `styles.test.ts` is
   the gate, and it reads this rule to know which names are covered. */
.rail,
.grail,
.inspector {
  --sunken: var(--rail-sunken);
}

/* Said, never drawn. `display: none` and `visibility: hidden` both take an
   element out of the accessibility tree along with the page, which for a live
   region means it announces nothing at all. */
.offscreen {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

html,
body,
#root {
  height: 100%;
  margin: 0;
}

/* The anchor every rem in this file is measured against, and the one place the
   interface scale is applied. 16px because that is what 1rem already resolved
   to: nothing here or in Tailwind's preflight had ever set it, so anchoring on
   the 15px body below would have shrunk the whole app by 6.25% at scale 1. */
html {
  font-size: calc(16px * var(--ui-scale));
}

body {
  font-family: var(--font-ui);
  font-optical-sizing: auto;
  /* The 15px this has always been, said in a unit that scales. Every element
     that resets with `font: inherit` and names no size of its own falls back to
     this, so leaving it absolute would freeze them while everything around them
     grew. */
  font-size: var(--type-body);
  background: var(--ground);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

select:not(:disabled),
input[type="checkbox"]:not(:disabled),
input[type="radio"]:not(:disabled),
input[type="file"]:not(:disabled),
label:has(input[type="checkbox"]:not(:disabled)),
label:has(input[type="radio"]:not(:disabled)),
summary {
  cursor: pointer;
}

summary:hover {
  color: var(--text);
  text-decoration: underline;
}

input[type="file"] {
  max-width: 100%;
  color: var(--muted);
  font-size: var(--type-ui);
}

input[type="file"]::file-selector-button {
  cursor: inherit;
  margin-right: var(--space-4);
}

:focus-visible {
  outline: 2px solid var(--flesh);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

::-webkit-scrollbar {
  width: 0.7rem;
  height: 0.7rem;
}
::-webkit-scrollbar-thumb {
  background: color-mix(in oklab, var(--muted) 32%, transparent);
  border-radius: var(--radius-pill);
  border: 0.19rem solid transparent;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover {
  background: color-mix(in oklab, var(--muted) 55%, transparent);
  background-clip: content-box;
}
::-webkit-scrollbar-track {
  background: transparent;
}

/* Flex children default to `min-height: auto`, which refuses to shrink below
   their content. A scroll container inside a flex column therefore grows past
   the viewport instead of scrolling, and `overflow: hidden` on the body clips
   whatever hangs off the bottom. Every scroll region in this app sits in such a
   column, so every one of them needs this. */
.app,
.app > main,
.pane,
.pane__scroll,
.rail,
.rail__body,
.rail__list,
.inspector,
.inspector__body,
.settings__pane {
  min-height: 0;
}

.app {
  display: flex;
  height: 100%;
}

.app > main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* ==========================================================================
   The status bar

   The last row of the reading column: the host this window shows, and the
   operator's quick actions. `components/StatusBar.tsx` says why a button is
   data rather than code, and why an agent's needs the operator's yes.
   ========================================================================== */

.statusbar {
  position: relative;
  flex: none;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-3);
  padding: var(--space-2) var(--column-inset);
  border-top: 1px solid var(--edge);
  background: var(--ground);
  font-size: var(--type-small);
  color: var(--muted);
}

.statusbar__host,
.statusbar__button,
.statusbar__edit,
.statusbar__remove {
  font: inherit;
  color: inherit;
  background: none;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-3);
  cursor: pointer;
  transition: background var(--tempo-tap) var(--ease), color var(--tempo-tap) var(--ease);
}

.statusbar__host:hover,
.statusbar__button:hover,
.statusbar__edit:hover,
.statusbar__remove:hover {
  background: var(--sunken);
  color: var(--text);
}

/* A host and this app on different releases is the one fact here worth a
   color: it is the one that breaks commands. */
.statusbar__host[data-drift] {
  color: var(--pit);
}

.statusbar__actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin-left: auto;
}

.statusbar__action {
  display: inline-flex;
  align-items: center;
}

.statusbar__button {
  border-color: var(--edge);
  color: var(--text);
}

.statusbar__button:disabled {
  cursor: progress;
  opacity: 0.6;
}

.statusbar__edit {
  color: var(--faint);
}

.statusbar__error {
  flex-basis: 100%;
  color: var(--alarm);
}

/* Above the bar rather than in it: the form is taller than a row, and the
   conversation it would otherwise push is what the operator was reading. */
.statusbar__form {
  position: absolute;
  right: var(--column-inset);
  bottom: 100%;
  width: min(22rem, 100%);
  margin-bottom: var(--space-2);
  padding: var(--space-4);
  border: 1px solid var(--edge);
  border-radius: var(--radius);
  background: var(--raised);
  box-shadow: var(--lift-2);
  color: var(--text);
  z-index: 5;
  /* It grows out of the corner of the bar it hangs from. */
  --pop-origin: bottom right;
}

/* ==========================================================================
   The desk

   Everything waiting on the operator, in the corner, wherever they are.
   `components/Desk.tsx` has the argument for what it may and may not hold.
   ========================================================================== */

/* Outside `main` and outside the two navigation columns, fixed to the window
   rather than to a pane. Three reasons, all of them things that broke a panel
   put anywhere else: it must not move when the inspector opens, it must not be
   clipped by the overflow of whatever is scrolling underneath it, and it has to
   survive a view change, which unmounts every pane in the reading column.

   Not a dialog. No scrim, no focus trap, nothing behind it goes inert: a
   request arrives while the operator is doing something else, and the whole
   point is that they can finish that first. */
.desk__card + .desk__card {
  border-top: 1px solid var(--edge);
}

.desk__card {
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.desk__who {
  display: flex;
  align-items: flex-start;
  gap: var(--space-4);
}

.desk__whotext {
  min-width: 0;
}

.desk__asker {
  font-family: var(--font-display);
  font-size: var(--type-aside);
  font-weight: 600;
  color: var(--text);
}

.desk__summary {
  font-size: var(--type-aside);
  line-height: var(--lead-tight);
  color: var(--text);
}

/* Every value in here is what a model asked for. Drawn as data under a heading
   Guaca wrote, never as prose, and never as markdown: see `domain::approval`. */
.desk__detail {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-4) var(--space-4);
  border-radius: var(--radius-sm);
  background: var(--sunken);
}

.desk__detail dt {
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--faint);
}

.desk__detail dd {
  font-size: var(--type-small);
  line-height: var(--lead-tight);
  color: var(--text);
  /* A field can be an entire system prompt, and it is shown because a decision
     made without it is made blind. Wrapped rather than cut, inside a box that
     scrolls, so the whole of it is reachable without leaving the card. */
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.desk__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  align-items: center;
}

/* Pushed to the far end, because it is the way out of this surface rather than
   one of the answers it takes. */
.desk__open {
  margin-left: auto;
}

/* How long it has been true and how many turns have run into it. At the far end
   and quiet, because it is what the operator reads after deciding to look at
   this card rather than what makes them look: the card's own first line already
   carries the age. */
.desk__aside {
  margin-left: auto;
  font-size: var(--type-meta);
  color: var(--faint);
}

/* An escalation is the one card here that nothing is parked on, so it is the
   one that can sit for days. Marked down the edge rather than in a color of its
   own: the panel already says everything on it needs the operator, and a second
   alarm color would make the two kinds compete instead of stack. */
.desk__card[data-kind="stuck"] {
  border-left: 2px solid var(--alarm);
}

/* ==========================================================================
   Group column

   The crews, upright on the far left, out of the way until they are reached
   for. This was a wrapping strip inside the rail, then a column that stood
   open and charged every window four rem for it. `components/GroupRail.tsx`
   has the rest of the argument, and `lib/reach.ts` owns when it comes out.
   ========================================================================== */

/* What is left in the layout: a band of the column's own ground at the edge of
   the window. It reserves the width so nothing reflows when the column comes
   out, and it is what says there is something here at all. The column itself
   is drawn out of this box and slides over the rail. */
.grail {
  width: var(--grail-lip);
  flex: none;
  position: relative;
  /* Over the rail, which is the next thing in the row. */
  z-index: 30;
  min-height: 0;
  background: var(--grail-ground);
  border-right: 1px solid var(--rail-edge);
  color: var(--rail-text);
  /* Not selectable, for the reason the rail is not. */
  user-select: none;
}

/* The proximity zone, as a box with nothing in it.
   `lib/reach.ts` measures this rather than carrying a number, so how far in
   the pointer has to come is a length in this file at the operator's own
   interface scale, like every other length. It starts below the window's own
   buttons: on macOS those float over the top left corner, and a zone that ran
   to the top of the window would slide the crews out from under the pointer
   every time somebody went to close the app. */
.grail__reach {
  position: absolute;
  left: 0;
  top: var(--space-8);
  bottom: 0;
  width: var(--grail-reach);
  pointer-events: none;
}

/* The column. Translated rather than resized, so what moves is one composited
   layer and the circles inside it never reflow: an animated width would relay
   out the list on every frame, and the scroll position in it would jump. */
.grail__slab {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: var(--grail-w);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 0;
  background: var(--grail-ground);
  border-right: 1px solid var(--rail-edge);
  /* The first circle starts under the window's own buttons. */
  padding: var(--space-8) 0 var(--space-4);
  gap: var(--space-2);
  /* All the way off, rather than back by the width of the band. The band is
     this element's own ground, so the column has nothing to contribute to it,
     and leaving its last half rem on screen leaves whatever is drawn there:
     the waiting badge hangs off the right of a circle, so a crew with a parked
     turn in it put a red chip at the edge of the window with no circle under
     it. */
  transform: translateX(-100%);
  transition: transform var(--tempo-move) var(--ease), box-shadow var(--tempo-move) var(--ease);
}

/* Out, and floating: over the rail rather than beside it, so the rail keeps
   its measure and nothing under this moves. `:focus-within` is the third way
   out and the one that makes the column reachable from the keyboard, since a
   circle tabbed to inside a column nobody can see is a selection nobody can
   read. */
.grail[data-out="true"] .grail__slab,
.grail:focus-within .grail__slab {
  transform: none;
  box-shadow: var(--lift-2);
}

.grail__rule {
  flex: none;
  width: 1.5rem;
  height: 1px;
  background: var(--rail-edge);
  margin: var(--space-1) 0 var(--space-2);
}

/* Scrolls rather than wraps, which is the whole reason this is a column. The
   bar itself is hidden: it would take a quarter of the width of a surface whose
   entire job is to be one circle wide, and a circle cut by the bottom edge is
   what says there is more. */
.grail__list {
  width: 100%;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-2);
}

.grail__list::-webkit-scrollbar {
  display: none;
}

/* ==========================================================================
   Rail
   ========================================================================== */

/* Nothing is pinned here. Both columns used to hold paper values for `--flesh`
   and `--flesh-soft` — and the crews' column for `--alarm` as well — because
   they were ink under both surfaces and a reading column that went dark would
   otherwise have repainted them silently. They follow the surface now, so the
   one amber in the app is the same amber in all three columns, which is what
   it was always meant to be: the accent means "answer me" and had two values
   for it depending on which side of a border it was drawn on. */
.rail {
  /* A right-click leaves nothing highlighted behind it. WebKit selects the word
     under the pointer before it dispatches `contextmenu`, for the menu it is
     about to draw, so a row that answers with a menu of its own cannot undo
     that by preventing a default which has already happened: the agent's name
     is left selected underneath the menu, and stays selected after it closes.
     Everywhere else in the column, where `main.tsx` refuses the menu outright,
     the highlight is the whole of what the right-click did. The rail is
     controls rather than prose, so none of it is selectable, which is also what
     a drag across it wanted. The reading column is prose and keeps both. */
  user-select: none;

  width: var(--rail-w);
  background: var(--rail-ground);
  color: var(--rail-text);
  border-right: 1px solid var(--rail-edge);
  display: flex;
  flex-direction: column;
  flex: none;
  position: relative;
}

.rail__brand {
  padding: var(--space-8) var(--space-6) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.rail__wordmark {
  font-family: var(--font-display);
  font-size: var(--type-lede);
  font-weight: 600;
  letter-spacing: var(--track-caps-wide);
  text-transform: uppercase;
  color: var(--rail-text);
}

/* The one plus in the app, at the top of the list it adds to. Drawn at the
   rail's full text weight rather than the muted weight its other chrome uses:
   the wordmark beside it is the only thing on this row, and a control that is
   the only way to make an agent cannot be quieter than the furniture. */
.rail__new {
  margin-left: auto;
  flex: none;
  width: 1.6rem;
  height: 1.6rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--rail-edge);
  background: var(--rail-raised);
  color: var(--rail-text);
  font-size: var(--type-lede);
  line-height: var(--lead-flush);
  border-radius: var(--radius-sm);
  transition: color var(--tempo-tap) var(--ease),
    background var(--tempo-tap) var(--ease),
    border-color var(--tempo-tap) var(--ease);
}

.rail__new:hover,
.rail__new:focus-visible,
.rail__new[aria-expanded="true"] {
  background: color-mix(in oklab, var(--flesh) 30%, var(--rail-raised));
  border-color: color-mix(in oklab, var(--flesh) 45%, var(--rail-edge));
}

.rail__section {
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  font-weight: 500;
  letter-spacing: var(--track-caps-wide);
  text-transform: uppercase;
  color: var(--rail-muted);
  padding: var(--space-5) var(--space-6) var(--space-3);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* A group header. Reads as a label, not a control: the primary thing in the
   rail is still the agent. The gear is the only part that acts. */
.rail__group-head {
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  font-weight: 500;
  letter-spacing: var(--track-caps-wide);
  text-transform: uppercase;
  color: var(--rail-muted);
  padding: var(--space-5) var(--space-4) var(--space-2) var(--space-6);
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

/* The only part of the header that gives up space, and now the only part that
   needs any: what is left beside it is the gear. The name still ellipses rather
   than overflowing the rail, because a crew can be called anything. */
.rail__group-name {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* The group's pinned model is not drawn here at all. A model id is longer than
   the rail is wide, so it took the group name's space on one line and a whole
   row of its own on two. It lives behind the gear, with the endpoint. */

.rail__gear {
  background: none;
  border: 0;
  padding: 0 var(--space-1);
  /* A step up from what it sits beside. It is the only thing in either heading
     that is aimed at rather than read, and at the size of a label it was a
     glyph the pointer had to hunt for. */
  font-size: var(--type-ui);
  line-height: var(--lead-flush);
  color: var(--rail-muted);
  opacity: 0.55;
  flex: none;
  transition: opacity var(--tempo-tap) var(--ease), color var(--tempo-tap) var(--ease);
}

/* What a crew has spent, over the rail, for as long as its heading is held.
   This was a strip on the heading itself, four characters wide and sharing a
   line with the crew's name. Off the line it can hold the whole picture instead
   of the part that fit, and the name gets the width back. */
.spend {
  --pop-origin: top left;

  position: fixed;
  left: var(--tag-x);
  top: var(--tag-y);
  z-index: 30;
  /* The heading underneath is what holds this open, and the rows it covers are
     still targets. Neither may lose a pointer to a panel that is only read. */
  pointer-events: none;
  width: 13rem;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  /* Off the heading's own box, which starts at the edge of the window. The same
     inset the heading pads itself by, so the card's edge lands under the first
     letter of the name it belongs to. */
  margin: var(--space-2) 0 0 var(--space-6);
  padding: var(--space-5);
  border-radius: var(--radius-sm);
  background: var(--rail-raised);
  box-shadow: inset 0 0 0 1px var(--rail-edge), var(--lift-2);
}

.spend__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-4);
}

/* The one figure read at a glance, at the size that says so. */
.spend__total {
  font-family: var(--font-display);
  font-size: var(--type-lede);
  font-weight: 600;
  letter-spacing: var(--track-tight);
  line-height: var(--lead-flush);
  color: var(--rail-text);
  font-variant-numeric: tabular-nums;
}

.spend__cost {
  font-family: var(--font-mono);
  font-size: var(--type-small);
  letter-spacing: var(--track-flat);
  color: var(--rail-muted);
  font-variant-numeric: tabular-nums;
}

.spend__spark {
  display: flex;
  align-items: flex-end;
  gap: 1px;
  height: 1.5rem;
  /* A crew that has spent something but is doing nothing right now has no bars
     at all, and a blank strip between the total and the split reads as a card
     that failed to draw. The line is what a quiet sparkline looks like. */
  border-bottom: 1px solid var(--rail-edge);
}

.spend__bar {
  flex: 1;
  min-height: 0;
  background: var(--rail-edge);
  border-radius: 1px;
  /* Only the height animates, and only upward from nothing, so a quiet crew is
     a flat line rather than a row of stubs pretending to be activity. */
  transition: height var(--tempo-move) var(--ease);
}

/* The bars carry the whole of "right now", and nothing else on the card does.
   The total used to take the tint as well, which at four mono characters was a
   readout changing color and at the size it is drawn here was the one figure on
   the card going pale on the surface it is drawn on. */
.spend[data-busy] .spend__bar {
  background: var(--flesh-soft);
}

/* The split, exact. Two columns rather than a sentence, because these are read
   against each other: what a crew sends and what it gets back is the shape of
   how it works, and `20,000,000 in, 15,000,000 out` on one line is a shape
   nobody reads off a run of digits. */
.spend__rows {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: var(--space-1) var(--space-4);
}

.spend__label {
  font-size: var(--type-meta);
  line-height: var(--lead-ui);
  color: var(--rail-muted);
}

.spend__figure {
  font-family: var(--font-mono);
  font-size: var(--type-meta);
  letter-spacing: var(--track-flat);
  line-height: var(--lead-ui);
  color: var(--rail-text);
  font-variant-numeric: tabular-nums;
  text-align: right;
}

/* A crew that has not called a model yet still answers when it is asked. A card
   that opens for the crews with something to say and stays shut for the rest is
   a hover nobody can tell from a broken one. */
.spend__quiet {
  font-size: var(--type-small);
  line-height: var(--lead-ui);
  color: var(--rail-muted);
}

.run__cost {
  margin-left: var(--space-3);
}

.rail__group-head:hover .rail__gear,
.rail__gear:focus-visible {
  opacity: 1;
  color: var(--rail-text);
}

/* The wall between groups, drawn once between them rather than around each, so
   the rail reads as a list with divisions and not a stack of cards. */
.rail__group + .rail__group {
  margin-top: var(--space-1);
  border-top: 1px solid var(--rail-edge);
}

.rail__hash {
  display: inline-block;
  width: 1.15rem;
  text-align: center;
  opacity: 0.75;
}

/* Holds the wire so it runs the full height of the rail, down to the footer,
   rather than ending wherever the list of agents happens to stop. */
.rail__body {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* The wire is the track a thrown message travels along, so it is drawn only
   while something is on it. Left on permanently it is a hairline ruled through
   the middle of every character in the rail, which is what it used to be. */
.rail__body::before {
  content: "";
  position: absolute;
  left: 1.72rem;
  top: 0;
  bottom: 0.4rem;
  width: 1px;
  background: linear-gradient(to bottom, var(--rail-wire) 0%, var(--rail-wire) 88%, transparent);
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--tempo-move) var(--ease);
}

.rail__body[data-live="true"]::before {
  opacity: 1;
  /* On faster than it goes off: the wire appearing is the news. */
  transition-duration: var(--tempo-tap);
}

.rail__list {
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
  flex: 1;
  padding-bottom: var(--space-4);
}

.rail__empty {
  padding: var(--space-4) var(--space-6);
  font-size: var(--type-small);
  color: var(--rail-muted);
  line-height: var(--lead-ui);
}

.rail__foot {
  border-top: 1px solid var(--rail-edge);
  padding: var(--space-3) 0;
  flex: none;
}

.pulse {
  position: absolute;
  left: 1.72rem;
  --dot: 0.58rem;
  width: var(--dot);
  height: var(--dot);
  margin-left: calc(var(--dot) / -2);
  border-radius: var(--radius-xs);
  background: var(--pulse-color, var(--flesh));
  box-shadow:
    0 0 0 0.19rem color-mix(in oklab, var(--pulse-color, var(--flesh)) 22%, transparent),
    0 0 0.64rem color-mix(in oklab, var(--pulse-color, var(--flesh)) 45%, transparent);
  pointer-events: none;
  z-index: 2;
  animation: pulse-travel var(--pulse-duration, 620ms) var(--ease-loop) forwards;
}

/* Tumbles as it flies, so it reads as something thrown rather than a dot
   sliding along a track. */
@keyframes pulse-travel {
  0% {
    top: var(--pulse-from);
    opacity: 0;
    transform: scale(0.3) rotate(0deg);
  }
  14% {
    opacity: 1;
    transform: scale(1) rotate(90deg);
  }
  82% {
    opacity: 1;
    transform: scale(1) rotate(300deg);
  }
  100% {
    top: var(--pulse-to);
    opacity: 0;
    transform: scale(0.55) rotate(380deg);
  }
}

.agent-row {
  width: 100%;
  display: grid;
  /* The first lane is the character's own box and has to be told when that
     grows, or the face overflows its track and sits under the name. */
  grid-template-columns: 2.75rem 1fr auto;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-2) var(--space-5) var(--space-2) var(--space-4);
  background: none;
  border: 0;
  text-align: left;
  position: relative;
  color: inherit;
}

.agent-row:hover,
.agent-row[aria-current="true"] {
  background: var(--rail-raised);
}

.agent-row[aria-current="true"]::after {
  content: "";
  position: absolute;
  left: 0;
  top: 0.25rem;
  bottom: 0.25rem;
  width: 2px;
  border-radius: 0 1px 1px 0;
  background: var(--accent, var(--flesh));
}

/* The name and its pin as one cell, rather than a fourth column. A column that
   is empty on every unpinned row still takes its gap, so the names in a crew
   would line up with each other and with nothing else in the rail. */
.agent-row__title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-width: 0;
}

.agent-row__name {
  font-family: var(--font-display);
  font-size: var(--type-ui);
  font-weight: 500;
  letter-spacing: var(--track-flat);
  color: var(--rail-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Quiet, and after the name so the name is what truncates. A pin is read once,
   when the operator wonders why this row is at the top; the row it is on is
   already carrying a face, a name and a state. */
.agent-row__pin {
  flex: none;
  width: 0.68rem;
  height: 0.68rem;
  color: var(--rail-muted);
}

.agent-row[data-lifecycle="paused"] .agent-row__name {
  color: var(--rail-muted);
}

.agent-row__meta {
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  letter-spacing: var(--track-flat);
  color: var(--rail-muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.agent-row__meta[data-state="thinking"] {
  color: var(--flesh);
}

/* Louder than thinking, because it is the only rail state that is asking for
   something. A parked agent stays parked until the operator answers, and the
   request is in a channel they may not have open. */
.agent-row__meta[data-state="asking"] {
  /* On the amber rather than beside it, so the text is the page's ground and
     not the column's: the amber is dark on paper and light on ink, and a
     column-colored label is unreadable on one of the two. */
  color: var(--ground);
  background: var(--flesh);
  border-radius: var(--radius-xs);
  padding: var(--space-1) var(--space-2);
  font-weight: 600;
}

/* The rail reorders itself as agents talk. Sliding rows into place is legible;
   snapping them is disorienting, especially when several move at once. */
.agent-row[data-sliding="true"] {
  transition: transform var(--tempo-enter) var(--ease);
}

/* ==========================================================================
   Arranging the rail

   The rail is ordered by hand and lends the top of a section to whoever is
   working. Dragging is how the arrangement is edited, so while a drag is on the
   rail draws the arrangement itself and marks the one place a release would
   land. See lib/rail.ts.
   ========================================================================== */

/* The fist is on the whole column rather than on the row that was picked up:
   the pointer leaves that row almost immediately, and a cursor that turns back
   into an arrow over the gap between two rows says the drag ended. */
.rail[data-dragging="true"] {
  cursor: grabbing;
}

/* The row the hand is holding. Left in place rather than removed: a list that
   closes up under the pointer moves every target while it is being aimed at. */
.agent-row[data-held="true"] {
  opacity: 0.3;
}

/* Where it would land. A line above the row rather than a filled block,
   because a block says "into this" and the answer is "in front of this". */
.agent-row[data-over="true"]::before {
  content: "";
  position: absolute;
  left: 0.6rem;
  right: 0.75rem;
  top: -1px;
  height: 2px;
  border-radius: 1px;
  background: var(--flesh);
  box-shadow: 0 0 0.375rem color-mix(in oklab, var(--flesh) 55%, transparent);
}

/* The codebases a crew works in, drawn as headings with their agents under
   them.

   A tree, which is the whole reason an agent works in at most one repository:
   every agent has exactly one place in the rail, so a name is never in two
   sections at once and there is never a question of which row is the real one.

   The rows inside are the rail's own rows, so an agent under a repository has
   the same menu, the same activity readout and the same drag as one anywhere
   else. Only the indent and the rule beside it differ. */
.rail__repos {
  display: flex;
  flex-direction: column;
}

.rail__repo {
  padding: var(--space-1) 0 var(--space-2);
}

.rail__repo-head {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-4) var(--space-4) var(--space-2) var(--column-inset);
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  font-weight: 600;
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--rail-muted);
  min-width: 0;
}

/* A branch glyph, not an icon. Two rules meeting is what a directory looks
   like in every tree an engineer already reads, and it costs no asset and no
   color: at this size an icon is a smudge and a colored one competes with the
   agent avatars, which are the thing in this column that is meant to be
   recognized at a glance. */
.rail__repo-mark {
  flex: none;
  width: var(--space-4);
  height: var(--space-4);
  border-left: 1.5px solid color-mix(in oklab, var(--flesh) 60%, transparent);
  border-bottom: 1.5px solid color-mix(in oklab, var(--flesh) 60%, transparent);
  margin-bottom: var(--space-1);
}

.rail__repo-name {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--rail-text);
}

/* How many work here. Absent at zero rather than drawn as "0": the line under
   an empty repository already says so in words, and a zero beside a name reads
   as a broken counter. */
.rail__repo-count {
  flex: none;
  font-variant-numeric: tabular-nums;
  opacity: 0.75;
}

/* The indent, and the rule that makes it read as containment rather than as a
   margin somebody chose. Down the left of the members, starting under the
   glyph in the heading. */
/* What a coding agent is doing, in the channel of the agent that asked.

   Above the composer and below the transcript, in the band the turn footer
   uses, because it answers the same question that band answers: what is
   happening right now that has not landed as a message yet. Bounded height and
   its own scroll, so a job that runs three hundred tools does not push the
   composer off the screen. */
.coding {
  flex: none;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  margin: 0 var(--space-6) var(--space-3);
  padding: var(--space-4) var(--space-5);
  border-radius: var(--radius);
  border: 1px solid color-mix(in oklab, var(--flesh) 28%, transparent);
  background: color-mix(in oklab, var(--flesh) 7%, transparent);
}

/* The cap and the scroll are on the tail, not on the panel. The panel also
   holds the box the operator types a correction into, and a long job whose
   tail owned the scrolling pushed that box out of reach exactly when it was
   worth reaching for. */
.coding__tail {
  max-height: 11rem;
  overflow-y: auto;
}

.coding__say {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.coding__say .input {
  flex: 1;
  min-width: 0;
}

.coding__head {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

/* Pushes the stop away from the title, so the one destructive control here is
   not next to the words naming the repository it would stop. */
.coding__head .btn:first-of-type {
  margin-left: auto;
}

.coding__pulse {
  width: var(--space-3);
  height: var(--space-3);
  border-radius: var(--radius-pill);
  background: var(--flesh);
  animation: repo-building 2s var(--ease-loop) infinite;
}

.coding__title {
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: color-mix(in oklab, var(--ink) 62%, transparent);
}

.coding__waiting,
.coding__lines {
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: var(--type-small);
  line-height: var(--lead-ui);
  color: color-mix(in oklab, var(--ink) 70%, transparent);
}

.coding__waiting {
  font-style: italic;
}

.coding__line {
  display: flex;
  gap: var(--space-3);
  align-items: baseline;
  min-width: 0;
}

/* The tool is a fixed column so the details line up and the eye can run down
   them. A ragged left edge here reads as noise rather than as a sequence. */
.coding__tool {
  flex: none;
  width: var(--column-face);
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  color: var(--flesh);
  overflow: hidden;
  text-overflow: ellipsis;
}

.coding__detail {
  font-family: var(--font-mono);
  font-size: var(--type-meta);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

/* What the coding agent says, as opposed to what it runs. Wrapped rather than
   clipped: this is prose and it is the part worth reading. */
.coding__said {
  font-style: italic;
  color: color-mix(in oklab, var(--ink) 85%, transparent);
}

/* A repository with a coding job running. Words rather than a spinner: the
   rail already carries a pulse for an agent mid-turn, and a second animation
   beside it would read as the same thing when it is deliberately not. */
.rail__repo-building {
  flex: none;
  font-size: var(--type-mark);
  letter-spacing: var(--track-caps);
  color: var(--flesh);
  animation: repo-building 2s var(--ease-loop) infinite;
}

@keyframes repo-building {
  0%,
  100% {
    opacity: 0.55;
  }
  50% {
    opacity: 1;
  }
}

.rail__repo-crew {
  margin-left: var(--column-inset);
  padding-left: var(--space-3);
  border-left: 1px solid color-mix(in oklab, var(--rail-wire) 90%, transparent);
}

/* What the repository is doing. A second line under the name rather than more
   on it: the name is what the row is about and it must not be squeezed by a
   branch called `madebywelch/agent-coding-with-pi`. */
.rail__repo-state {
  display: flex;
  align-items: baseline;
  gap: var(--space-3);
  margin: 0;
  padding: 0 var(--space-6) var(--space-2) var(--space-7);
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  color: var(--rail-muted);
  min-width: 0;
}

/* The one part that gives up space, because it is the one part with no bound:
   a branch name is whatever somebody typed, and the counts beside it are two
   or three characters each. */
.rail__repo-branch {
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: color-mix(in oklab, var(--rail-text) 78%, transparent);
}

/* A detached HEAD is a state to get out of rather than a place to work from,
   so it does not get to look like a branch name. */
.rail__repo-branch[data-detached="true"] {
  font-style: italic;
  color: var(--rail-muted);
}

.rail__repo-dirty {
  flex: none;
  color: color-mix(in oklab, var(--flesh) 82%, var(--rail-text));
}

.rail__repo-prs {
  flex: none;
  margin-left: auto;
  white-space: nowrap;
}

.rail__repo-empty {
  margin: 0;
  padding: var(--space-1) var(--space-6) var(--space-2) var(--space-7);
  font-size: var(--type-fine);
  font-style: italic;
  color: var(--rail-muted);
}

/* A whole crew as the target, which is what dropping anywhere but on a row
   means: this group, no particular place in it. */
.rail__repo[data-over="true"],
.rail__group[data-over="true"],
.orb[data-over="true"] .orb__ring {
  background: color-mix(in oklab, var(--flesh) 12%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--flesh) 45%, transparent);
}

/* What the hand is holding, at the pointer. Fixed to the window so nothing it
   passes over can clip it, and transparent to the pointer so the row underneath
   is still the row being aimed at. */
.rail__held {
  position: fixed;
  z-index: 40;
  /* Below and to the right of the pointer, not under it. Centered on the pointer
     it covered the top edge of the row being aimed at, which is exactly where
     the line saying "it lands here" is drawn. */
  transform: translate(0.9rem, 0.35rem);
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-2) var(--space-4) var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  background: var(--rail-raised);
  border: 1px solid var(--rail-edge);
  box-shadow: var(--lift-2);
  opacity: 0.95;
}

.rail__held-name {
  font-family: var(--font-display);
  font-size: var(--type-aside);
  color: var(--rail-text);
  white-space: nowrap;
}

/* ==========================================================================
   Groups, as places

   A crew is recognized by who is in it before its name is read, so a group is
   drawn as a circle of its members' faces. Clicking one takes the rail inside
   it; dropping an agent on one puts the agent in it. The strip is absent while
   there is one group, because a choice of one is chrome.
   ========================================================================== */

.orb {
  flex: none;
  position: relative;
  width: 100%;
  display: flex;
  justify-content: center;
  padding: var(--space-1) 0;
  background: none;
  border: 0;
  color: inherit;
}

.orb__ring {
  position: relative;
  width: 2.4rem;
  height: 2.4rem;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--rail-raised);
  box-shadow: inset 0 0 0 1px var(--rail-edge);
  transition: box-shadow var(--tempo-move) var(--ease),
    background var(--tempo-move) var(--ease);
}

.orb:hover .orb__ring {
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--rail-text) 30%, transparent);
}

/* The crew the rail is inside. Two marks, and neither of them is the ring: the
   ring already carries whether anyone here is working, and a circle saying two
   things on one channel says neither. The same two the rail uses one column
   over for the open channel — a plate under the row and an ink edge on it —
   because it is the same question asked at the other granularity.

   The bar is the accent. It was `--flesh-soft`, which is the *ground* the app
   fills boxes with rather than an ink: #fdeed9 over a #eceae2 column and
   #33240e over a #0b0b0a one, which is 1.06 to 1 and 1.31 to 1. The one
   permanent statement in the app about where the operator is standing was
   drawn in a color neither surface shows. `styles.test.ts` holds it to a ratio
   now, because no DOM assertion sees a color: the bar was always in the
   document with the right class on it.

   The band is the mark that answers at a glance, which is how the question is
   asked. A 0.2rem edge is findable once you know to look for it, and down a
   column of twelve nobody looks. `--flesh-soft` is the right name here, because
   here it is a ground.

   Remapping `--grail-ground` with it is what keeps the two badges hung off the
   rim right: the overflow count is filled with it and the waiting count is
   ringed in it, both so they sit on the column, and under this one circle the
   column is the band. Remapped once here for the reason `--sunken` is remapped
   once on the columns themselves, rather than at each rule inside. */
.orb[aria-current="true"] {
  --grail-ground: var(--flesh-soft);

  background: var(--flesh-soft);
}

.orb[aria-current="true"]::before {
  content: "";
  position: absolute;
  left: 0;
  top: 50%;
  width: 0.2rem;
  height: 2rem;
  transform: translateY(-50%);
  border-radius: 0 var(--radius-xs) var(--radius-xs) 0;
  background: var(--flesh);
}

/* Faces, standing in a ring. Where each one goes is `lib/orb.ts`: a crew of
   two, of four and of six have to draw three different badges, or a strip of
   crews is one badge repeated and the faces in it are decoration. A square of
   four was what every crew of two or more drew, and it read as the app's own
   mark rather than as these four agents.

   Every number arrives as a custom property in fractions of this box, so the
   ring can be resized on the rule above without a constant in the module having
   to be changed to agree with it. Sized here rather than through the avatar's
   own scale, because these have to fill a circle rather than sit beside a name:
   the selector carries the extra class deliberately, `.avatar--xs` being
   defined further down the file. */
.orb__faces {
  position: absolute;
  inset: 0;
  /* Opens the ring a little under the pointer. The crew is a drop target as
     well as a place, so it is worth answering before it is clicked. */
  transition: transform var(--tempo-move) var(--ease);
}

.orb:hover .orb__faces {
  transform: scale(1.06);
}

.orb__face {
  position: absolute;
  left: var(--seat-x);
  top: var(--seat-y);
  width: var(--seat-size);
  /* The lean is on this wrapper and not on the avatar: the avatar's own
     transform is where looking up or down at a peer is expressed. */
  transform: translate(-50%, -50%) rotate(var(--seat-tilt, 0deg));
  line-height: 0;
}

.orb__face > .avatar {
  width: 100%;
  height: auto;
  aspect-ratio: 1;
}

@media (prefers-reduced-motion: reduce) {
  .orb__faces {
    transition: none;
  }

  .orb:hover .orb__faces {
    transform: none;
  }
}

/* An empty crew. Centered by hand, because everything else in the ring is
   placed absolutely and there is no flow left to sit in the middle of. */
.orb__none {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  color: var(--rail-muted);
}

/* The members that did not fit. A number, because a seventh face on this ring
   is a smudge and it makes the six already there smaller.

   Hung off the rim rather than laid on it. A ring with a seat in every quarter
   has nowhere inside it for an opaque chip to sit that is not somebody's face,
   and the crew is what the circle is for. */
.orb__more {
  position: absolute;
  right: -0.3rem;
  bottom: -0.2rem;
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  line-height: var(--lead-flush);
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-sm);
  background: var(--grail-ground);
  box-shadow: inset 0 0 0 1px var(--rail-edge);
  color: var(--rail-muted);
}

/* The crew's name, beside its circle, while the circle is pointed at or
   focused. `components/OrbTag.tsx` has the argument: faces alone cannot tell
   two crews hired from the same cafeteria counters apart, and the way out was
   clicking through the column.

   Fixed to the window rather than laid out in the column, for the reason
   `.rail__held` is: `.grail__list` scrolls, so it clips on both axes — a box
   with `overflow-y: auto` computes `visible` to `auto` on the other axis — and
   a tag inside it would be cut off at the edge of a four-rem column. Its
   vertical middle is measured off the circle when it opens and arrives as
   `--tag-y`; the centering is `translate` rather than a transform, because the
   arrival below animates `transform` and would land it half a box too low.

   It wraps rather than ellipsing. A name cut short is the thing this exists to
   fix, and cutting it here would only move where that happens. */
.orb__tag {
  --pop-origin: left center;

  position: fixed;
  left: var(--grail-w);
  top: var(--tag-y);
  translate: 0 -50%;
  z-index: 30;
  /* The circle underneath is a button and a drop target, and the tag is drawn
     over the pane beside it. Neither may lose a pointer to a label. */
  pointer-events: none;
  max-width: 14rem;
  display: flex;
  flex-direction: column;
  /* The circle is a button, and a button centers its text. Read as a label the
     name and the line under it have to start at the same edge. */
  text-align: left;
  gap: var(--space-1);
  margin-left: var(--space-3);
  padding: var(--space-3) var(--space-5);
  border-radius: var(--radius-sm);
  background: var(--rail-raised);
  box-shadow: inset 0 0 0 1px var(--rail-edge), var(--lift-2);
}

.orb__tag-name {
  font-family: var(--font-display);
  font-size: var(--type-ui);
  font-weight: 600;
  letter-spacing: var(--track-tight);
  line-height: var(--lead-ui);
  color: var(--rail-text);
}

/* The same sentence the label says, from the same function. A circle can carry
   the ring and the corner count on two channels; this is where they are put
   into words, which is what makes "is anything over there my problem" readable
   without opening the crew. */
.orb__tag-note {
  font-size: var(--type-small);
  line-height: var(--lead-ui);
  color: var(--rail-muted);
}

.orb__all-count {
  font-family: var(--font-mono);
  font-size: var(--type-aside);
  font-variant-numeric: tabular-nums;
  color: var(--rail-muted);
}

.orb--all[aria-current="true"] .orb__all-count {
  color: var(--rail-text);
}

/* Somebody in this crew is working. After focusing on one group the strip is
   the only place the others are still visible, so it has to carry that. */
.orb[data-state="working"] .orb__ring {
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--flesh) 60%, transparent);
  animation: orb-breathe 2.6s var(--ease-loop) infinite;
}

/* And the one state the operator is the fix for, which is a number rather than
   a dot: three parked turns and one are different amounts of work, and a crew
   is the unit an operator triages by. Drawn in the same warm red the menu bar's
   attention glyph uses, because it is the same statement made in the other
   place Guaca can make it. */
.orb__waiting {
  position: absolute;
  right: 0.25rem;
  bottom: 0.05rem;
  --badge: 0.95rem;
  min-width: var(--badge);
  padding: 0 var(--space-1);
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  font-weight: 600;
  line-height: var(--badge);
  text-align: center;
  border-radius: var(--radius-sm);
  background: var(--alarm);
  color: #fff;
  box-shadow: 0 0 0 2px var(--grail-ground);
}

@keyframes orb-breathe {
  50% {
    box-shadow: inset 0 0 0 2px color-mix(in oklab, var(--flesh) 75%, transparent);
  }
}

@media (prefers-reduced-motion: reduce) {
  .orb[data-state="working"] .orb__ring {
    animation: none;
  }
}

/* Inside one group, where the overview's heading is a 0.6rem label sized to sit
   above a list of others. The name and the gear, and nothing else on the line:
   the readout that used to share it is a fixed width and a crew's name is not,
   so the name was the only item with anything to give and gave it. A crew called
   "StopTheScam" was drawn as "StopTh…" over its own agents. */
.rail__open-head {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-5) var(--space-4) var(--space-4) var(--space-6);
}

.rail__open-name {
  font-family: var(--font-display);
  font-size: var(--type-body);
  font-weight: 600;
  letter-spacing: var(--track-flat);
  color: var(--rail-text);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Its gear does not wait to be hovered. In the overview the heading is one of
   several and the gear is noise; here it is the group's own controls. */
.rail__group--open .rail__gear {
  opacity: 1;
}

/* ==========================================================================
   Avatars

   Every agent is one of five shapes, drawn by `avatars/form.ts` from a handful
   of numbers rather than from a path. Nothing in here animates it:
   the outline is recomputed per frame and written as one `d`, because what a
   creature does is change shape, and a keyframe can only move a drawing about.

   Two casts draw the same creatures. The cut one adds the paper relief, the
   same outline under a shallow shadow and a lifted edge, and an eye that is a
   white with a pupil in it; the drawn one is a brush line over a pigment out
   of register. Either way the face is ink on the agent's pigment, and the
   marks beside a head follow the reading surface so they remain visible in a
   dark room; their three small loops are the only motion in this block.
   ========================================================================== */

.avatar {
  --eye: #252824;
  /* Paper, not white: the one light thing on a creature should not be the
     brightest thing in the column beside it. */
  --sclera: #fbf8f1;
  /* The drawn cast's edge. Ink on paper; on a dark page the edge has to be
     the light one, or the silhouette is only the misregistered pigment. */
  --brush-edge: var(--eye);

  display: inline-grid;
  place-items: center;
  flex: none;
  position: relative;
  line-height: var(--lead-flush);
}

/* Bigger than they were, and the reason is legibility rather than presence: an
   expression carried by a change of shape needs enough of it to catch the eye
   of somebody reading the column beside it. Under about 1.5rem the loud moods
   still separate and the quiet ones stop trying. */
.avatar--xs {
  width: 1.5rem;
  height: 1.5rem;
}

.avatar--sm {
  width: 2rem;
  height: 2rem;
}

.avatar--md {
  width: 2.75rem;
  height: 2.75rem;
}

.avatar--lg {
  width: 4.25rem;
  height: 4.25rem;
}

/* The body is bounded by `FORM.reach` and stays inside the viewBox even at full
   excursion, but the marks are drawn into the top right corner of it and the
   attention halo grows past its own radius. Clipping is what would cut the one
   thing on a creature that has to be seen from across the room. */
.avatar__body {
  width: 100%;
  height: 100%;
  overflow: visible;
  /* WebKit can drop a click on a <use> whose outline changes between press
     and release. The artwork is decoration; its stable wrapper is the target. */
  pointer-events: none;
}

.avatar__mark {
  --eye: var(--text);
}

:root[data-surface="dark"] .avatar {
  --brush-edge: #e8e3d6;
}

/* The cut eye: the white between the lids, the pupil and the lid's shadow
   clipped to it, and the lid line over the top. */
.avatar__white {
  fill: var(--sclera);
}

.avatar__pupil {
  fill: var(--eye);
}

.avatar__shade {
  fill: var(--eye);
  opacity: 0.16;
}

.avatar__lids path {
  fill: none;
  stroke: var(--eye);
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* The drawn one: every stroke is a filled shape, because a brush line has a
   width of its own at every point and an SVG stroke has one width. */
.avatar__edge {
  fill: var(--brush-edge);
}

.avatar__brush {
  fill: var(--eye);
}

.avatar__brush ellipse {
  fill: none;
  stroke: var(--eye);
}

/* Paused and composted are the same face and the same treatment: a creature
   that is not going to do anything. Keyed on the mood rather than on the
   lifecycle, so a turn the runtime has paused looks the same as an agent the
   operator has. */
.avatar[data-mood="paused"] .avatar__body {
  filter: grayscale(0.72);
  opacity: 0.5;
}

/* --- the marks beside a head ---------------------------------------------

   Every one of these loops is pulled back by the creature's own phase, which
   `avatars/clock.ts` hands down as `--gait`. Without it they run on the
   document's clock, and the document's clock is the same for everybody: every
   avatar on screen is written in one frame, and a crew told one thing starts
   thinking in one frame, so a rail of agents ends up blinking in time. Negative
   is deliberate; a positive delay would hold the mark back rather than start it
   somewhere else in its loop. */

.avatar__dots circle {
  animation: think-dot 1.5s var(--ease-loop) infinite;
  animation-delay: calc(var(--gait, 0s) * -1);
}

.avatar__dots circle:nth-child(2) {
  animation-delay: calc(var(--gait, 0s) * -1 + 0.18s);
}

.avatar__dots circle:nth-child(3) {
  animation-delay: calc(var(--gait, 0s) * -1 + 0.36s);
}

@keyframes think-dot {
  0%,
  100% {
    opacity: 0.15;
  }

  50% {
    opacity: 0.9;
  }
}

/* The one amber thing on a creature, and the only one that has to be seen from
   the other side of the room: a turn parked on a person. */
.avatar__halo {
  transform-box: fill-box;
  transform-origin: center;
  animation: attention 1.9s var(--ease-loop) infinite;
  animation-delay: calc(var(--gait, 0s) * -1);
}

@keyframes attention {
  0% {
    opacity: 0.5;
    transform: scale(0.85);
  }

  70%,
  100% {
    opacity: 0;
    transform: scale(1.3);
  }
}

.avatar__z {
  animation: snooze 3.4s var(--ease-loop) infinite;
  animation-delay: calc(var(--gait, 0s) * -1);
}

@keyframes snooze {
  0% {
    opacity: 0;
    transform: translate(0, 1px) scale(0.75);
  }

  30% {
    opacity: 0.75;
  }

  100% {
    opacity: 0;
    transform: translate(2px, -6px) scale(1.05);
  }
}

.avatar__says {
  position: absolute;
  top: -0.4rem;
  right: -0.55rem;
  font-family: var(--font-display);
  font-size: var(--type-mark);
  font-weight: 700;
  line-height: var(--lead-flush);
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius) var(--radius) var(--radius) 1px;
  background: var(--accent, var(--flesh));
  color: #16201a;
  white-space: nowrap;
  pointer-events: none;
  z-index: 3;
  animation: says 1.4s var(--ease) forwards;
}

@keyframes says {
  0% {
    opacity: 0;
    transform: translateY(5px) scale(0.6);
  }

  14% {
    opacity: 1;
    transform: translateY(0) scale(1.12);
  }

  24% {
    transform: translateY(0) scale(1);
  }

  76% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  100% {
    opacity: 0;
    transform: translateY(-6px) scale(0.9);
  }
}

/* ==========================================================================
   Reading surface
   ========================================================================== */

.pane {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--ground);
}

.pane__header {
  height: 3.4rem;
  padding: 0 var(--space-6) 0 var(--column-inset);
  display: flex;
  align-items: center;
  gap: var(--space-5);
  border-bottom: 1px solid var(--edge);
  background: var(--ground);
  flex: none;
}

.pane__title {
  font-family: var(--font-display);
  font-size: var(--type-lede);
  font-weight: 600;
  letter-spacing: var(--track-tight);
  margin: 0;
}


/* An agent that will not answer, said once. It replaces a Pause button whose
   label was the only place this was written down, which meant reading a
   control to find out a state. */
.pane__flag {
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--pit);
  background: var(--pit-soft);
  border-radius: var(--radius-pill);
  padding: var(--space-1) var(--space-4);
  flex: none;
}

/* Everything you can do to this agent, behind one glyph. Three text buttons
   over the transcript competed with the title for a row that is read once. */
.pane__more {
  margin-left: auto;
  flex: none;
  border: 0;
  background: none;
  color: var(--faint);
  font-size: var(--type-lede);
  line-height: var(--lead-flush);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-sm);
  transition: color var(--tempo-tap) var(--ease), background var(--tempo-tap) var(--ease);
}

.pane__more:hover,
.pane__more:focus-visible {
  color: var(--text);
  background: var(--sunken);
}

.pane__scroll {
  flex: 1;
  overflow-y: auto;
  /* Stated rather than left to compute. Setting `overflow-y` alone makes the
     other axis `auto` too, so anything a fraction of a rem too wide gives the
     reading column a horizontal scrollbar. Nothing here is meant to be scrolled
     sideways: what genuinely cannot wrap, code and tables, carries its own
     scroller. */
  overflow-x: hidden;
  padding: var(--space-6) 0 var(--space-4);
}

/* ==========================================================================
   Messages

   An agent's words are paper: full measure, a portrait in the gutter, nothing
   over the top of them. Yours are a bubble against the right edge. That is the
   whole of the attribution in a channel, and it is enough, because a channel
   has exactly two participants and one of them is you. What it replaces was a
   name and a clock over every message, which in a run of four replies written
   in the same minute is four headers carrying one fact between them.

   The pair's own thread still writes the names out: both participants there
   are agents, and neither of them is the person reading.
   ========================================================================== */

.msg {
  /* The lane the clock is drawn in, floored at what a twelve-hour one needs.
     A floor and not a width, because the string is the operator's locale
     rather than this file's: "22:37", "10:37 PM" and "10:37 p.m." are 1.8rem,
     2.9rem and 3.6rem of it. Both halves of that earn their keep. Held open
     whether or not the row has a clock, a bubble settling out of the stream
     lands at the width it was already being drawn at. Free to grow past the
     floor, there is no locale where the words run under the time. */
  --clock: 2.9rem;

  display: grid;
  /* Three lanes: the portrait, the words, and the clock. The clock is a lane
     of its own rather than something laid over the top right corner, because
     the top right corner is where the first line of a full-measure paragraph
     already ends. A reserve in the padding is the same bug one number later:
     whatever is written there is too small for somebody's locale, and what it
     is too small by is a word of the message underneath it. */
  grid-template-columns: 2.1rem minmax(0, 1fr) minmax(var(--clock), auto);
  gap: var(--space-5);
  padding: var(--space-2) var(--space-4) var(--space-2) var(--column-inset);
}

.msg:hover {
  background: color-mix(in oklab, var(--sunken) 55%, transparent);
}

.msg--continued {
  padding-top: 0;
}

.msg__gutter {
  grid-column: 1;
}

/* A measure, not the width of the window. Nothing else in the transcript
   constrains these now that the names and clocks are gone, and on a wide window
   a paragraph ran a hundred and twenty characters to the line, which is a line
   the eye loses its place on coming back to the left margin. */
.msg__body {
  grid-column: 2;
  min-width: 0;
  max-width: 42rem;
}

/* Yours: no portrait, no gutter, and held off the right edge. Nothing in the
   log has to say who wrote it, because the side it is on already has. Mirrored
   down to the clock, which takes the lane on the left, so the bubble is held
   off that edge by the width of a time rather than by a figure that was about
   that wide. */
.msg[data-operator="true"] {
  grid-template-columns: minmax(var(--clock), auto) minmax(0, 1fr);
  justify-items: end;
  padding-left: var(--space-4);
  padding-right: var(--space-7);
}

.msg[data-operator="true"] .msg__body {
  /* Shorter than an agent's. What you type is a question or an instruction,
     and a bubble is the wrong shape for anything longer than a few lines. */
  max-width: min(32rem, 100%);
  padding: var(--space-3) var(--space-5);
  border-radius: var(--radius);
  /* Recessed rather than accented. The amber means the app wants something
     from you, and a message you already sent wants nothing: tinted with it,
     every line you have ever typed reads as a pending request and competes
     with the one card on the page that actually is one. */
  background: var(--sunken);
}

/* Two of your own in a row are two bubbles with air between them. No tail on
   either: which one a tail belongs on is a question about the end of a run,
   and a transcript row does not know it is the last of one. */
.msg--continued[data-operator="true"] .msg__body {
  margin-top: var(--space-1);
}

.msg__head {
  display: flex;
  align-items: baseline;
  gap: var(--space-4);
  margin-bottom: var(--space-1);
  flex-wrap: wrap;
}

.msg__author {
  font-family: var(--font-display);
  font-size: var(--type-ui);
  font-weight: 600;
  letter-spacing: var(--track-tight);
}

/* In its own lane and inked on hover, so revealing it moves nothing and
   nothing is under it to move. Every message has a time; almost none of them
   are worth a line of their own, and the transcript already draws a line
   wherever the gap was long enough to notice. */
.msg__at {
  grid-column: 3;
  /* Stated, because it is the one child placed behind the cursor. Sparse
     auto-placement only ever moves forward, so the operator's clock, which is
     written after the bubble and drawn in the lane before it, lands on a
     second row of its own without this. */
  grid-row: 1;
  justify-self: end;
  align-self: start;
  /* Onto the first line of the message rather than the top of the row. */
  margin-top: var(--space-1);
  white-space: nowrap;
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  font-variant-numeric: tabular-nums;
