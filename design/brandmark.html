  color: var(--faint);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--tempo-tap) var(--ease);
}

.msg[data-operator="true"] .msg__at {
  grid-column: 1;
  justify-self: start;
}

.msg:hover .msg__at {
  opacity: 1;
}

/* When a conversation picked up again. The only clock a transcript draws
   unasked, and it is drawn where the answer changed. */
.when-row {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-5) var(--space-7) var(--space-4);
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  letter-spacing: var(--track-caps);
  color: var(--faint);
}

/* ==========================================================================
   Markdown

   Message bodies are Markdown because models write Markdown. The scale here is
   deliberately compressed: these are chat messages, not documents, so a
   heading is a slightly louder line rather than a title.
   ========================================================================== */

.md {
  font-size: var(--type-body);
  line-height: var(--lead-read);
  color: var(--text);
  overflow-wrap: anywhere;
}

.md > *:first-child {
  margin-top: 0;
}
.md > *:last-child {
  margin-bottom: 0;
}

.md p {
  margin: 0 0 var(--space-4);
}

.md h1,
.md h2,
.md h3,
.md h4 {
  font-family: var(--font-display);
  font-weight: 600;
  line-height: var(--lead-tight);
  margin: var(--space-6) 0 var(--space-3);
}

.md h1 { font-size: var(--type-lede); }
.md h2 { font-size: var(--type-lede); }
.md h3 { font-size: var(--type-body); }
.md h4 { font-size: var(--type-body); }

/* Markers restored, because Tailwind's preflight takes them off every list on
   the page and nothing here put them back: an agent's numbered steps arrived
   as three indented sentences with the order silently dropped. `revert` rather
   than `decimal` and `disc`, so a nested list still gets the browser's own
   sequence instead of the same mark at every depth. */
.md ul,
.md ol {
  margin: 0 0 var(--space-4);
  padding-left: var(--space-7);
  list-style: revert;
}

.md li {
  margin: var(--space-1) 0;
}

/* Except where the checkbox is the marker. */
.md .task-list-item {
  list-style: none;
}

.md li::marker {
  color: var(--faint);
}

.md a {
  color: var(--flesh);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}

.md code {
  font-family: var(--font-mono);
  font-size: 0.84em;
  background: var(--sunken);
  border: 1px solid var(--edge);
  border-radius: var(--radius-xs);
  padding: var(--space-1) var(--space-2);
}

.md__pre {
  margin: var(--space-4) 0;
  padding: var(--space-5) var(--space-5);
  background: var(--sunken);
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  overflow-x: auto;
}

.md__pre code {
  background: none;
  border: 0;
  padding: 0;
  font-size: var(--type-aside);
  line-height: var(--lead-read);
}

.md blockquote {
  margin: var(--space-4) 0;
  padding: var(--space-1) 0 var(--space-1) var(--space-5);
  border-left: 2px solid var(--edge);
  color: var(--muted);
}

.md__scroll {
  overflow-x: auto;
  margin: var(--space-4) 0;
}

.md table {
  border-collapse: collapse;
  font-size: var(--type-ui);
}

.md th,
.md td {
  border: 1px solid var(--edge);
  padding: var(--space-2) var(--space-4);
  text-align: left;
  /* `break-word` rather than the body's `anywhere`, and the difference is the
     whole reason this line exists. Both break a word that will not fit, but
     `anywhere` also makes a cell's min-content width one character, and auto
     table layout sizes a squeezed column to exactly that: a `Result` column
     next to a wide one came out a letter wide, spelling `Re/sul/t` down three
     lines. `break-word` leaves min-content at the longest word, so a column is
     never narrower than a word in it, and a token genuinely longer than the
     table gets the sideways scroller `.md__scroll` is there to give it. */
  overflow-wrap: break-word;
}

.md th {
  background: var(--sunken);
  font-weight: 600;
}

.md hr {
  border: 0;
  border-top: 1px solid var(--edge);
  margin: var(--space-6) 0;
}

/* The streaming bubble gets a caret so a pause reads as "still typing" rather
   than "finished and said little". */
.md--streaming .md > *:last-child::after {
  content: "";
  display: inline-block;
  width: 0.45rem;
  height: 0.95em;
  vertical-align: text-bottom;
  margin-left: var(--space-1);
  background: var(--flesh);
  animation: caret 1.05s steps(2) infinite;
}

@keyframes caret {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

/* --- a callout -----------------------------------------------------------

   A quote a model opened with an alert marker, drawn as a box rather than as a
   rule down the side, so the one paragraph addressed to the operator is found
   before the eight around it are read. `lib/callout.ts` is which markers open
   one and why there are two of them.

   The amber box is the only filled panel in the reading column, and that is
   the token block's rule rather than a hole in it: what carries hierarchy here
   is size, weight and air, and the one exception is the accent that means a
   person has to do something. A quiet callout gets the hairline and no fill,
   because it is a thing worth seeing rather than a thing being asked for, and
   a second tint would make the first one furniture.
   ------------------------------------------------------------------------ */

.md .callout {
  margin: var(--space-4) 0;
  padding: var(--space-5);
  border: 1px solid var(--edge);
  border-radius: var(--radius);
}

/* A paragraph carries its own bottom margin, which inside a box is the last
   line sitting a step off the floor it is standing on. */
.md .callout > *:last-child {
  margin-bottom: 0;
}

.md .callout--asks {
  border-color: color-mix(in oklab, var(--flesh) 45%, var(--edge));
  background: var(--flesh-soft);
}

/* The label is the app's word, not the model's, so it is drawn as the app's
   own furniture: the same uppercase mono eyebrow every state in this file
   is set in. */
.md .callout__label {
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  letter-spacing: var(--track-caps);
  line-height: var(--lead-ui);
  text-transform: uppercase;
  color: var(--faint);
  margin: 0 0 var(--space-3);
}

.md .callout--asks .callout__label {
  color: var(--flesh);
}

/* ==========================================================================
   Figures

   A fenced block the transcript draws instead of printing: a chart, or a page
   an agent wrote. One card either way, so a figure sits in a conversation the
   way a file does rather than as a wall of markup mid-sentence.

   The series colors are the one block of literal hex left in this file, and
   they are literal on purpose. Every other color here is a decision somebody
   can revise; these eight are the output of a check (neighboring slots must
   stay apart for a red-green colorblind reader on this exact surface) and
   `palette.test.ts` recomputes that check from these values. Editing one by eye
   fails the suite, which is the intended experience.
   ========================================================================== */

.figure {
  margin: var(--space-5) 0;
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  background: var(--raised);
  overflow: hidden;

  --series-0: #008300;
  --series-1: #2a78d6;
  --series-2: #e87ba4;
  --series-3: #eda100;
  --series-4: #1baf7a;
  --series-5: #eb6834;
  --series-6: #4a3aa7;
  --series-7: #e34948;

  /* What separates two touching marks: the surface showing through, never a
     stroke around each one. A stroke is ink that is not data. */
  --chart-surface: var(--raised);
}

/* Not paper flipped. The same eight hues re-stepped for a dark ground and
   measured as their own set, which is why green is the one value that repeats:
   it already sat in both bands. */
:root[data-surface="dark"] .figure {
  --series-1: #3987e5;
  --series-2: #d55181;
  --series-3: #c98500;
  --series-4: #199e70;
  --series-5: #d95926;
  --series-6: #9085e9;
  --series-7: #e66767;
}

.figure--waiting {
  padding: var(--space-6) var(--space-6);
}

.figure__body {
  padding: var(--space-5) var(--space-5) var(--space-2);
}

.figure__foot {
  display: flex;
  align-items: baseline;
  gap: var(--space-4);
  padding: var(--space-2) var(--space-4) var(--space-4);
}

/* Takes the row when it is open, so the table lands under both controls rather
   than shoving the button off to one side of it. */
.figure__foot .chart__table {
  flex: 1 1 auto;
  min-width: 0;
}

.figure__fault {
  margin: 0;
  padding: 0 var(--space-2);
  font-size: var(--type-aside);
  color: var(--alarm);
}

.figure__source {
  margin-top: var(--space-4);
}

/* --- the chart itself --------------------------------------------------- */

.chart__title {
  font-family: var(--font-display);
  font-size: var(--type-body);
  font-weight: 600;
  margin: 0 0 var(--space-3);
  color: var(--text);
}

/* The readout is positioned against this, and it is the drawing's own box
   rather than the card's: the percentages it is placed by are of the viewBox. */
.chart__frame {
  position: relative;
}

.chart__svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

/* Recessive, hairline and solid. Dashed reads as a threshold or a projection
   when it is only a grid. */
.chart__grid {
  stroke: var(--edge);
  stroke-width: 1;
}

/* Zero is not a gridline: every bar is measured from it. */
.chart__axis {
  stroke: var(--faint);
  stroke-width: 1;
}

.chart__tick,
.chart__name {
  font-family: var(--font-ui);
  font-size: var(--type-fine);
  fill: var(--faint);
  /* Ticks are a column of numbers, which is the one place equal-width digits
     are worth having. */
  font-variant-numeric: tabular-nums;
}

.chart__name {
  font-variant-numeric: normal;
}

/* Text never wears the data color. A pale hue is illegible as type on the
   surface, and identity comes from the colored mark beside the words. */
.chart__value {
  font-family: var(--font-ui);
  font-size: var(--type-fine);
  font-weight: 600;
  fill: var(--muted);
}

.chart__line {
  stroke-linejoin: round;
  stroke-linecap: round;
}

.chart__bar,
.chart__wedge {
  transition: opacity var(--tempo-tap) var(--ease);
}

/* The mark under the pointer lifts, so the reader can see it respond. The
   others recede rather than the hovered one brightening: brightening a fill
   changes the color a series is identified by. */
.chart__frame:hover .chart__bar:not([data-lit]),
.chart__frame:hover .chart__wedge:not([data-lit]) {
  opacity: 0.55;
}

.chart__dot {
  stroke: var(--chart-surface);
  stroke-width: 2;
}

/* The ring keeps two overlapping points readable as two, and the transparent
   circle over each is what the pointer is actually aiming at: a nine-pixel dot
   is a pinpoint nobody hits. */
.chart__mark > :first-child {
  stroke: var(--chart-surface);
  stroke-width: 2;
}

.chart__mark[data-lit] > :first-child {
  stroke: var(--text);
}

.chart__hit,
.chart__band {
  fill: transparent;
}

.chart__band:hover,
.chart__mark:hover {
  cursor: default;
}

.chart__band:focus-visible,
.chart__mark:focus-visible,
.chart__wedge:focus-visible {
  outline: 2px solid var(--flesh);
  outline-offset: 1px;
}

/* --- what is under the pointer ------------------------------------------ */

.chart__readout {
  position: absolute;
  transform: translate(-50%, 0);
  pointer-events: none;
  min-width: 6rem;
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  background: var(--raised);
  box-shadow: var(--lift-2);
  font-size: var(--type-small);
  z-index: 2;
}

.chart__readout-head {
  margin: 0 0 var(--space-2);
  color: var(--muted);
  font-size: var(--type-meta);
}

.chart__readout-row {
  display: flex;
  align-items: baseline;
  gap: var(--space-3);
  margin: var(--space-1) 0 0;
}

/* The value leads and the name follows, which is the legend's hierarchy
   inverted: by the time somebody is hovering they know which series they want
   and are after the number. */
.chart__readout-value {
  font-weight: 600;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.chart__readout-name {
  color: var(--muted);
}

/* A short stroke rather than a filled box. At this density a box is
   data-weight ink doing a label's job. */
.chart__key {
  display: inline-block;
  width: 0.7rem;
  height: 2px;
  border-radius: 1px;
  flex: none;
  align-self: center;
}

.chart__swatch {
  display: inline-block;
  width: 0.55rem;
  height: 0.55rem;
  border-radius: 1px;
  flex: none;
}

/* The legend mirrors the mark, which for a scatter means the shape as well. */
.chart__swatch[data-mark="circle"] { border-radius: 50%; }
.chart__swatch[data-mark="diamond"] { border-radius: 1px; transform: rotate(45deg); }
.chart__swatch[data-mark="triangle"] {
  background: none;
  width: 0;
  height: 0;
  border-left: 0.3rem solid transparent;
  border-right: 0.3rem solid transparent;
  border-bottom: 0.52rem solid currentColor;
}

/* --- legend and figures ------------------------------------------------- */

.md .chart__legend,
.chart__legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2) var(--space-5);
  list-style: none;
  margin: var(--space-4) 0 0;
  padding: 0;
}

.chart__legend-item {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  border: 0;
  background: none;
  padding: var(--space-1) 0;
  font-size: var(--type-small);
  color: var(--muted);
  cursor: pointer;
}

/* Switched off, said twice: struck through as well as faded, because faded
   alone is a state somebody reads as "this one is less important". */
.chart__legend-item[aria-pressed="false"] {
  opacity: 0.5;
  text-decoration: line-through;
}

/* A key rather than a switch. Nothing to press, so nothing that looks pressable. */
.chart__legend-item[data-static] {
  cursor: default;
}

.chart__table {
  margin: 0;
  font-size: var(--type-aside);
}

/* Sized and spaced like the ghost button beside it, because they are two
   controls doing the same kind of job and a summary that reads as body text
   next to a button reads as a mistake. */
.chart__table > summary {
  cursor: pointer;
  color: var(--muted);
  font-size: var(--type-small);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  list-style-position: inside;
}

.chart__table > summary:hover {
  background: var(--sunken);
  color: var(--text);
}

.chart__table[open] > summary {
  margin-bottom: var(--space-3);
}

.chart__table td {
  font-variant-numeric: tabular-nums;
}

/* --- a page an agent wrote ---------------------------------------------- */

.artifact {
  position: relative;
}

.artifact__frame {
  display: block;
  width: 100%;
  border: 0;
  border-radius: var(--radius-sm);
  background: #ffffff;
}

/* Revealed by the pointer. A transcript is a conversation, and a control on
   every figure in it is a column of buttons down the side of the reading. */
.artifact__open {
  position: absolute;
  top: 0.4rem;
  right: 0.4rem;
  opacity: 0;
  background: var(--raised);
}

.artifact:hover .artifact__open,
.artifact__open:focus-visible {
  opacity: 1;
}

/* The full view is the one thing in the dialog that has room, so the frame
   takes all of it. Nothing here may clip: the body is what scrolls. */
.artifact__full .artifact,
.artifact__full .artifact__frame {
  height: 100%;
  min-height: 60vh;
}

/* What a page handed back, waiting for a person.

   Outside the frame and unmistakably Guaca's, which is the whole arrangement
   rather than a layout preference: the page draws the controls the operator
   works, and the app draws the one that spends a turn. Nothing in here can be
   reached, styled or pressed by the document above it. */
.artifact__answer {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  margin-top: var(--space-4);
  padding: var(--space-4);
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  background: var(--sunken);
}

.artifact__answer-note {
  margin: 0;
  font-size: var(--type-aside);
  color: var(--muted);
}

.artifact__answer-note--fault {
  color: var(--alarm);
}

/* The value goes out under the operator's name, so it is shown before it goes
   and shown as text. Monospace because it is JSON and reading it is the job. */
.artifact__answer-value {
  margin: 0;
  padding: var(--space-3);
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  color: var(--text);
  background: var(--raised);
  border: 1px solid var(--edge);
  border-radius: var(--radius-xs);
}

.artifact__answer-acts {
  display: flex;
  gap: var(--space-3);
}

/* ==========================================================================
   Chips, controls, dialogs
   ========================================================================== */

.route {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  letter-spacing: var(--track-flat);
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-pill);
  background: var(--flesh-soft);
  color: color-mix(in oklab, var(--flesh) 82%, var(--text));
  white-space: nowrap;
}

.route__arrow {
  opacity: 0.6;
}

/* --- the flow board ------------------------------------------------------

   A sequence diagram, upright. Participants are columns, time runs down, and
   every message owns a row wide enough to show what was actually said. The
   previous board ran sideways, which left each message a bare arrow in a 92px
   column with no room for a word of it.
   ------------------------------------------------------------------------ */

.flow {
  /* The time column, plus the gap after it. The lane headers, the lifelines
     and the arrows are three separate coordinate spaces that have to agree,
     so the offset between them is named once. */
  --flow-gutter: 3.7rem;
  --flow-pad: 1.15rem;

  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.flow__head {
  display: flex;
  align-items: flex-end;
  gap: var(--space-5);
  padding: var(--space-3) var(--flow-pad) var(--space-3) calc(var(--flow-pad) + var(--flow-gutter));
  background: var(--ground);
}

.flow__lanes {
  display: flex;
  flex: none;
}

.flow__lane {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-2);
  flex: none;
}

.flow__name {
  font-family: var(--font-display);
  font-size: var(--type-fine);
  font-weight: 600;
  color: var(--muted);
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.flow__head-note {
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--faint);
  padding-bottom: var(--space-1);
}

.flow__scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}

.flow__body {
  position: relative;
  padding: var(--space-3) var(--flow-pad) var(--space-4);
}

/* The lifelines. Absolute so they run the whole height behind every row
   instead of restarting at each one. */
.flow__rails {
  position: absolute;
  top: 0;
  bottom: 0;
  left: calc(var(--flow-pad) + var(--flow-gutter));
  pointer-events: none;
}

.flow__rail {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--edge);
}

/* One run, collapsed to a line until asked for. */
.run {
  border-bottom: 1px solid var(--edge);
}

.run__head {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  width: 100%;
  padding: var(--space-4) var(--flow-pad);
  background: none;
  border: 0;
  text-align: left;
  font-size: var(--type-small);
  color: var(--text);
}

.run__head:hover {
  background: var(--sunken);
}

.run[data-open="true"] .run__head {
  background: var(--sunken);
}

.run__caret {
  font-size: var(--type-fine);
  color: var(--faint);
  width: 0.7rem;
  flex: none;
}

.run__when {
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  color: var(--faint);
  flex: none;
  display: flex;
  gap: var(--space-2);
}

.run__day {
  color: var(--muted);
}

.run__faces {
  display: flex;
  flex: none;
}

/* Overlapped, so a crowded run still costs a fixed strip of the header rather
   than growing sideways the way the lanes used to. */
.run__face + .run__face {
  margin-left: calc(var(--space-3) * -1);
}

.run__face[data-gone] {
  opacity: 0.45;
  filter: grayscale(0.7);
}

.run__opener {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted);
}

.run__count {
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  color: var(--faint);
  flex: none;
}

.run__tokens {
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  color: var(--faint);
  flex: none;
  font-variant-numeric: tabular-nums;
}

.run__board {
  padding-bottom: var(--space-4);
}

.flow__gone {
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--faint);
}

.flow__lane[data-gone] {
  opacity: 0.55;
}

.flow__row {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-4);
  width: 100%;
  background: none;
  border: 0;
  padding: var(--space-1) var(--space-3) var(--space-1) 0;
  border-radius: var(--radius-sm);
  text-align: left;
}

.flow__row:hover {
  background: var(--sunken);
}

.flow__time {
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  color: var(--faint);
  flex: none;
  width: 3.1rem;
  font-variant-numeric: tabular-nums;
}

.flow__excerpt {
  display: flex;
  align-items: baseline;
  gap: var(--space-4);
  min-width: 0;
  flex: 1;
}

.flow__who {
  font-family: var(--font-display);
  font-size: var(--type-meta);
  font-weight: 600;
  color: var(--text);
  flex: none;
}

/* One line, always. The board is for scanning; the modal is for reading. */
.flow__said {
  font-size: var(--type-small);
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.flow__said--empty {
  color: var(--faint);
  font-style: italic;
}

.flow__hop {
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  color: var(--faint);
  flex: none;
}


/* --- the wire ------------------------------------------------------------

   Agent-to-agent traffic, reduced to one centered line. A channel should read
   as a conversation with one agent; rendering every peer message as a bubble
   buried the operator's own conversation. The content is one click away.
   ------------------------------------------------------------------------ */

.wire {
  display: flex;
  align-items: center;
  gap: var(--space-5);
  padding: var(--space-2) var(--space-7) var(--space-2) var(--column-inset);
}

/* `min-width` so the bracket survives a row that fills. A burst of four peers
   is as wide as the column, and rules that shrink to nothing on that row and
   not on the one above it make two rows of the same kind look like two kinds
   of row. */
.wire::before,
.wire::after {
  content: "";
  flex: 1;
  min-width: 1.4rem;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--edge), transparent);
}

/* Shrinks rather than overflows. Two of these sit on one row with an arrow
   between them, so `flex: none` and a 70% cap meant a pair of long agent names
   added up to more than the row: the line pushed past the reading column, and
   `.pane__scroll` computes its `overflow-x` to `auto` because `overflow-y` is
   set, so the whole transcript earned a horizontal scrollbar. It showed up the
   day the column got narrower for the panel beside it. */
/* Deliberately not a pill. A burst is the quietest thing a channel draws: it
   says traffic happened and holds the content one click away. Bordered and
   filled, two of these in a row read as two cards the operator is meant to
   study, which is the opposite of what collapsing them was for. */
.wire__chip {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  flex: 0 1 auto;
  min-width: 0;
  max-width: 45%;
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-pill);
  border: 1px solid transparent;
  background: none;
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  letter-spacing: var(--track-flat);
  color: var(--faint);
  transition: border-color var(--tempo-tap) var(--ease), color var(--tempo-tap) var(--ease);
}

.wire__chip:hover {
  color: var(--text);
}

.wire__arrow {
  color: var(--accent, var(--flesh));
  flex: none;
  font-size: var(--type-aside);
  line-height: var(--lead-flush);
}

.wire__label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.wire__why {
  font-size: var(--type-fine);
  color: var(--faint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.wire__meta {
  opacity: 0.6;
  flex: none;
  font-variant-numeric: tabular-nums;
}

/* Louder than ordinary traffic, and on purpose: this is the runtime stopping a
   message rather than a message, and the reason is on the row rather than
   behind the click. */
.wire[data-refused="true"] .wire__chip {
  padding: var(--space-2) var(--space-4);
  background: var(--raised);
  border-color: color-mix(in oklab, var(--pit) 40%, transparent);
  color: var(--pit);
}

/* A burst: one chip per peer. Several peers is the common case for a fan-out
   and they belong together, so they wrap among themselves rather than in the
   row. As flex items of a wrapping `.wire` the two rules joined the wrap flow:
   the left one was squeezed to a stub on the first line and the right one was
   stranded beside whichever chip wrapped last, which drew one moment of the
   run as two ragged rows pointing at nothing. */
.wire__chips {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--space-3);
  min-width: 0;
}

.wire__chips .wire__chip {
  max-width: 100%;
}

/* There is a conversation behind this one. The chip takes on its pill under
   the pointer rather than wearing one permanently, because "click me" is only
   worth saying to somebody already pointing at it. */
.wire__chip--open:hover {
  padding: var(--space-1) var(--space-4);
  margin: 0 calc(var(--space-2) * -1);
  background: color-mix(in oklab, var(--accent, var(--flesh)) 8%, var(--raised));
  border-color: color-mix(in oklab, var(--accent, var(--flesh)) 55%, var(--edge));
  color: var(--text);
}

.wire[data-refused="true"] .wire__arrow {
  color: var(--pit);
}

/* A routine coming due.
   Alone on its row, so it is not held to the 45% two chips have to share: the
   name of a routine is up to forty-four characters and there is nothing beside
   it to crowd. Accented in mint to match the clock face it carries, which is
   the same glyph the schedule panel draws. */
.wire--routine .wire__chip {
  max-width: 100%;
  --accent: var(--mint);
}

.wire--routine .routine__mark {
  margin-top: 0;
}

/* Quieter still: bookkeeping the operator rarely needs, like a directory
   lookup. No rules either side, no click target. */
.wire--quiet::before,
.wire--quiet::after {
  display: none;
}

.wire--quiet {
  justify-content: center;
}

.wire__quiet-text {
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  color: var(--faint);
}

.wire--notice::before,
.wire--notice::after {
  display: none;
}

.wire--notice {
  justify-content: center;
}

/* An agent's own closing words, written after it had already answered its peer.
   Nobody was sent them, so they are neither centered like a system line nor
   bracketed like traffic: both of those say something passed between two
   participants. In the trail's column, on the same 2.85rem of gutter, because
   this belongs with what the turn did rather than with what was said to
   anybody. */
.aside {
  padding: var(--space-1) var(--space-7) var(--space-3) var(--column-indent);
}

.aside .md {
  border-left: 2px solid var(--edge);
  padding-left: var(--space-5);
  font-size: var(--type-ui);
  color: var(--faint);
}

/* ==========================================================================
   The trail: what an agent did on its own turn

   The quietest thing a channel draws, and by volume it used to be the loudest:
   a browsing turn spends most of its twenty-four rounds in the browser, and
   every one of those was a line reading `Chef used browse`. Now a run of calls
   is chips, one per kind of work, and the calls open underneath in place.

   Deliberately not the burst's shape, even though both collapse. A burst is a
   conversation with somebody, so it is centered and bracketed by rules like the
   rest of the traffic. This is the agent's own working, so it sits under the
   left margin where the agent's words are, at the size of a footnote.
   ========================================================================== */

.trail {
  padding: var(--space-2) var(--space-7) var(--space-2) var(--column-inset);
}

/* Wide gaps between chips and tight ones inside. Four of these on a line with
   the same space either side of every word read as one paragraph of gray
   monospace, which is exactly the shape the row was collapsed to get away
   from. */
.trail__chips {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2) var(--space-6);
  /* In line with the message bodies beside it: the gutter is 2.1rem of avatar
     and 0.75rem of gap, and a footnote that starts at the margin instead reads
     as a different column of the page. */
  padding-left: var(--column-indent);
}

.trail__chip {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  min-width: 0;
  max-width: 100%;
  /* The one backstop under the rule that the label is never cut: a label wider
     on its own than the pane is cut here rather than drawn over the message
     beside it. Nothing real reaches it, and the alternative is a layout that
     depends on nothing real ever reaching it. */
  overflow: hidden;
  padding: var(--space-1) var(--space-2);
  margin: 0 calc(var(--space-2) * -1);
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  background: none;
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  letter-spacing: var(--track-flat);
  color: var(--faint);
  text-align: left;
  transition: border-color var(--tempo-tap) var(--ease), color var(--tempo-tap) var(--ease), background-color var(--tempo-tap) var(--ease);
}

/* As with a burst chip: "you can open this" is only worth saying to somebody
   already pointing at it. */
.trail__chip--open:hover,
.trail__chip--open[aria-expanded="true"] {
  background: var(--sunken);
  border-color: var(--edge);
  color: var(--text);
}

.trail__caret {
  flex: none;
  font-size: var(--type-fine);
  line-height: var(--lead-flush);
  color: var(--faint);
}

/* Never cut. Flex shrinks in proportion to what each item asked for, so a
   refused call whose reason runs to a paragraph asked for twenty times what its
   label did, took the row, and left the label as `U…`: a chip saying one
   character about which call went wrong. What came back is the only thing on a
   chip that yields, and the chip clips whatever is left over. */
.trail__label {
  flex-shrink: 0;
  white-space: nowrap;
}

/* What came back. Present on a chip only where it belongs to one call: several
   calls have several answers, and a chip carrying the first of them is a chip
   that is wrong about the rest. */
.trail__said {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  opacity: 0.72;
}

/* A credential this command spent, by name. The operator's audit trail for
   their own tokens, so it is never folded into a count and never behind a
   click. Pit brown, because it is Guaca saying something rather than the agent.
   The value is not here and there is no field it could arrive in. */
.trail__spent {
  flex: none;
  padding: 0 var(--space-2);
  border-radius: var(--radius-pill);
  background: var(--pit-soft);
  color: var(--pit);
  font-size: var(--type-fine);
}

/* Something went wrong, and the row it is on is otherwise a list of things
   that went right. Given a shape rather than only a color, for the same reason
   a refused send is louder than the traffic around it: this is the one chip on
   the row the operator may have to do something about. */
.trail__chip[data-failed] {
  padding: var(--space-1) var(--space-4);
  margin: 0;
  border-color: color-mix(in oklab, var(--pit) 32%, transparent);
  background: var(--pit-soft);
  color: var(--pit);
}

.trail__chip[data-failed] .trail__said {
  opacity: 1;
}

/* Opened. Indented under the chips rather than centered, because these are the
   calls behind one chip and not a new kind of row. */
.trail__steps {
  list-style: none;
  margin: var(--space-2) 0 var(--space-2);
  padding: var(--space-3) 0 var(--space-3) var(--space-5);
  margin-left: var(--column-indent);
  max-width: 42rem;
  border-left: 2px solid var(--edge);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.trail__step[data-failed] {
  color: var(--pit);
}

.trail__step-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  color: var(--faint);
}

.trail__step-title {
  color: var(--muted);
}

.trail__step[data-failed] .trail__step-title,
.trail__step[data-failed] .trail__said {
  color: var(--pit);
}

/* The command, the URL, the memory that was written: exactly as it was.
   Never markdown, because this is a record of what happened rather than
   something written to be read, and a model that could format it could
   describe a command as something other than the command it ran. */
.trail__target {
  margin: var(--space-1) 0 0;
  padding: var(--space-3) var(--space-4);
  max-height: 11rem;
  overflow: auto;
  border-radius: var(--radius-sm);
  background: var(--sunken);
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  line-height: var(--lead-ui);
  color: var(--text);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* Two versions of a small page, drawn as the lines between them. Same block as
   the one above and the same reasons for it, with a gutter down the left for
   what happened to each line.

   Color is the fast read and never the only one: the marker is a character in
   the text, so the distinction survives a reader who cannot tell the two hues
   apart and survives being copied out. The grounds are mixed rather than named
   because they have to sit on paper and on ink at the same weight, and a pair
   of literals chosen against white turns into two glowing bars on a dark page.
   Unchanged lines are the memory itself and are left alone: tinting them too
   would make a rewrite of one sentence look like a rewrite of the page. */
.diff {
  margin: var(--space-1) 0 0;
  padding: var(--space-3) 0;
  max-height: 16rem;
  overflow: auto;
  border-radius: var(--radius-sm);
  background: var(--sunken);
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  line-height: var(--lead-ui);
  color: var(--muted);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* A row rather than a block, so a line too long for the column wraps under
   itself and not under its own marker. A memory is prose in markdown and half
   of it wraps; wrapped into the gutter, the markers stop being a column and the
   diff stops being scannable, which is the only thing it had. */
.diff__line {
  display: flex;
  padding-right: var(--space-4);
}

.diff__text {
  min-width: 0;
}

.diff__line[data-kind="added"] {
  background: color-mix(in oklab, var(--mint) 14%, transparent);
  color: var(--text);
}

.diff__line[data-kind="removed"] {
  background: color-mix(in oklab, var(--alarm) 13%, transparent);
  color: var(--text);
}

/* Aligned down one column so the page reads as a page and the markers read as
   a margin, which is the whole of what makes a diff scannable. */
.diff__mark {
  flex: none;
  width: 1.5rem;
  padding-left: var(--space-4);
  color: var(--faint);
}

.diff__line[data-kind="added"] .diff__mark {
  color: var(--mint);
}

.diff__line[data-kind="removed"] .diff__mark {
  color: var(--alarm);
}

/* ==========================================================================
   Permission requests

   A card in the transcript rather than a dialog. The agent that asked is parked
   until it is answered, so this has to be findable later and readable next to
   whatever led to it, which a modal over the top of the window is not. Live it
   sits up off the page; answered it settles back into the paper, because it is
   then a record and not a decision.
   ========================================================================== */
.ask {
  margin: var(--space-4) var(--space-7) var(--space-4) var(--column-inset);
  border: 1px solid var(--edge);
  border-radius: var(--radius);
  background: var(--raised);
  padding: var(--space-5) var(--space-6);
}

.ask[data-state="pending"] {
  border-color: color-mix(in oklab, var(--flesh) 45%, var(--edge));
  box-shadow: var(--lift-1);
}

/* Answered, and therefore history. */
.ask:not([data-state="pending"]) {
  background: var(--ground);
  color: var(--muted);
}

.ask__head {
  display: flex;
  align-items: flex-start;
  gap: var(--space-4);
}

.ask__summary {
  margin: 0;
  font-weight: 600;
  font-size: var(--type-body);
  color: var(--text);
}

.ask:not([data-state="pending"]) .ask__summary {
  font-weight: 500;
  color: var(--muted);
}

.ask__note {
  margin: var(--space-1) 0 0;
  font-size: var(--type-small);
  color: var(--muted);
}

.ask__detail {
  margin: var(--space-5) 0 0;
  display: grid;
  gap: var(--space-3);
}

.ask__detail dt {
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  letter-spacing: var(--track-caps-wide);
  text-transform: uppercase;
  color: var(--faint);
}

/* The model wrote these. They are shown whole, wrapped, and never as markdown;
   a long brief scrolls rather than pushing the buttons off the screen. */
.ask__detail dd {
  margin: var(--space-1) 0 0;
  font-size: var(--type-ui);
  line-height: var(--lead-ui);
  color: var(--text);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 11rem;
  overflow-y: auto;
}

.ask:not([data-state="pending"]) .ask__detail dd {
  color: var(--muted);
  max-height: 5.5rem;
}

.ask__actions {
  margin-top: var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.ask__scope {
  flex-basis: 100%;
  font-size: var(--type-meta);
  color: var(--faint);
}

/* A question rather than a request for permission. Nothing answered on one of
   these grants anything, so it does not carry the ring the other has: that
   border is the app saying "this one is about to do something in your name",
   and spending it on both makes it mean neither. */
.ask--question[data-state="pending"] {
  border-color: var(--edge);
  box-shadow: none;
}

.ask__answer,
.desk__answer {
  display: flex;
  gap: var(--space-3);
  flex: 1;
  min-width: 0;
}

/* A field, not a composer. One line, and it goes when the question is
   answered: `components/Desk.tsx` on what that surface must never become. */
.ask__field,
.desk__field {
  flex: 1;
  min-width: 0;
  min-height: var(--control-h);
  padding: 0 var(--space-4);
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  background: var(--ground);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: var(--type-ui);
}

.ask__field:focus-visible,
.desk__field:focus-visible {
  outline: 2px solid var(--flesh);
  outline-offset: 1px;
}

.wire-modal__head {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  margin-bottom: var(--space-6);
}

.wire-modal__body {
  max-height: 55vh;
  overflow-y: auto;
  padding: var(--space-5);
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  background: var(--ground);
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  line-height: var(--lead-ui);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-sm);
  border: 1px solid var(--edge);
  background: var(--sunken);
  color: var(--muted);
  max-width: 100%;
}

/* The way out of a failure, on the failure itself. A notice that says only what
   went wrong leaves the operator to work out what to do about it. */
.chip__action {
  margin-left: var(--space-1);
  padding: 0 var(--space-2);
  border: 1px solid currentColor;
  border-radius: var(--radius-xs);
  background: none;
  color: inherit;
  font: inherit;
  font-size: var(--type-fine);
}

.chip__action:hover:not(:disabled) {
  background: color-mix(in oklab, currentColor 14%, transparent);
}

.chip__action:disabled {
  opacity: 0.55;
  cursor: default;
}

.chip--guard {
  background: var(--pit-soft);
  border-color: color-mix(in oklab, var(--pit) 35%, transparent);
  color: var(--pit);
}

.chip--error {
  background: color-mix(in oklab, var(--alarm) 12%, transparent);
  border-color: color-mix(in oklab, var(--alarm) 35%, transparent);
  color: var(--alarm);
}

.chip__text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ==========================================================================
   A pair's own thread

   Two agents' exchange, opened off a burst row. It takes the whole pane rather
   than a dialog: it is a conversation, sometimes a long one, and a modal is a
   bad place to read forty messages.
   ========================================================================== */

.pane__pair {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  min-width: 0;
}

.pane__between {
  color: var(--faint);
  font-size: var(--type-ui);
  font-weight: 400;
  line-height: var(--lead-flush);
  margin: 0 var(--space-1);
}

/* Where the composer would be. The shape of the pane does not change when a
   thread is open, so the eye does not have to find the transcript again. */
.viewonly {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-5);
  margin: var(--space-4) var(--column-inset) var(--column-inset);
  padding: var(--space-4) var(--space-5);
  border: 1px dashed var(--edge);
  border-radius: var(--radius);
  background: var(--sunken);
  flex: none;
}

.viewonly__note {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  font-size: var(--type-small);
  color: var(--muted);
}

.viewonly__lock {
  width: 0.9rem;
  height: 0.9rem;
  flex: none;
  opacity: 0.75;
}

/* ==========================================================================
   The turn that is still going

   Above the box you would type into, because that is where an operator waits.
   One line, and one slot above it. The line says what the turn is doing now,
   what it has done and what it is spending, and it is the same height from the
   first token to the last: the composer does not move while a turn runs.

   Two things sit behind it and share the slot: the working the model has
   published, and the chips for the calls it has already made. The chips used
   to be a layer of their own, open, between the transcript and the line — a
   long turn's whole record wrapping across four rows and reflowing every time a
   call came back. One slot means opening either costs the transcript the same
   height, and opening the second does not stack on the first.

   The name on the line is revealed on hover, because whose channel this is has
   been established several times over by the time you reach the bottom of it,
   so the resting state is one moving character. A thought is not, and neither
   is a call that has not come back: both are the reason to look here at all.
   One line, clipped at the pane, because it is replaced several times a second
   and wrapping it would push the composer around the screen.
   ========================================================================== */

.turn {
  display: flex;
  flex-direction: column;
  min-height: 0;
  flex: none;
}

/* Opt-in live work belongs to the scrolling conversation. */
.turn-work {
  margin: var(--space-4) var(--column-inset);
  padding-left: var(--space-5);
  border-left: 1px solid var(--edge);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  min-width: 0;
  color: var(--muted);
  font-size: var(--type-small);
}

.turn-work summary {
  cursor: pointer;
  overflow-wrap: anywhere;
}

.turn-work__thinking > .thought__text {
  margin-top: var(--space-3);
}

.turn-work__call {
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  padding: var(--space-3) var(--space-4);
  background: var(--sunken);
}

.turn-work__name {
  font-family: var(--font-mono);
}

.turn-work__status {
  margin-left: var(--space-4);
}

.turn-work__call[data-failed] {
  border-color: var(--alarm);
}

.turn-work__call[data-failed] .turn-work__status {
  color: var(--alarm);
}

.turn-work__description {
  margin: var(--space-3) 0;
  overflow-wrap: anywhere;
}

/* The slot. Whichever of the two is open takes the same bounds, so the
   transcript above gives up the same height either way, and neither can push
   the conversation off the top of the pane. */
.thought,
.steps {
  max-height: 13rem;
  overflow-y: auto;
  flex: none;
  margin: 0 var(--column-inset) var(--space-3);
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  background: var(--sunken);
}

/* The model's working, in full, when it has been asked for. Bounded so the
   transcript keeps most of the pane: this is a thing to glance into, and the
   answer it is on the way to is what the operator is actually waiting for. */
.thought {
  padding: var(--space-4) var(--space-5);
}

/* The same chips the transcript will draw, in a box of their own. The indents
   they carry there are a message gutter to line up under, and there is no
   gutter in here: left on, they draw the panel's contents as a column that
   starts somewhere the panel has no edge. */
.steps {
  padding: var(--space-3) 0;
}

.steps .trail {
  padding: 0 var(--space-5);
}

.steps .trail__chips {
  padding-left: 0;
}

.steps .trail__steps {
  margin-left: 0;
}

/* As the model wrote it. Wrapped rather than scrolled sideways, and not
   monospace: this is prose, and setting it as machine text would say it is a
   record of something that happened rather than one long thought. */
.thought__text {
  margin: 0;
  font-family: inherit;
  font-size: var(--type-small);
  line-height: var(--lead-ui);
  color: var(--muted);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.thought__empty {
  margin: 0;
  font-size: var(--type-small);
  color: var(--faint);
}

.working {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: 0 var(--column-inset) var(--space-3);
  flex: none;
}

.working__label {
  display: flex;
  align-items: baseline;
  gap: var(--space-4);
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  font-size: var(--type-aside);
  color: var(--muted);
  opacity: 0;
  transform: translateX(-0.3rem);
  transition: opacity var(--tempo-move) var(--ease), transform var(--tempo-move) var(--ease);
  pointer-events: none;
}

/* Reached for, so it can be clicked. Hidden it must not be: a control at
   opacity zero that still swallows the pointer is a dead patch of the window
   nobody can account for. */
.working:hover .working__label,
.working[data-thinking] .working__label {
  opacity: 1;
  transform: none;
  pointer-events: auto;
}

/* The label is a button wherever there is working to open, and nothing about
   it says so until it is reached for. It is a line of chrome that happens to
   be clickable; drawn as a button it would be a second control competing with
   the one beside it that costs money to ignore. */
.working__label--open {
  border: 0;
  background: none;
  padding: 0;
  margin: 0;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

.working__label--open:hover .working__topic,
.working__label--open:hover .working__thought {
  color: var(--text);
}

/* Everything on the line that is not the line: what the turn has spent, how
   much it has done, and the control that stops it. Pushed to the end as one
   group, so the sentence in the middle is what gives up room in a narrow pane
   and the three of them keep their order and their spacing whichever are
   drawn.

   All of it is always visible, unlike the label beside it. A control that
   appears on hover is a control nobody knows is there, and one of these is the
   thing on screen that costs money to leave alone. */
.working__end {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  margin-left: auto;
  flex: none;
}

/* What the turn has done, as one of the chips it opens: the control and its
   contents are the same object at two sizes, rather than a button that happens
   to reveal some chips. */
.working__steps {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  flex: none;
  padding: var(--space-1) var(--space-4);
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  background: none;
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  letter-spacing: var(--track-flat);
  color: var(--faint);
  cursor: pointer;
  transition: border-color var(--tempo-tap) var(--ease), color var(--tempo-tap) var(--ease), background-color var(--tempo-tap) var(--ease);
}

.working__steps:hover,
.working__steps[aria-expanded="true"] {
  background: var(--sunken);
  border-color: var(--edge);
  color: var(--text);
}

/* Something on this turn went wrong. The chip that says what is inside the
   panel; this is the mark on the line that says to go and open it. */
.working__steps[data-failed] {
  color: var(--pit);
}

.working__caret {
  flex: none;
  line-height: var(--lead-flush);
}

/* Lighter than the answer it is on the way to, and italic so a glance can tell
   the two apart without reading either: this is the only text in the pane that
   is not something anybody said. */
.working[data-thinking] .working__label {
  font-style: italic;
  opacity: 0.75;
}

/* The model's own section heading. It changes every half minute rather than
   every frame, which is what makes it the part of the line worth setting in a
   color that asks to be read. */
.working__topic {
  flex: none;
  color: var(--text);
}

/* The sentence under it, which is the part that moves. Clipped rather than
   wrapped: a thought long enough to take two lines would push the composer
   around the screen every time the model finished one. */
.working__thought {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Only where there is a heading to be divided from. The two are one line of
   the same prose, and without a mark between them a heading reads as the first
   few words of the sentence after it. */
.working__topic + .working__thought::before {
  content: "· ";
  color: var(--faint);
}

/* What the turn is waiting on. Upright where a thought is italic, because this
   is the one thing on the line that is not the model talking about itself: it
   is the runtime saying which machine has not answered yet. */
.working__now {
  flex: none;
  font-style: normal;
  color: var(--text);
}

/* How long it has been waiting. Machine text, because it is a number that
   changes every second and a proportional font makes it jitter as it does. */
.working__for {
  flex: none;
  font-family: var(--font-mono);
  font-style: normal;
  font-size: var(--type-fine);
  color: var(--faint);
}

.composer {
  margin: var(--space-4) var(--column-inset) var(--column-inset);
  border: 1px solid var(--edge);
  border-radius: var(--radius);
  background: var(--raised);
  transition: border-color var(--tempo-tap) var(--ease);
  flex: none;
}

.composer:focus-within {
  border-color: color-mix(in oklab, var(--flesh) 55%, var(--edge));
}

/* A drag is over the window and will land here. The whole window is the drop
   target, so the composer is what says where the file is going. */
.composer[data-dragging] {
  border-color: var(--flesh);
  background: color-mix(in oklab, var(--flesh) 8%, var(--raised));
}

.composer__files {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  margin: 0;
  padding: var(--space-4) var(--space-5) 0;
}

.composer__files .chip__name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 16rem;
}

.chip__size {
  color: var(--faint);
  flex: none;
}

/* The picture, not its name. Three screenshots dropped together are three
   copies of `Screenshot 2026-08-17 at 14.02.11.png` and nothing else. */
.chip__thumb {
  width: 1.4rem;
  height: 1.4rem;
  border-radius: var(--radius-xs);
  object-fit: cover;
  flex: none;
}

/* What could not be attached, beside what could. The operator is looking at
   the drop they just made, not at the top of the window. */
.composer__refused {
  list-style: none;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--space-2);
  margin: 0;
  padding: var(--space-4) var(--space-5) 0;
}

.chip__remove {
  border: none;
  background: none;
  color: inherit;
  font: inherit;
  line-height: var(--lead-flush);
  padding: 0 var(--space-1);
  cursor: pointer;
  opacity: 0.7;
}

.chip__remove:hover {
  opacity: 1;
  color: var(--alarm);
}

/* ==========================================================================
   A file on a message

   Shown, not just named. A document that arrives as a filename is a document
   the operator has to open something else to read, and the thing they wanted
   was usually one glance. The strip is bounded in height on purpose: a
   transcript is a conversation, and a preview that takes the pane has stopped
   being a message and become a reader. The full view is one click away.
   ========================================================================== */

.file {
  display: inline-flex;
  flex-direction: column;
  align-items: stretch;
  margin-top: var(--space-3);
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  background: var(--sunken);
  overflow: hidden;
  max-width: min(28rem, 100%);
}

/* Nothing to draw: the row is the whole card, so it keeps the shape the
   transcript had before previews existed. */
.file[data-kind="none"] {
  max-width: 100%;
}

/* The margin is space from the words above, and a file handed over with
   nothing typed has none: that message is a bubble whose only content is this
   card, and the gap left it sitting off-center inside its own padding. */
.file:first-child {
  margin-top: 0;
}

.file__view {
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  border-bottom: 1px solid var(--edge);
  background: var(--raised);
  cursor: zoom-in;
  text-align: left;
}

.file__image {
  display: block;
  max-width: 100%;
  max-height: 17rem;
  object-fit: contain;
  margin: 0 auto;
}

/* The frame is inert. The button behind it is what opens the document, and a
   frame that took the click would leave the one obvious way in doing nothing. */
.file__page {
  height: 15rem;
  overflow: hidden;
  background: var(--raised);
}

.file__frame {
  width: 100%;
  height: 100%;
  border: 0;
  pointer-events: none;
}

/* Cut by height rather than by character count, and faded at the cut so the
   eye reads "there is more" without a line of prose saying it. */
.file__text {
  margin: 0;
  padding: var(--space-4) var(--space-5);
  max-height: 9rem;
  overflow: hidden;
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  line-height: var(--lead-ui);
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text);
  mask-image: linear-gradient(to bottom, #000 70%, transparent);
}

/* A markdown file drawn as the document it is, cut and faded exactly as its
   source would have been. Markdown is what the agents write in, so this is the
   preview that gets used: a brief shown as monospace `##` is one the operator
   reads around rather than through. Same renderer as a message body, because a
   file is the same prose that happened to arrive as one. */
.file__doc {
  padding: var(--space-4) var(--space-5);
  max-height: 11rem;
  overflow: hidden;
  mask-image: linear-gradient(to bottom, #000 70%, transparent);
}

/* The heading a document opens with is not a heading in a conversation: at
   message size it shouts across the transcript, and a card is a glance. */
.file__doc .md {
  font-size: var(--type-small);
}

.file__foot {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-3) var(--space-4) var(--space-3) var(--space-4);
  min-width: 0;
}

.file__name {
  border: 0;
  background: none;
  padding: 0;
  color: inherit;
  font-family: var(--font-mono);
  font-size: var(--type-meta);
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}

.file__name:hover {
  text-decoration: underline;
}

/* Never wraps and never shrinks. This is three or four characters carrying the
   one fact the name does not, and a size broken across two lines is the row
   telling the operator its own layout gave up. */
.file__meta {
  font-size: var(--type-fine);
  color: var(--muted);
  flex: none;
  white-space: nowrap;
}

/* A file the app has and could not read. Says which reason it was and offers
   the two ways forward: the store answers 503 while it is opening, so the
   commonest failure here is one that has already stopped being true. */
.file__failed {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding: var(--space-4) var(--space-5);
}

.file__failed-actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex: none;
}

.file__foot .btn {
  margin-left: auto;
  flex: none;
}

/* The full view. Wider than an ordinary dialog because the whole point of it
   is that the bounds are off.

   `.dialog` is declared further down this file, so a one-class modifier here
   loses `width` to it on source order alone and the reading view came out at
   the ordinary 38rem. Doubled rather than moved, because the rest of the full
   view's rules belong beside the card they enlarge. */
.dialog.dialog--file {
  width: min(64rem, 100%);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 3rem);
}

/* Two rows in one grid rather than one row of four things. The name is the
   only part allowed to run out of room; everything else states a fact in a
   fixed number of characters and is placed where running out cannot happen to
   it. */
.file-view__head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  column-gap: var(--space-6);
  margin-bottom: var(--space-6);
}

.file-view__head .dialog__title {
  grid-column: 1;
  margin: 0;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* What it is and how big, under the name. Its own line because it is the line
   that used to be squeezed between a name that wanted the whole row and a pair
   of buttons that would not give any of it up: `48 KB` came out as `48` over
   `KB`, which is a dialog admitting it cannot lay out five characters. */
.file-view__what {
  grid-column: 1;
  margin: var(--space-1) 0 0;
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  color: var(--muted);
  white-space: nowrap;
}

.file-view__actions {
  grid-column: 2;
  grid-row: 1 / span 2;
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

/* Its own corner. Beside `Save a copy` it read as the second half of a pair of
   answers, which is part of why the first one looked like it might change the
   file rather than copy it out. */
.file-view__close {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 1.7rem;
  height: 1.7rem;
  flex: none;
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  color: var(--muted);
  font-size: var(--type-lede);
  line-height: var(--lead-flush);
}

.file-view__close:hover {
  background: var(--sunken);
  color: var(--text);
}

.file-view__body {
  flex: 1;
  min-height: 0;
  display: flex;
  overflow: auto;
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  background: var(--ground);
}

.file-view__body[data-kind="text"],
.file-view__body[data-kind="markdown"] {
  flex-direction: column;
  padding: var(--space-3) var(--space-4);
}

/* No mask, no height cap and no clip in here: this is the reading view, and
   the body above is the one thing in it that scrolls.

   `overflow` is the load-bearing one and is the least obvious. A clipping flex
   item has an automatic minimum size of zero, so the card's `overflow: hidden`
   left the document free to shrink to whatever room was going and swallow the
   rest of itself. Nothing overflowed the body, so nothing scrolled, and a
   brief opened for reading stopped at the height of the window with no
   scrollbar and no way down. */
.file-view__body .file__text,
.file-view__body .file__doc {
  max-height: none;
  overflow: visible;
  mask-image: none;
}

.file-view__body .file__text {
  font-size: var(--type-small);
}

/* The one place in the app where a document is read rather than glanced at, so
   the measure is capped the way prose is set. Full width, a heading two lines
   long crosses the whole window and the eye loses the return.

   Centered, because the cap is narrower than the dialog: left-aligned, the
   column sits against one edge with the rest of a 64rem window empty beside
   it, which reads as a layout that ran out rather than one that chose. */
.file-view__body .file__doc .md {
  font-size: var(--type-ui);
  max-width: 44rem;
  margin-inline: auto;
}

.file-view__image {
  margin: auto;
  max-width: 100%;
  max-height: calc(100vh - 12rem);
  object-fit: contain;
}

.file-view__frame {
  width: 100%;
  height: calc(100vh - 12rem);
  border: 0;
}

/* The typeahead sits above the box it belongs to, so a long list grows away
   from the composer rather than pushing it down the pane. */
.mentions {
  list-style: none;
  margin: 0;
  padding: var(--space-2);
  max-height: 14rem;
  overflow-y: auto;
  border-bottom: 1px solid var(--edge);
}

.mentions__item {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  width: 100%;
  padding: var(--space-2) var(--space-4);
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  text-align: left;
}

.mentions__item[data-active="true"] {
  background: var(--sunken);
}

.mentions__name {
  font-family: var(--font-display);
  font-size: var(--type-ui);
  font-weight: 500;
}

.mentions__skills {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  color: var(--faint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 55%;
}

.wire--writing::before,
.wire--writing::after {
  opacity: 0.5;
}

.wire--writing .wire__chip {
  position: relative;
}

/* Outside the pill, so the live chip is the exact box of the settled one. As a
   flex item the dots made it a dozen pixels wider, and a centered row slid
   sideways the instant the message landed. The thing worth noticing there is
   the message, not the row moving. */
.wire__dots {
  position: absolute;
  left: 100%;
  inset-block: 0;
  margin-left: var(--space-3);
  display: inline-flex;
  gap: var(--space-1);
  align-items: center;
}

.wire__dots i {
  width: 0.19rem;
  height: 0.19rem;
  border-radius: var(--radius-pill);
  background: currentColor;
  opacity: 0.4;
  animation: wire-dot 1.1s var(--ease-loop) infinite;
}

.wire__dots i:nth-child(2) { animation-delay: 0.15s; }
.wire__dots i:nth-child(3) { animation-delay: 0.3s; }

@keyframes wire-dot {
  0%, 100% { opacity: 0.25; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(-1.5px); }
}

/* One row: the box and the one control it needs. The box used to be a stack,
   with a permanent line of instructions and a Send button under it, which is
   two rows of chrome under every message anybody types. */
.composer__row {
  display: flex;
  align-items: flex-end;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3) var(--space-2) 0;
}

/* The box and the layer that paints its mentions, stacked. The layer is out of
   flow, so the textarea is still what gives the row its height and still what
   grows as the draft does. */
.composer__field {
  position: relative;
  flex: 1;
  min-width: 0;
}

/* Every property that decides where a character lands, declared once for both.
   They have to wrap identically to the pixel or a pill sits beside the name it
   belongs to instead of behind it, and that is a mismatch no assertion in a
   window with no layout can see. `styles.test.ts` holds the two together. */
.composer__mirror,
.composer__input {
  font: inherit;
  font-size: var(--type-body);
  line-height: var(--lead-read);
  /* A textarea does not inherit these; the layer under it does. Both are said
     out loud so the two cannot come apart on a UA default. */
  letter-spacing: inherit;
  word-spacing: inherit;
  padding: var(--space-2) var(--space-2) var(--space-2) var(--space-5);
  border: 0;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}

.composer__mirror {
  position: absolute;
  inset: 0;
  overflow: hidden;
  /* The text is here to place the pill, not to be read: the operator reads the
     textarea's own characters, directly on top of these. */
  color: transparent;
  user-select: none;
  pointer-events: none;
}

.composer__input {
  display: block;
  width: 100%;
  position: relative;
  resize: none;
  background: none;
  color: var(--text);
  outline: none;
  max-height: 12rem;
}

.composer__input::placeholder {
  color: var(--faint);
}

/* A name that resolved, drawn as one thing rather than as punctuation and a
   word. The same class does the job in a sent message and under the composer,
   which is why it changes no metric: no padding, no weight, no letter-spacing,
   nothing that moves a glyph by half a pixel. The room around the name is a
   spread shadow, which takes up none. */
.mention {
  border-radius: var(--radius-xs);
  background: color-mix(in oklab, var(--flesh) 26%, transparent);
  box-shadow: 0 0 0 2px color-mix(in oklab, var(--flesh) 26%, transparent);
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}

/* Round, in the accent, and the size of the line it sits beside. A word-width
   button is a label for something nothing else in the row could be. */
.composer__send {
  flex: none;
  /* Round, so the ladder gives it both dimensions at once. */
  width: var(--control-h-sm);
  height: var(--control-h-sm);
  margin-bottom: var(--space-1);
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: var(--flesh);
  color: var(--ground);
  font-size: var(--type-ui);
  line-height: var(--lead-flush);
  transition: background var(--tempo-tap) var(--ease), opacity var(--tempo-tap) var(--ease);
}

/* The other door into the same list, for a browser that has bytes rather
   than paths. The send button's size and shape, the ground's colors: an
   attach is a quiet act and a send is the loud one. */
.composer__attach {
  flex: none;
  width: var(--control-h-sm);
  height: var(--control-h-sm);
  margin-bottom: var(--space-1);
  display: grid;
  place-items: center;
  border: 1px solid var(--edge);
  border-radius: 50%;
  background: var(--ground);
  color: var(--muted);
  font-size: var(--type-ui);
  line-height: var(--lead-flush);
  transition: background var(--tempo-tap) var(--ease), color var(--tempo-tap) var(--ease);
}

.composer__attach:hover:not(:disabled) {
  background: var(--sunken);
  color: var(--text);
}

.composer__attach:disabled {
  color: var(--faint);
  cursor: not-allowed;
}

.composer__send:hover:not(:disabled) {
  background: color-mix(in oklab, var(--flesh) 86%, var(--text));
}

.composer__send:disabled {
  background: var(--edge);
  color: var(--faint);
  cursor: not-allowed;
}

.composer__foot {
  display: flex;
  align-items: center;
  padding: 0 var(--space-5) var(--space-3);
}

.hint {
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  letter-spacing: var(--track-flat);
  color: var(--faint);
}

.btn,
input[type="file"]::file-selector-button {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  border: 1px solid var(--edge);
  background: var(--raised);
  color: var(--text);
  /* Height is the token and the padding is horizontal only. Vertical padding
     is how a control ends up a different height from the one beside it: this
     was 0.38rem against the input's 0.48rem, so a button in a form row sat
     four pixels short of the field it belonged to. */
  min-height: var(--control-h);
  padding: 0 var(--space-5);
  border-radius: var(--radius-sm);
  font-size: var(--type-ui);
  font-weight: 500;
  transition: background var(--tempo-tap) var(--ease), border-color var(--tempo-tap) var(--ease);
}

.btn:hover:not(:disabled),
input[type="file"]:not(:disabled)::file-selector-button:hover {
  background: var(--sunken);
}

.btn:disabled,
input[type="file"]:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn--primary {
  background: var(--flesh);
  border-color: var(--flesh);
  color: var(--ground);
  font-weight: 600;
}

.btn--primary:hover:not(:disabled) {
  background: color-mix(in oklab, var(--flesh) 86%, var(--text));
}

.btn--danger {
  color: var(--alarm);
  border-color: color-mix(in oklab, var(--alarm) 40%, var(--edge));
}

.btn--danger:hover:not(:disabled) {
  background: color-mix(in oklab, var(--alarm) 10%, transparent);
}

.btn--ghost {
  border-color: transparent;
  background: none;
  color: var(--muted);
}

.btn--ghost:hover:not(:disabled) {
  background: var(--sunken);
  color: var(--text);
}

.btn--rail {
  border-color: transparent;
  background: none;
  color: var(--rail-muted);
  width: 100%;
  justify-content: flex-start;
  padding: var(--space-3) var(--space-6) var(--space-3) var(--space-4);
  gap: var(--space-2);
  font-family: var(--font-display);
  font-size: var(--type-ui);
  font-weight: 500;
  border-radius: 0;
}

.btn--rail:hover:not(:disabled) {
  background: var(--rail-raised);
  color: var(--rail-text);
}

.btn--rail[data-current="true"] {
  background: var(--rail-raised);
  color: var(--rail-text);
}

.field {
  display: block;
  margin-bottom: var(--space-6);
}

/* A setting that is a yes or a no. The label sits beside the control rather
   than above it, because a checkbox with its name overhead reads as a heading
   with an orphaned box under it. */
.field--row {
  display: flex;
  align-items: flex-start;
  gap: var(--space-4);
}

.field--row input[type="checkbox"] {
  margin-top: var(--space-2);
  flex: none;
}

.field--row .field__label,
.field--row .field__hint {
  display: block;
}

/* Three lists share these rules, and the name is theirs rather than any one of
   them: a plugin, a standing permission and a detected sign-in are all answers
   to "what can this reach". The name used to be `.connector`, which was true of
   one of the three. */
.access {
  margin-bottom: var(--column-inset);
}

/* The brand's mark in the brand's color, on a neutral chip.
   A colored chip with a white glyph would be the obvious choice and is the
   wrong one here: a brand that publishes a black mark would come out as a black
   square, which is not a logo. */
.mark {
  flex: none;
  width: 1.5rem;
  height: 1.5rem;
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  background: var(--sunken);
  border: 1px solid var(--edge);
  color: var(--mark, var(--muted));
  font-family: var(--font-display);
  font-size: var(--type-fine);
  font-weight: 700;
  line-height: var(--lead-flush);
}

/* A brand that publishes a black mark is not there at all on a dark chip.
   Mixed toward the foreground rather than replaced, so a brand that does have a
   color keeps most of it. The comment above rules out the other obvious fix. */
:root[data-surface="dark"] .mark {
  color: color-mix(in oklab, var(--mark, var(--muted)) 62%, var(--text));
}

.mark__icon {
  width: 0.85rem;
  height: 0.85rem;
  display: block;
}

/* The link under a plugin that is not connected yet. A link rather than a
   button because it is an address, and the operator is entitled to read where
   they are about to be sent before they are sent there. */
.access__docs {
  color: var(--flesh);
  text-decoration: underline;
  text-underline-offset: 2px;
}

.access__item {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4);
  margin-bottom: var(--space-3);
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  background: var(--sunken);
}

.access__row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.access__name {
  font-size: var(--type-small);
  font-weight: 600;
}

.access__account {
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  color: var(--faint);
}

.access__where {
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  color: var(--faint);
  flex: 1;
  min-width: 6rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.access__when {
  font-family: var(--font-mono);
  font-size: var(--type-mark);
  color: var(--faint);
  margin-left: auto;
}

/* One connected plugin's tools, one to a row, each with what the operator
   decided about it. Shut until asked for: a crew with three plugins connected
   has sixty of these between the operator and the Disconnect button. */
.toolset {
  list-style: none;
  margin: var(--space-2) 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

/* Wraps, because a narrowed tool grows a second line of names underneath it.
   The name, the sentence and the two answers stay on the first line at every
   width, and the crew drops below them rather than squeezing them. */
.toolset__item {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-4);
  padding: var(--space-2) 0;
  border-top: 1px solid var(--edge);
}

.toolset__item:first-child {
  border-top: 0;
}

/* The name and the vendor's sentence take whatever is left, and the two
   buttons keep their width: a tool with a paragraph of description must not
   push Allow and Deny off the end of the row. */
.toolset__text {
  flex: 1;
  min-width: 0;
}

.toolset__name {
  display: block;
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  color: var(--text);
}

/* Clamped rather than truncated to one line. Some servers write a paragraph
   per tool and some write four words, and two lines is enough of either to
   decide with. */
.toolset__blurb {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
  font-size: var(--type-fine);
  color: var(--muted);
}

/* Who ends up able to call a narrowed tool, once the plugin's answer and the
   tool's are both applied. Drawn in the body color rather than the muted one
   the sentence above it uses: it is the consequence of a decision the operator
   just made, and the vendor's blurb is background. */
.toolset__who {
  display: block;
  margin-top: var(--space-1);
  font-size: var(--type-fine);
  color: var(--text);
}

/* The names, on their own line under the row that narrowed the tool. A full
   basis rather than a wrap that happens to fall there: a crew of two would
   otherwise sit beside the answer buttons and read as a third answer. */
.toolset__crew {
  flex-basis: 100%;
}

/* The disclosure. A link's weight rather than a button's, because it reveals
   what is already there rather than changing anything. */
.toolset__more {
  align-self: flex-start;
  padding: 0;
  background: none;
  border: 0;
  color: var(--flesh);
  font-size: var(--type-fine);
  text-decoration: underline;
  text-underline-offset: 2px;
}

.access__ok,
.access__warn {
  margin: 0;
  font-size: var(--type-fine);
}

.access__ok {
  color: var(--mint);
}

.access__warn {
  color: var(--alarm);
}

.input--slim {
  width: auto;
  min-height: var(--control-h-sm);
  padding: 0 var(--space-3);
  font-size: var(--type-small);
}

.input--number {
  width: 3.6rem;
  font-variant-numeric: tabular-nums;
}

.btn--small {
  min-height: var(--control-h-sm);
  padding: 0 var(--space-4);
  font-size: var(--type-small);
}

.field__label {
  display: block;
  font-family: var(--font-mono);
  font-size: var(--type-fine);
  font-weight: 500;
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: var(--space-3);
}

.field__hint {
  font-size: var(--type-small);
  color: var(--faint);
  margin-top: var(--space-2);
  line-height: var(--lead-ui);
}

.input,
.textarea,
.select {
  width: 100%;
  border: 1px solid var(--edge);
  border-radius: var(--radius-sm);
  background: var(--ground);
  color: var(--text);
  font: inherit;
  font-size: var(--type-ui);
  min-height: var(--control-h);
  padding: 0 var(--space-4);
  outline: none;
}

.input:focus,
.textarea:focus,
.select:focus {
  border-color: color-mix(in oklab, var(--flesh) 60%, var(--edge));
}

.input--mono {
  font-family: var(--font-mono);
  font-size: var(--type-aside);
}

.textarea {
  resize: vertical;
  padding: var(--space-4);
  min-height: 5.5rem;
  line-height: var(--lead-read);
}

/* The scrim scrolls, not the dialog alone: on a short window a tall dialog
   would otherwise center itself with its top edge above the viewport, putting
   the first field permanently out of reach. */
.scrim {
  position: fixed;
  inset: 0;
  background: var(--scrim);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: var(--space-7);
  overflow-y: auto;
  z-index: 50;
  animation: fade var(--tempo-enter) var(--ease) both;
}

@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.scrim__close {
  position: fixed;
  inset: 0;
  border: 0;
  background: none;
  padding: 0;
  cursor: default;
}

.dialog {
  position: relative;
  width: min(38rem, 100%);
  margin: auto;
  background: var(--raised);
  border-radius: var(--radius);
  box-shadow: var(--lift-3);
  padding: var(--space-7);
}

/* ==========================================================================
   One arrival

   `.dialog` and `.palette` used to rise on a private 160ms curve, `.scrim`
   faded on a different 140ms one, and `.menu` did not animate at all: pressing
   + snapped a panel into existence while opening settings slid one in, and the
   two read as different applications. One keyframe, one rule, and a surface
   joins the set by adding its selector here rather than by inventing a
   gesture of its own.

   The origin is what makes it feel like one mechanism. A menu grows out of the
   corner nearest the button that was pressed, which its own component sets
   after it has measured where it fits; a dialog has no anchor and keeps the
   default. Without it every surface arrives from the same nowhere.
   ========================================================================== */
.dialog,
.palette,
.menu,
.menu__sub,
.orb__tag,
.spend,
.statusbar__form {
  animation: pop var(--tempo-enter) var(--ease) both;
  transform-origin: var(--pop-origin);
}

@keyframes pop {
  from {
    opacity: 0;
    transform: translateY(var(--pop-rise)) scale(0.98);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.dialog__title {
  font-family: var(--font-display);
  font-size: var(--type-lede);
  font-weight: 600;
  letter-spacing: var(--track-tight);
  margin: 0 0 var(--space-2);
}

.dialog__lede {
  font-size: var(--type-aside);
  color: var(--muted);
  margin: 0 0 var(--space-6);
  line-height: var(--lead-read);
}

.swatch {
