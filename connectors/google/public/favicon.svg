<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Guaca">
  <!--
    Two agents, looking at each other, which is what the app's own icon is of.
    It is a paper tile now, not an ink one: the app icon became the page's
    ground with the one that is talking in the attention amber and the one
    listening in ink, and the site's tab should be the same square a person
    sees in the Dock.

    The two outlines are `bodyPoints` from guaca's `avatars/form.ts` at rest,
    leaning after a look, walked at the 32 radii the app walks. The species
    numbers and the composition are guaca's `scripts/make-icon.py`, which is
    the file that ships the app icon and the one to re-read if either changes.
    An eye is a hole punched through to the tile rather than a dark shape laid
    on one, which is why both are the paper color.

    The tile here has no macOS content inset, because a favicon fills its
    square. The rim is drawn heavier than the app's 1024px hairline (0.6 of
    this box) on purpose: it is the only thing separating paper from a pale
    browser chrome, and at 16 pixels the app's weight disappears. 1.75 of 64
    survives to a crisp 16, and the .ico is the app's own rasters beside this
    file for the clients that never read the head.
  -->
  <rect width="64" height="64" rx="14" fill="#fbf9f3"/>
  <rect x="0.875" y="0.875" width="62.25" height="62.25" rx="13.125" fill="none" stroke="#181610" stroke-width="1.75"/>
