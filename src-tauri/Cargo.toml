[package]
name = "guac"
version = "0.5.1"
description = "Guac: a local, no-auth chat surface where you and your agents talk to each other."
authors = ["madebywelch"]
edition = "2021"
default-run = "guac"
rust-version = "1.99"

[patch.crates-io]
mac-usernotifications = { path = "vendor/mac-usernotifications" }

[lib]
name = "guac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
unicode-segmentation = "1"

tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
    "net",
    "io-util",
    "fs",
    "process",
    "signal",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
] }

tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"

tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "connect",
  "handshake",
  "rustls-tls-webpki-roots",
] }

axum = { version = "0.7", features = ["ws"], optional = true }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"], optional = true }
hyper = { version = "1", optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

iana-time-zone = "0.1"

ring = "0.17"

uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
sha2 = "0.10"
percent-encoding = "2"
base64 = "0.22"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-notification = { version = "2.3.3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = { version = "4.18.2", default-features = false, features = ["preview-macos-un"], optional = true }
mac-usernotifications = { version = "0.3.1", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSOperation", "block2"], optional = true }
block2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"], optional = true }

[[test]]
name = "server"
path = "tests/server.rs"
required-features = ["server"]

[[test]]
name = "unreachable"
path = "tests/unreachable.rs"
required-features = ["server"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "test-util"] }
axum = "0.7"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-user-notifications = "0.3"

[features]
default = ["desktop", "custom-protocol"]

desktop = [
  "dep:tauri",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-notification",
  "dep:notify-rust",
  "dep:mac-usernotifications",
  "dep:objc2",
  "dep:objc2-app-kit",
]

custom-protocol = ["tauri/custom-protocol"]

probe = ["desktop", "dep:objc2-foundation", "dep:block2"]

probe-host = []

server = ["dep:axum", "dep:tower-http", "dep:hyper", "dep:hyper-util"]

[[bin]]
name = "guac"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "guacad"
path = "src/bin/guacad.rs"
required-features = ["server"]

[[bin]]
name = "guaca-updater"
path = "src/bin/guaca-updater.rs"
required-features = ["server"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
