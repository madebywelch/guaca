[package]
name = "guac"
version = "0.4.0"
description = "Guac: a local, no-auth chat surface where you and your agents talk to each other."
authors = ["madebywelch"]
edition = "2021"
# `tauri dev` runs a bare `cargo run`, which cannot choose between two binaries.
default-run = "guac"
# The floor cargo refuses to build below, named to match the compiler the rest
# of the repository pins: `rust-toolchain.toml` for a checkout and the two
# `FROM rust:` lines for the containers. A lower number here would be a floor
# nothing builds on. Dependencies need 1.88 and the workspace's process lock
# needs `File::try_lock` from 1.89, so 1.99 is what is supported rather than
# what is required; `Atomic::try_update`, which replaced the deprecated
# `fetch_update`, is stable from 1.95, so lowering the floor is one edit.
rust-version = "1.99"

[patch.crates-io]
mac-usernotifications = { path = "vendor/mac-usernotifications" }

[lib]
name = "guac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is the menu bar presence. The image is decoded by
# `include_image!` at compile time, so no runtime image feature goes with it.
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"

# `process` and `fs` are what a repository check needs: `repo::verify` asks git
# rather than looking for a `.git`, and compares canonical paths on both sides.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
    "net",
    "io-util",
    "fs",
    "process",
    # The daemon stops on a signal rather than when a window closes, so it has
    # to be told: a container runtime sends SIGTERM and then loses patience.
    "signal",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
] }

# The computer viewer proxies to E2B over TLS and has to relay a WebSocket
# upgrade, which reqwest cannot do; this is the smallest thing that can.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"

# A browser is driven over the DevTools protocol, which is JSON-RPC on a
# WebSocket, and this is the client end of it. Not hand-rolled like the Connect
# framing in `e2b.rs`: that is a length prefix and a byte, whereas this is
# masking, fragmentation, continuation and control frames, on the connection
# that carries an agent's logged-in browser. A protocol bug there is a hang or a
# truncated page rather than an error, so it is worth one maintained dependency.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "connect",
  "handshake",
  "rustls-tls-webpki-roots",
] }

# The daemon's transport. Already a dev-dependency, where the test suites use
# it to script the servers this app dials; here it is the server this app *is*.
# `ws` because the event channel is a socket: a runtime pushes and a client
# never polls, which is what `EventSink` has always been.
axum = { version = "0.7", features = ["ws"], optional = true }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"], optional = true }
# The computer's screen reaches a browser through the daemon, and noVNC's
# transport is a WebSocket the daemon has to hand through untouched. axum
# answers the handshake; taking the connection over afterward is hyper's
# `upgrade`, and the adapter is what makes the taken-over socket a tokio one.
hyper = { version = "1", optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# A routine that repeats "every weekday" or "every month" cannot be a gap in
# seconds: a day is 23 or 25 hours twice a year and a month is four lengths, so
# a stored gap wanders off the hour it was set for. std has no calendar and no
# local zone; this is the smallest thing that has both.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# The zone this Mac is on, by its IANA name, which is what a host container is
# given as `TZ`. chrono already depends on it to find the local zone.
iana-time-zone = "0.1"

# Verifies a release manifest's Ed25519 signature before the updater installs
# anything it names. Already compiled in for TLS; this names it directly.
ring = "0.17"

uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
sha2 = "0.10"
percent-encoding = "2"
base64 = "0.22"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-notification = { version = "2.3.3", optional = true }

# On macOS the notification plugin raises banners through notify-rust, which by
# default uses NSUserNotificationCenter: deprecated, never asks for permission,
# and shows nothing while the app is in front. Naming notify-rust here only to
# turn on `preview-macos-un` moves the plugin's own calls to
# UNUserNotificationCenter, because Cargo builds one notify-rust with the union
# of every feature asked for. `mac-usernotifications` is the crate that feature
# pulls in, named directly so `notifications.rs` can read and request the
# permission through the same delegate and worker. Its version has to stay the
# one notify-rust resolves, or there would be two delegates fighting over one
# notification center.
[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = { version = "4.18.2", default-features = false, features = ["preview-macos-un"], optional = true }
mac-usernotifications = { version = "0.3.1", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSOperation", "block2"], optional = true }
block2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"], optional = true }

[[test]]
name = "server"
path = "tests/server.rs"
required-features = ["server"]

# The other half of the same question: `server.rs` asks what the daemon's
# transport promises, and this asks what it promises when the account service
# is not there at all. Declared rather than discovered so the desktop pass,
# which has no daemon, does not build a binary with nothing in it.
[[test]]
name = "unreachable"
path = "tests/unreachable.rs"
required-features = ["server"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "test-util"] }
axum = "0.7"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-user-notifications = "0.3"

[features]
default = ["desktop", "custom-protocol"]

# The desktop app: a window, a menu bar, and the Tauri IPC transport.
#
# Optional rather than assumed, and the reason is not binary size. `app.rs`
# expands `tauri::generate_context!`, which reads `dist/` at compile time, so
# with Tauri unconditional the *daemon* cannot be built without first building
# a frontend it will never serve from disk. A server that needs a webview
# bundle to compile is a server nobody can build in CI.
desktop = [
  "dep:tauri",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-notification",
  "dep:notify-rust",
  "dep:mac-usernotifications",
  "dep:objc2",
  "dep:objc2-app-kit",
]

# Serves the bundled `dist/` instead of the dev server. Its own feature because
# `tauri dev` drops every default feature that enables it: inside `desktop`,
# that took `desktop` with it and left `cargo run` with no binary it could build.
custom-protocol = ["tauri/custom-protocol"]

# A test build with a control socket in it, for `scripts/probe.py`: a script
# reads the app's state and acts in its windows the way a person would. Never
# part of another feature (a unit test in `probe.rs` holds that) and refused at
# compile time with optimizations on, so a release cannot carry it. See
# docs/PROBE.md.
probe = ["desktop", "dep:objc2-foundation", "dep:block2"]

# The scratch Host's clock for the same script: started with
# GUACA_PROBE_MINUTE_MS, a Host built with this counts the outbox's two waits
# in shorter minutes. Never part of another feature and refused with
# optimizations on, like `probe`. See `probe_clock.rs`.
probe-host = []

# The daemon: the same runtime, reached over HTTP and a socket.
server = ["dep:axum", "dep:tower-http", "dep:hyper", "dep:hyper-util"]

[[bin]]
name = "guac"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "guacad"
path = "src/bin/guacad.rs"
required-features = ["server"]

[[bin]]
name = "guaca-updater"
path = "src/bin/guaca-updater.rs"
required-features = ["server"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
