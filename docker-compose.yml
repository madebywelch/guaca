services:
  guacad:
    build:
      context: .
      args:
        GUACA_COMMIT: ${GUACA_COMMIT:-}
    image: guacad
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - guaca:/var/lib/guaca
    environment:
      GUACA_TOKEN: ${GUACA_TOKEN:-}
      GUACA_UPDATE_CHECKS: ${GUACA_UPDATE_CHECKS:-on}
      GUACA_ACCOUNT_ORIGIN: ${GUACA_ACCOUNT_ORIGIN:-}
      GUACA_BROKER_BEARER: ${GUACA_BROKER_BEARER:-}
      TZ: ${TZ:-UTC}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  guaca:
