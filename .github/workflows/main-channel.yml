name: main channel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-channel
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/madebywelch/guaca/guacad

jobs:
  build:
    name: build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: aws-linux-4cpu-16gb
          - arch: arm64
            runner: aws-linux-arm-2cpu-4gb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read the version this commit carries
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            GUACA_COMMIT=${{ github.sha }}
            GUACA_VERSION=${{ steps.version.outputs.version }}
            GUACA_RELEASE=0
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=guacad-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=guacad-${{ matrix.arch }},ignore-error=true

      - name: Keep the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: aws-linux-2cpu-4gb
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag both architectures as one image
        id: image
        run: |
          cd "$RUNNER_TEMP/digests"
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            --tag "$IMAGE:main" \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            $(printf "$IMAGE@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          case "$digest" in
            sha256:*) echo "digest=$digest" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::The registry named no digest for $IMAGE:sha-$GITHUB_SHA."; exit 1 ;;
          esac

      - name: Check that a box can pull it
        run: |
          docker logout ghcr.io
          if ! docker buildx imagetools inspect "$IMAGE@${{ steps.image.outputs.digest }}" > /dev/null; then
            echo "::error::$IMAGE is not public, so no box can pull it. Open https://github.com/madebywelch/guaca/pkgs/container/guaca%2Fguacad, choose Package settings, set the visibility to Public, then re-run this workflow."
            exit 1
          fi

      - name: Check that this build is newer than the published one
        id: tip
        run: |
          published=""
          if git fetch --quiet origin main-feed 2> /dev/null; then
            published=$(git show FETCH_HEAD:guaca-main.json | jq -r .manifest | base64 -d | jq -r .commit)
          fi
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$published" = "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_SHA is already published."
            echo "current=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$published" ] || git merge-base --is-ancestor "$published" "$GITHUB_SHA" || [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$published is published and newer than $GITHUB_SHA; not moving the feed backward."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign the feed
        if: steps.tip.outputs.current == 'true'
        env:
          GUACA_BACKEND_IMAGE: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          GUACA_MAIN_SIGNING_KEY: ${{ secrets.GUACA_MAIN_SIGNING_KEY }}
        run: |
          if [ -z "$GUACA_MAIN_SIGNING_KEY" ]; then
            echo "::error::The GUACA_MAIN_SIGNING_KEY secret is not set, so no box would trust this build. Set it to the key whose public half is in main-keys.pub."
            exit 1
          fi
          node scripts/release-manifest.mjs --channel main "$RUNNER_TEMP/guaca-main.json"

      - name: Publish the feed
        if: steps.tip.outputs.current == 'true'
        run: |
          if git fetch --quiet origin main-feed 2> /dev/null; then
            git switch --quiet --force-create main-feed FETCH_HEAD
          else
            git switch --quiet --orphan main-feed
          fi
          cp "$RUNNER_TEMP/guaca-main.json" guaca-main.json
          git add guaca-main.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "main at $GITHUB_SHA"
          git push --quiet origin main-feed
          echo "Published $GITHUB_SHA as ${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
