name: release image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in the release checkout
        required: true
        type: string

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/madebywelch/guaca/guacad
  BROWSER: ghcr.io/madebywelch/guaca/browser

jobs:
  build:
    name: build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: aws-linux-4cpu-16gb
          - arch: arm64
            runner: aws-linux-arm-2cpu-4gb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify the release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          actual=$(jq -r .version package.json)
          if [ "$VERSION" != "$actual" ] || ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The requested version must be the stable version in package.json."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            GUACA_COMMIT=${{ github.sha }}
            GUACA_VERSION=${{ inputs.version }}
            GUACA_RELEASE=1
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          cache-from: type=gha,scope=guacad-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=guacad-${{ matrix.arch }},ignore-error=true

      - name: Build and push the browser
        id: browser
        uses: docker/build-push-action@v6
        with:
          context: deploy/browser
          platforms: linux/${{ matrix.arch }}
          build-args: |
            GUACA_COMMIT=${{ github.sha }}
            GUACA_VERSION=${{ inputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          outputs: type=image,name=${{ env.BROWSER }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          cache-from: type=gha,scope=browser-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=browser-${{ matrix.arch }},ignore-error=true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull the pushed images to check them on this architecture
        env:
          HOST_DIGEST: ${{ steps.build.outputs.digest }}
          BROWSER_DIGEST: ${{ steps.browser.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          [ "$(uname -m)" = "$([ "$ARCH" = amd64 ] && echo x86_64 || echo aarch64)" ]
          docker pull "$IMAGE@$HOST_DIGEST"
          docker pull "$BROWSER@$BROWSER_DIGEST"
          [ "$(docker image inspect -f '{{.Architecture}}' "$BROWSER@$BROWSER_DIGEST")" = "$ARCH" ]

      - name: The browser reaches the public web and nothing else
        env:
          BROWSER_IMAGE: ${{ env.BROWSER }}@${{ steps.browser.outputs.digest }}
          STANDIN_IMAGE: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: ./scripts/browser-isolation.sh

      - name: An agent with no Kernel key reads a public page through it
        env:
          BROWSER_IMAGE: ${{ env.BROWSER }}@${{ steps.browser.outputs.digest }}
          GUACAD_IMAGE: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: python3 scripts/browser-e2e.py

      - name: Keep the digests
        env:
          HOST_DIGEST: ${{ steps.build.outputs.digest }}
          BROWSER_DIGEST: ${{ steps.browser.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests/guacad" "$RUNNER_TEMP/digests/browser"
          touch "$RUNNER_TEMP/digests/guacad/${HOST_DIGEST#sha256:}"
          touch "$RUNNER_TEMP/digests/browser/${BROWSER_DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    needs: build
    runs-on: aws-release-linux-2cpu-4gb
    timeout-minutes: 15
    concurrency:
      group: release-image-${{ inputs.version }}
      queue: max
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the version tags before writing them
        id: existing
        env:
          VERSION: ${{ inputs.version }}
        run: |
          published=()
          for repository in "$IMAGE" "$BROWSER"; do
            tag="$repository:$VERSION"
            prior="$RUNNER_TEMP/prior-index"
            if docker buildx imagetools inspect --raw "$tag" > "$prior" 2> "$prior.error"; then
              number=$(jq -er '.annotations["io.github.actions.run-number"] // "0"' "$prior")
              [[ "$number" =~ ^[0-9]+$ ]]
              if [ "$number" -gt "$GITHUB_RUN_NUMBER" ]; then
                echo "::error::$tag was already published by newer run $number."
                exit 1
              fi
              if [ "$number" -eq "$GITHUB_RUN_NUMBER" ]; then
                published+=("$repository")
              fi
            elif ! grep -qE 'manifest unknown|: not found$' "$prior.error"; then
              cat "$prior.error" >&2
              exit 1
            fi
          done
          if [ "${#published[@]}" -eq 2 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.existing.outputs.published != 'true'
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: release-digests-*

      - name: Publish the multi-platform images
        if: steps.existing.outputs.published != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd "$RUNNER_TEMP/digests"
          guacad=()
          browser=()
          for arch in amd64 arm64; do
            for image in guacad browser; do
              files=("release-digests-$arch/$image"/*)
              [ "${#files[@]}" -eq 1 ]
              digest=${files[0]##*/}
              [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
              if [ "$image" = guacad ]; then
                guacad+=("$IMAGE@sha256:$digest")
              else
                browser+=("$BROWSER@sha256:$digest")
              fi
            done
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" \
            --annotation "index:io.github.actions.run-number=$GITHUB_RUN_NUMBER" "${guacad[@]}"
          docker buildx imagetools create --tag "$BROWSER:$VERSION" \
            --annotation "index:io.github.actions.run-number=$GITHUB_RUN_NUMBER" "${browser[@]}"

      - name: Check that a Mac can pull the browser
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker logout ghcr.io
          if ! docker buildx imagetools inspect "$BROWSER:$VERSION" > /dev/null; then
            echo "::error::$BROWSER is not public, so no Mac can download the browser. Open https://github.com/madebywelch/guaca/pkgs/container/guaca%2Fbrowser, choose Package settings, set the visibility to Public, then re-run this workflow."
            exit 1
          fi

      - name: Record the published digests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for pair in "GUACA_BACKEND_IMAGE $IMAGE" "GUACA_BROWSER_IMAGE $BROWSER"; do
            read -r variable repository <<< "$pair"
            digest=$(docker buildx imagetools inspect "$repository:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
            case "$digest" in
              sha256:*) echo "$variable=$repository@$digest" >> "$GITHUB_STEP_SUMMARY" ;;
              *) echo "::error::The registry named no digest for $repository:$VERSION."; exit 1 ;;
            esac
          done
