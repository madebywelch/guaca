name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  grants:
    name: grants (comments, suppressions, prose files)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          GRANTS_APPROVALS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: ./scripts/ci.sh grants

  web:
    name: web, scripts, assets, connector
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            connectors/google/pnpm-lock.yaml
      - id: install
        run: pnpm install --frozen-lockfile
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ./scripts/ci.sh assets
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ./scripts/ci.sh scripts
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ./scripts/ci.sh web
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ./scripts/ci.sh connector

  desktop:
    name: rust desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Tauri headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - run: rustup toolchain install
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: ./scripts/ci.sh desktop

  daemon:
    name: rust daemon (no Tauri, no frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: ./scripts/ci.sh daemon

  formal:
    name: formal (TLA+ model check)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/guaca
          key: tla2tools-${{ hashFiles('scripts/formal.sh') }}
      - run: ./scripts/ci.sh formal

  image:
    name: images (Dockerfile.ci and the daemon image)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the verification image
        run: docker build -f Dockerfile.ci -t guac-ci .
      - name: Build the daemon image and prove it answers
        run: ./scripts/image.sh

  e2e:
    name: end-to-end scenarios (guacad, headless Chromium, stand-in model)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Let Chromium sandbox itself under Ubuntu's AppArmor user namespace rule
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: ./scripts/ci.sh e2e
      - name: Keep the scenario evidence of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-evidence
          path: src-tauri/target/verify/evidence
          retention-days: 7

  space:
    name: space (the daemon image run as a Fly space, in Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Let Chromium sandbox itself under Ubuntu's AppArmor user namespace rule
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: ./scripts/ci.sh space
      - name: Keep the space proof's evidence of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: space-evidence
          path: src-tauri/target/verify/evidence/space
          retention-days: 7

  gate:
    if: always()
    needs: [grants, web, desktop, daemon, formal, image, e2e, space]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
