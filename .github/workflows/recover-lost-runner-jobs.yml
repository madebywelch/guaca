name: Recover lost runner jobs

on:
  workflow_run:
    workflows:
      - ci
      - judge
      - main channel
      - release image
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

concurrency:
  group: recover-lost-runner-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    name: Recover lost runner jobs
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false

      - name: Rerun only runner-loss failures
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node scripts/recover-lost-runner-jobs.mjs
