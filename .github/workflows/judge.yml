name: judge

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: judge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  judge:
    name: judge (main's grants lint on the pull request)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main, whose scripts are the only code this job runs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false
      - name: Check out the pull request as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: main/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - working-directory: main
        run: pnpm install --frozen-lockfile
      - working-directory: main
        env:
          GRANTS_APPROVALS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: node scripts/check-grants.mjs judge --repo ../head
